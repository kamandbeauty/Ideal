name: motionshot
description: >-
  MotionShot — turn photos into a cinematic video with real camera motion.
  Fully offline, no accounts, no cloud.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State + routing (no code generation anywhere in this project)
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # Matrix4 for the preview painters (transitive dep of Flutter, declared
  # because lib/ imports it directly).
  vector_math: ^2.1.4

  # Storage
  sqflite: ^2.3.3
  path_provider: ^2.1.4
  path: ^1.9.0
  shared_preferences: ^2.3.2

  # Media playback of the finished export
  video_player: ^2.9.1

  # Background-music playback in the live preview (local files only)
  just_audio: ^0.9.43

  # Photo import. On Android this routes through the system Photo Picker
  # (ACTION_PICK_IMAGES), so no storage permission is ever requested.
  image_picker: ^1.1.2

  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
          weight: 400
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
