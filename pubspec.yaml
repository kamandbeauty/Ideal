name: javid_ai
description: "JavidAI — دستیار هوشمند صوتی اندروید: یادداشت، وظیفه، پیام و خلاصهٔ روزانه"
publish_to: 'none'
version: 0.1.0+3

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Local storage (offline-first)
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4

  # Speech input (native Android SpeechRecognizer under the hood)
  speech_to_text: ^7.1.0

  # Utilities
  intl: any
  uuid: ^4.5.1
  url_launcher: ^6.3.1
  http: ^1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.3.6
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
          weight: 400
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
