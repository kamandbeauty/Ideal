<!doctype html>
<html lang="fa">
<head>
<meta charset="utf-8" />
<title>۱۵۱۸ — رقص استراسبورگ</title>
<style>
  @font-face { font-family: 'Vazirmatn'; src: url('fonts/vazirmatn-arabic-700-normal.woff2') format('woff2'); font-weight: 700; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #070605; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0908; }

  /* ---------- the plate ---------- */
  #plateWrap { position: absolute; inset: 0; overflow: hidden; }
  #plate {
    position: absolute; left: 50%; top: 50%;
    width: 1080px; height: 1920px; object-fit: cover;
    transform-origin: 50% 50%;
    will-change: transform; backface-visibility: hidden;
  }
  .fallback { position: absolute; inset: 0;
    background: linear-gradient(180deg, #8fa6ad 0%, #b9b39c 42%, #cbb98f 58%, #6d5c46 100%); }

  /* ---------- graded overlays ---------- */
  #vignette { position: absolute; inset: 0; pointer-events: none;
    background:
      radial-gradient(120% 78% at 50% 42%, rgba(0,0,0,0) 38%, rgba(14,9,4,.46) 86%, rgba(10,7,3,.66) 100%),
      linear-gradient(180deg, rgba(8,6,4,.30) 0%, rgba(8,6,4,0) 16%, rgba(8,6,4,0) 70%, rgba(8,6,4,.52) 100%); }
  #warm { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: screen; opacity: 0;
    background: radial-gradient(58% 40% at 50% 62%, rgba(255,186,96,.40) 0%, rgba(255,150,60,.16) 45%, rgba(255,140,50,0) 78%); }
  #fog { position: absolute; inset: 0; pointer-events: none; opacity: 0;
    background: linear-gradient(0deg, rgba(232,220,196,.30) 0%, rgba(232,220,196,.10) 16%, rgba(232,220,196,0) 40%); }
  #boil { position: absolute; inset: 0; pointer-events: none; opacity: .5; mix-blend-mode: soft-light;
    background: radial-gradient(70% 46% at 30% 30%, rgba(255,236,200,.20) 0%, rgba(255,236,200,0) 70%); }
  .grain { position: absolute; inset: -80px; pointer-events: none; opacity: .075; mix-blend-mode: overlay;
    background-image: url("assets/grain.png"); background-repeat: repeat; background-size: 256px 256px; }
  #flash { position: absolute; inset: 0; background: #050403; opacity: 0; pointer-events: none; }

  /* ---------- dust ---------- */
  #dust { position: absolute; inset: 0; pointer-events: none; }
  #dust i { position: absolute; width: 3px; height: 3px; border-radius: 50%;
    background: rgba(255,236,200,.55); box-shadow: 0 0 6px rgba(255,220,170,.35); }

  /* ---------- kinetic subtitles ---------- */
  #sub { position: absolute; left: 64px; right: 64px; bottom: 128px;
    direction: rtl; text-align: center; font-family: 'Vazirmatn', sans-serif; font-weight: 700;
    font-size: 60px; line-height: 1.55; letter-spacing: -.5px; color: #fff;
    text-shadow: 0 6px 22px rgba(0,0,0,.92), 0 2px 6px rgba(0,0,0,.95), 0 0 30px rgba(0,0,0,.7);
    -webkit-text-stroke: 2.4px rgba(0,0,0,.55); paint-order: stroke fill; }
  #sub .w { display: inline-block; margin: 0 .07em; will-change: transform, opacity, filter; }
  #sub .w.hot { color: #f3c179; -webkit-text-stroke: 2.4px rgba(40,20,0,.6); }
  #sub .rule { display: block; margin: 18px auto 0; width: 0; height: 3px; border-radius: 2px;
    background: linear-gradient(90deg, rgba(243,193,121,0), rgba(243,193,121,.95), rgba(243,193,121,0)); }
</style>
</head>
<body>
<div id="stage">
  <div id="plateWrap">
    <div class="fallback" id="fallback"></div>
    <img id="plate" alt="" />
  </div>
  <div id="fog"></div>
  <div id="warm"></div>
  <div id="boil"></div>
  <div id="dust"></div>
  <div id="vignette"></div>
  <div class="grain" id="grain"></div>
  <div id="flash"></div>
  <div id="sub"></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const easeInOut = (p) => (p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2);
// a calmer curve for camera moves: slow out of the cut, slow into the next
const easeCamera = (p) => 0.5 - 0.5 * Math.cos(Math.PI * clamp(p, 0, 1));
const hash = (a, b) => {
  const x = Math.sin(a * 127.1 + b * 311.7) * 43758.5453;
  return x - Math.floor(x);
};

let DATA = null;
let current = -1;
let cueKey = '';
let words = [];
let dust = [];

/* --------------------------------------------------------------- camera --- */
// k: zoom, a: the plate point that sits at the centre of the frame
const MOVES = {
  in:   (amt) => ({ k0: 1.07, k1: 1.07 + 0.22 * amt }),
  out:  (amt) => ({ k0: 1.07 + 0.22 * amt, k1: 1.07 }),
  panR: (amt) => ({ k0: 1.15 + 0.10 * amt, k1: 1.15 + 0.10 * amt }),
  panL: (amt) => ({ k0: 1.15 + 0.10 * amt, k1: 1.15 + 0.10 * amt }),
  tiltU: (amt) => ({ k0: 1.15 + 0.10 * amt, k1: 1.15 + 0.10 * amt }),
  tiltD: (amt) => ({ k0: 1.15 + 0.10 * amt, k1: 1.15 + 0.10 * amt }),
  inL:  (amt) => ({ k0: 1.08, k1: 1.08 + 0.18 * amt }),
  inR:  (amt) => ({ k0: 1.08, k1: 1.08 + 0.18 * amt }),
  hold: (amt) => ({ k0: 1.05, k1: 1.05 + 0.06 * amt }),
};

function cameraAt(sc, t, k0p) {
  const { k0, k1 } = (MOVES[sc.move] || MOVES.hold)(sc.amt ?? 0.8);
  const k = k0 + (k1 - k0) * k0p;
  const a0 = sc.a0 || [0.5, 0.5];
  const a1 = sc.a1 || a0;
  const ax = a0[0] + (a1[0] - a0[0]) * k0p;
  const ay = a0[1] + (a1[1] - a0[1]) * k0p;

  // where the plate point (ax, ay) must sit for the frame centre
  const maxX = ((k - 1) * 1080) / 2;
  const maxY = ((k - 1) * 1920) / 2;
  let tx = (0.5 - ax) * 1080 * k;
  let ty = (0.5 - ay) * 1920 * k;
  tx = clamp(tx, -maxX, maxX);
  ty = clamp(ty, -maxY, maxY);

  // hand-held: two incommensurate sines, kept small so the painting stays still
  const hx = Math.sin(t * 0.13 * Math.PI * 2) * 4 + Math.sin(t * 0.31 * Math.PI * 2 + 1.7) * 2;
  const hy = Math.sin(t * 0.11 * Math.PI * 2 + 0.6) * 3.4 + Math.sin(t * 0.27 * Math.PI * 2 + 2.3) * 1.6;
  const rot = Math.sin(t * 0.083 * Math.PI * 2 + 2.1) * 0.16;
  const breathe = 1 + Math.sin(t * 0.19 * Math.PI * 2 + 0.9) * 0.0035;
  return { tx: tx + hx, ty: ty + hy, k: k * breathe, rot };
}

/* ------------------------------------------------------------- subtitles --- */
function setCue(cue) {
  const sub = $('sub');
  sub.innerHTML = '';
  words = [];
  if (!cue) return;
  const parts = cue.text.split(/\s+/).filter(Boolean);
  // the longest word gets the ochre accent — it is usually the one that carries
  // the line, and highlighting it turns the caption into typography, not a label
  // کوتاه‌ترین کلمات (و، که، به…) و نشانه‌ها هرگز لهجه نمی‌گیرند
  const light = new Set(['و', 'که', 'به', 'در', 'از', 'با', 'را', 'این', 'اون', 'یه', 'تا', 'هم', 'بر', 'نه', 'آره', 'یا', 'چه', 'می', 'نمی']);
  const score = (w, i) => (light.has(w) ? -1 : w.replace(/[\u200c\u200f\u064b-\u0652]/g, '').length);
  let hot = -1;
  parts.forEach((w, i) => { if (hot < 0 || score(w, i) > score(parts[hot], hot)) hot = i; });
  if (score(parts[hot], hot) < 0) hot = parts.reduce((a, w, i) => (w.length > parts[a].length ? i : a), 0);
  parts.forEach((text, i) => {
    const s = document.createElement('span');
    s.className = 'w' + (i === hot ? ' hot' : '');
    s.textContent = text;
    if (i) sub.appendChild(document.createTextNode('\u200c'));  // ZWNJ keeps RTL words
    sub.appendChild(s);                                       // from welding together
    words.push(s);
  });
  const rule = document.createElement('span');
  rule.className = 'rule';
  sub.appendChild(rule);
  sub.__rule = rule;
}

function paintCue(cue, t) {
  if (!cue) return;
  const stagger = 0.045;
  const inDur = 0.15;
  const outStart = cue.end - 0.12;
  const out = clamp((t - outStart) / 0.12, 0, 1);
  for (let i = 0; i < words.length; i++) {
    const p = clamp((t - (cue.start + i * stagger)) / inDur, 0, 1);
    const e = easeOutBack(p);
    const y = (1 - e) * 22 - out * 10;
    const sc = 0.94 + 0.06 * e;
    words[i].style.opacity = String(clamp(p * 1.2, 0, 1) * (1 - out));
    words[i].style.transform = `translateY(${y.toFixed(2)}px) scale(${sc.toFixed(3)})`;
    words[i].style.filter = `blur(${((1 - p) * 5).toFixed(2)}px)`;
  }
  const rule = $('sub').__rule;
  if (rule) {
    const rp = clamp((t - cue.start - Math.min(0.28, words.length * stagger)) / 0.24, 0, 1);
    rule.style.width = `${(rp * 210).toFixed(1)}px`;
    rule.style.opacity = String(rp * 0.9 * (1 - out));
  }
}

function easeOutBack(p) {
  const c = 1.70158;
  return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2);
}

/* ------------------------------------------------------------------ dust --- */
function initDust() {
  const box = $('dust');
  box.innerHTML = '';
  dust = [];
  for (let i = 0; i < 18; i++) {
    const el = document.createElement('i');
    box.appendChild(el);
    dust.push({ el, x: hash(i, 1), y: hash(i, 2), s: 0.4 + hash(i, 3) * 0.9, ph: hash(i, 4) * 6.28 });
  }
}

function paintDust(t, warm) {
  for (const d of dust) {
    const x = (d.x * 1080 + Math.sin(t * 0.11 + d.ph) * 26 + t * 6 * d.s) % 1120;
    const y = 1920 - ((d.y * 1920 + t * 16 * d.s + Math.sin(t * 0.09 + d.ph) * 30) % 2100);
    d.el.style.transform = `translate(${x.toFixed(1)}px, ${(1920 - y).toFixed(1)}px)`;
    d.el.style.opacity = String((0.10 + 0.25 * warm) * (0.55 + 0.45 * Math.sin(t * 0.7 + d.ph)));
  }
}

/* ------------------------------------------------------------------ build -- */
async function build() {
  const plates = [...new Set(DATA.SCENES.map((s) => s.plate))];
  await Promise.all(plates.map((p) => new Promise((res) => {
    const im = new Image();
    im.onload = res; im.onerror = res;
    im.src = `assets/plates/${p}.jpg`;
  })));

  initDust();

  const cueAt = (t) => {
    for (let i = 0; i < DATA.CUES.length; i++) {
      const c = DATA.CUES[i];
      if (t >= c.start - 0.02 && t < c.end + 0.06) return c;
    }
    return null;
  };

  function seek(frame) {
    const t = frame / DATA.FPS;
    const si = DATA.SENTENCES.findIndex((s) => t >= s.start && t < s.end + 0.001);
    const idx = si === -1 ? DATA.SENTENCES.length - 1 : si;
    if (idx !== current) {
      current = idx;
      const sc = DATA.SCENES[idx];
      const img = $('plate');
      img.src = `assets/plates/${sc.plate}.jpg`;
      $('fallback').style.opacity = '0.35';
    }
    const sc = DATA.SCENES[current];
    const sen = DATA.SENTENCES[current];
    const p = clamp((t - sen.start) / Math.max(0.001, sen.end - sen.start), 0, 1);
    const cam = cameraAt(sc, t, easeCamera(p));
    $('plate').style.transform =
      `translate(-50%, -50%) translate(${cam.tx.toFixed(2)}px, ${cam.ty.toFixed(2)}px) rotate(${cam.rot.toFixed(3)}deg) scale(${cam.k.toFixed(4)})`;

    // light + atmosphere
    const warm = sc.warm ?? 0.15;
    $('warm').style.opacity = String(warm * (0.72 + 0.28 * Math.sin(t * 0.7 * Math.PI + 1.2)));
    $('fog').style.opacity = String(sc.fog ?? 0.2);
    $('fog').style.transform = `translateY(${(Math.sin(t * 0.12) * 10).toFixed(2)}px)`;

    // grain: two positions, swapped a couple of times a second — reads as film
    const g = $('grain');
    const tick = Math.floor(t * 12) % 3;
    g.style.backgroundPosition = `${tick * 60}px ${((tick * 97) % 180)}px`;

    // cut flash
    $('flash').style.opacity = String(clamp(1 - (t - sen.start) / 0.16, 0, 1) * 0.42);

    paintDust(t, warm);

    const cue = cueAt(t);
    const key = cue ? cue.start + '|' + cue.text : '';
    if (key !== cueKey) { cueKey = key; setCue(cue); }
    paintCue(cue, t);
  }

  window.__MOTION__ = {
    fps: DATA.FPS, frames: DATA.FRAMES, width: 1080, height: 1920, duration: DATA.DURATION,
    ready: false,
    seek(frame) { seek(clamp(frame, 0, DATA.FRAMES - 1)); },
  };
  seek(0);
  window.__MOTION__.ready = true;
}

window.__ENGINE_START__ = (data) => { DATA = data; return build(); };
</script>
</body>
</html>
