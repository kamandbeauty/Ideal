<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>KAMAND VOX — paper collage scroll (37s)</title>
<style>
  @font-face{font-family:Estedad;src:url('./fonts/estedad-arabic-400-normal.woff2') format('woff2');font-weight:400;font-display:block}
  @font-face{font-family:Estedad;src:url('./fonts/estedad-arabic-700-normal.woff2') format('woff2');font-weight:700;font-display:block}
  @font-face{font-family:Estedad;src:url('./fonts/estedad-arabic-800-normal.woff2') format('woff2');font-weight:800;font-display:block}
  @font-face{font-family:Estedad;src:url('./fonts/estedad-arabic-900-normal.woff2') format('woff2');font-weight:900;font-display:block}
  @font-face{font-family:Vazirmatn;src:url('./fonts/vazirmatn-arabic-400-normal.woff2') format('woff2');font-weight:400;font-display:block}
  @font-face{font-family:Vazirmatn;src:url('./fonts/vazirmatn-arabic-600-normal.woff2') format('woff2');font-weight:600;font-display:block}
  @font-face{font-family:Vazirmatn;src:url('./fonts/vazirmatn-arabic-700-normal.woff2') format('woff2');font-weight:700;font-display:block}

  :root{
    --paper:#f2ede1; --ink:#1b1a17; --red:#d92b25; --redBright:#f0443a;
    --cream:#fbf7ee; --tape:#e8d9ae;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  #stage{position:absolute;left:50%;top:50%;width:1080px;height:1920px;
    transform-origin:center;overflow:hidden;background:var(--paper);
    font-family:Estedad,Vazirmatn,system-ui,sans-serif;color:var(--ink);direction:rtl}

  #camera{position:absolute;left:0;top:0;width:1080px;height:1920px;will-change:transform}
  #canvas{position:absolute;left:0;top:0;width:1080px;height:7200px}
  #grain{position:absolute;inset:0;pointer-events:none;opacity:.55;
    background:
      repeating-linear-gradient(0deg,rgba(90,80,60,.05) 0 1px,transparent 1px 4px),
      repeating-linear-gradient(90deg,rgba(90,80,60,.04) 0 1px,transparent 1px 6px),
      repeating-linear-gradient(47deg,rgba(255,255,255,.32) 0 2px,transparent 2px 9px),
      radial-gradient(ellipse 80% 45% at 30% 10%,#fbf7ec 0%,transparent 70%),
      radial-gradient(ellipse 70% 40% at 80% 60%,#e7dfcc 0%,transparent 75%);
    will-change:transform}
  #halftone{position:absolute;inset:0;pointer-events:none;opacity:.26;will-change:transform;
    background-image:radial-gradient(var(--red) 1.6px,transparent 1.7px);background-size:14px 14px;
    -webkit-mask-image:linear-gradient(90deg,#000 0,transparent 30%,transparent 70%,#000 100%);
    mask-image:linear-gradient(90deg,#000 0,transparent 30%,transparent 70%,#000 100%)}
  #bg,#scraps,#furniture,#clusters{position:absolute;inset:0;pointer-events:none}
  #bg,#scraps{will-change:transform}
  #clusters,#furniture{pointer-events:none}

  .num{position:absolute;font-family:Estedad;font-weight:900;font-size:330px;
    color:rgba(27,26,23,.065);line-height:1;direction:ltr;user-select:none;transition:color .2s}
  .num.active{color:rgba(217,43,37,.13)}
  .rule{position:absolute;height:2px;background:rgba(27,26,23,.18)}
  .scribble{position:absolute;pointer-events:none;overflow:visible}
  .halftone-patch{position:absolute;width:240px;height:240px;opacity:.22;
    background-image:radial-gradient(var(--red) 2px,transparent 2.1px);background-size:13px 13px;
    -webkit-mask-image:radial-gradient(circle,#000 35%,transparent 72%);
    mask-image:radial-gradient(circle,#000 35%,transparent 72%)}
  .stamp{position:absolute;font-family:Vazirmatn;font-weight:700;font-size:25px;
    letter-spacing:.22em;color:rgba(217,43,37,.48);border:3px solid rgba(217,43,37,.38);
    padding:9px 18px;direction:ltr;transform:rotate(-13deg)}
  .barcode{position:absolute;height:66px;opacity:.42;
    background:repeating-linear-gradient(90deg,#1b1a17 0 3px,transparent 3px 6px,
      #1b1a17 6px 8px,transparent 8px 12px,#1b1a17 12px 17px,transparent 17px 20px)}

  /* ---- collage furniture ---- */
  .tape{position:absolute;width:190px;height:52px;opacity:.80;
    background:linear-gradient(180deg,rgba(236,222,180,.92),rgba(214,196,148,.86));
    box-shadow:0 2px 6px rgba(90,75,45,.18)}
  .tape:after{content:"";position:absolute;inset:0;
    background:repeating-linear-gradient(90deg,rgba(255,255,255,.16) 0 2px,transparent 2px 5px)}
  .scrap{position:absolute;box-shadow:0 8px 18px rgba(60,50,32,.16);will-change:transform}
  .polaroid{position:absolute;background:#fdfbf5;padding:20px 20px 74px;
    box-shadow:0 30px 55px rgba(45,38,24,.34),0 2px 5px rgba(45,38,24,.18);
    opacity:0;will-change:transform,opacity}
  .polaroid img{display:block;object-fit:contain;background:#fdfbf5;mix-blend-mode:multiply}
  .polaroid .cap{position:absolute;left:0;right:0;bottom:20px;text-align:center;
    font-family:Vazirmatn;font-weight:700;font-size:27px;color:#4a4438;direction:rtl}
  .polaroid .frame{position:absolute;inset:20px 20px 74px;border:1px solid rgba(0,0,0,.08);pointer-events:none}
  .note{position:absolute;font-family:Vazirmatn;font-weight:700;font-size:32px;
    color:var(--red);opacity:0;will-change:opacity,transform;white-space:nowrap}
  .clip{position:absolute;width:44px;height:96px;opacity:.75}

  /* ---- torn paper line strips + word cutouts ---- */
  .cluster{position:absolute;left:0;width:1080px;opacity:0;will-change:transform,opacity}
  .cluster .label{position:absolute;font-family:Vazirmatn;font-weight:700;font-size:26px;
    letter-spacing:.3em;color:rgba(27,26,23,.45);direction:ltr}
  .strip{position:absolute;left:80px;width:920px;min-height:250px;padding:46px 44px 52px;
    background:linear-gradient(160deg,var(--cream),#f4eee0 60%,#ece4d2);
    box-shadow:0 26px 46px rgba(60,50,32,.22),0 3px 8px rgba(60,50,32,.10)}
  .strip.dark{background:linear-gradient(160deg,#2a2924,#1c1b18);
    box-shadow:0 26px 50px rgba(30,25,17,.42)}
  .strip .pin{position:absolute;width:18px;height:18px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#f7f0dc,#b9a875);box-shadow:0 3px 6px rgba(0,0,0,.3)}
  .words{display:flex;flex-wrap:wrap;gap:22px 20px;direction:rtl;justify-content:center;align-items:center}
  .wd{position:relative;display:inline-block;font-family:Estedad;font-weight:900;font-size:60px;
    line-height:1.35;white-space:nowrap;color:var(--ink);
    filter:drop-shadow(0 7px 11px rgba(55,45,28,.26));
    opacity:0;will-change:transform,opacity}
  .wd .paper{display:inline-block;padding:8px 20px 15px;
    background:linear-gradient(155deg,#fffdf7,#f3ecd9);
    box-shadow:inset 0 0 0 1px rgba(90,75,50,.07)}
  .wd.small{font-size:51px}
  .wd.small .paper{padding:8px 16px 13px}
  .wd em{font-style:normal;color:var(--red)}
  .wd.on .paper{box-shadow:inset 0 0 0 2px rgba(217,43,37,.30)}
  .wd .mk{position:absolute;right:2px;bottom:-11px;width:calc(100% - 4px);height:26px;overflow:visible;z-index:2}
  .wd .circ{position:absolute;right:-14px;top:-14px;width:calc(100% + 28px);height:calc(100% + 28px);overflow:visible;z-index:3}
  .wd .punct{opacity:.55}

  /* ---- fixed HUD / notebook margin ---- */
  #hud{position:absolute;inset:0;pointer-events:none}
  #hud .corner{position:absolute;top:46px;left:44px;font-family:Vazirmatn;font-weight:700;
    font-size:20px;letter-spacing:.3em;color:rgba(27,26,23,.45);direction:ltr}
  #hud .corner2{position:absolute;bottom:48px;left:44px;font-family:Vazirmatn;font-weight:700;
    font-size:20px;letter-spacing:.26em;color:rgba(27,26,23,.40);direction:ltr}
  #margin{position:absolute;top:0;bottom:0;right:62px;width:2px;background:rgba(217,43,37,.28)}
  #margin i{position:absolute;right:-7px;width:16px;height:16px;border-radius:50%;
    background:#e9e0cb;box-shadow:inset 0 2px 4px rgba(60,50,32,.28)}
  #bar{position:absolute;left:0;bottom:0;height:8px;width:100%;background:rgba(27,26,23,.10)}
  #bar i{display:block;height:100%;width:0;background:var(--red)}
  #vig{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(ellipse 76% 62% at 50% 48%,transparent 44%,rgba(70,58,38,.14) 100%)}
</style>
</head>
<body>
<div id="stage">
  <div id="camera">
    <div id="canvas">
      <div id="grain"></div>
      <div id="halftone"></div>
      <div id="bg"></div>
      <div id="scraps"></div>
      <div id="furniture"></div>
      <div id="clusters"></div>
    </div>
  </div>
  <div id="margin"><i style="top:14%"></i><i style="top:38%"></i><i style="top:62%"></i><i style="top:86%"></i></div>
  <div id="vig"></div>
  <div id="hud">
    <div class="corner">KAMAND · FIELD NOTES</div>
    <div class="corner2">VOX / PAPER CUTS</div>
    <div id="bar"><i></i></div>
  </div>
</div>

<script src="./timeline.js"></script>
<script>
(() => {
  'use strict';
  const W=1080,H=1920,FPS=24,DUR=37,FRAMES=888,CANVAS_H=7200,TRAVEL=CANVAS_H-H,OFFSET=760;
  const DATA=window.__VOX__;
  const params=new URLSearchParams(location.search);
  const still=params.has('frame');
  const $=id=>document.getElementById(id);
  const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
  const lerp=(a,b,t)=>a+(b-a)*t;
  const easeOut=t=>1-Math.pow(1-clamp(t,0,1),3);
  const elastic=t=>{t=clamp(t,0,1);return 1-Math.pow(2,-9*t)*Math.cos(t*Math.PI*2.1)};

  const stage=$('stage');
  function fit(){const s=Math.min(innerWidth/W,innerHeight/H);stage.style.transform=`translate(-50%,-50%) scale(${s})`}
  addEventListener('resize',fit);fit();

  let seed=0x564f5803;
  function rnd(){seed|=0;seed=(seed+0x6D2B79F5)|0;let t=Math.imul(seed^(seed>>>15),1|seed);
    t=(t+Math.imul(t^(t>>>7),61|t))^t;return ((t^(t>>>14))>>>0)/4294967296}

  /* ---------- lines + continuous-scroll cluster positions ---------- */
  const lines=[];
  for(const w of DATA.words){ (lines[w.line-1] ||= []).push(w); }
  const lineStart=lines.map(a=>a[0].start), lineEnd=lines.map(a=>a[a.length-1].end);
  const ys=[]; let last=-999;
  for(let i=0;i<lines.length;i++){
    let y=(lineStart[i]/DUR)*TRAVEL + OFFSET;
    if(y-last<470) y=last+470;
    ys.push(y); last=y;
  }

  /* ---------- torn edges ---------- */
  function tornPath(n,jag){
    const pts=[];
    for(let i=0;i<=n;i++) pts.push(`${(i/n*100).toFixed(1)}% ${(jag+rnd()*jag*1.5).toFixed(1)}%`);
    for(let i=n;i>=0;i--) pts.push(`${(i/n*100).toFixed(1)}% ${(100-jag-rnd()*jag*1.5).toFixed(1)}%`);
    return 'polygon('+pts.join(',')+')';
  }
  const SVGNS='http://www.w3.org/2000/svg';
  function svg(w,h,cls){const s=document.createElementNS(SVGNS,'svg');
    s.setAttribute('viewBox',`0 0 ${w} ${h}`);s.setAttribute('preserveAspectRatio','none');
    if(cls)s.setAttribute('class',cls);return s}
  function path(d,stroke,sw,dash){const p=document.createElementNS(SVGNS,'path');
    p.setAttribute('d',d);p.setAttribute('fill','none');p.setAttribute('stroke',stroke);
    p.setAttribute('stroke-width',sw);p.setAttribute('stroke-linecap','round');
    p.setAttribute('stroke-linejoin','round');p.setAttribute('stroke-dasharray',dash);return p}

  const bg=$('bg'),scraps=$('scraps'),furniture=$('furniture'),clusters=$('clusters');
  const RED='#d92b25';
  const NUMS=['۰۱','۰۲','۰۳','۰۴','۰۵','۰۶','۰۷','۰۸','۰۹','۱۰'];

  /* ---------- background editorial furniture (always on the scroll) ---------- */
  const numEls=[];
  for(let i=0;i<10;i++){
    const n=document.createElement('div');n.className='num';n.textContent=NUMS[i];
    n.style.top=(ys[i]-250)+'px';n.style.left=(i%2?540:30)+'px';
    n.style.transform=`rotate(${(i%2?8:-7)}deg)`;bg.appendChild(n);numEls.push(n);
    const r=document.createElement('div');r.className='rule';
    r.style.top=(ys[i]-52)+'px';r.style.left='80px';r.style.width='910px';bg.appendChild(r);
    const hp=document.createElement('div');hp.className='halftone-patch';
    hp.style.top=(ys[i]+250)+'px';hp.style.left=(i%2?30:800)+'px';bg.appendChild(hp);
    if(i%3===0){
      const st=document.createElement('div');st.className='stamp';st.textContent='KAMAND / 0'+(i+1);
      st.style.top=(ys[i]+330)+'px';st.style.left=(i%2?100:700)+'px';bg.appendChild(st);
    }
    if(i%3===1){
      const bc=document.createElement('div');bc.className='barcode';bc.style.width='220px';
      bc.style.top=(ys[i]+340)+'px';bc.style.left=(i%2?80:750)+'px';bg.appendChild(bc);
    }
  }
  // paper clips
  for(let i=0;i<8;i++){
    const s=svg(44,96,'clip');
    s.style.top=(ys[i]+40)+'px';s.style.left=(i%2?950:100)+'px';
    s.appendChild(path('M22,86 L22,22 A11,11 0 0 1 22,44 L22,78 M22,86 L22,58',
      'rgba(90,90,90,.85)',5,0));
    bg.appendChild(s);
  }
  // rough red / black marker scribbles drawn on as the camera passes
  const scribbles=[];
  for(let i=0;i<20;i++){
    const s=svg(900,120,'scribble');
    s.style.top=(110+i*345)+'px'; s.style.left=(i%2?30:150)+'px';
    s.style.width='900px'; s.style.height='120px';
    const d=i%3===0
      ? 'M10,80 C120,20 200,110 320,58 S520,10 640,72 S820,110 890,44'
      : i%3===1
      ? 'M20,60 q90,-46 180,0 t180,0 t180,0 t180,0'
      : 'M30,90 L120,40 L200,96 L290,34 L380,88 L470,30 L560,92 L650,40 L740,86 L860,36';
    const p=path(d,i%4===0?'#1b1a17':RED,(4+rnd()*5).toFixed(1),1400);
    s.appendChild(p);bg.appendChild(s);scribbles.push({el:p,t:1.5+i*1.75});
  }
  // floating torn scraps (parallax)
  for(let i=0;i<34;i++){
    const e=document.createElement('div');e.className='scrap';
    const w=70+rnd()*170,h=36+rnd()*80;
    e.style.cssText=`width:${w}px;height:${h}px;background:${i%5===0?'#e4dac2':'#f9f4e8'};opacity:.92`;
    e.style.clipPath=tornPath(10,6);
    e.dataset.x=(20+rnd()*960).toFixed(0);e.dataset.y=(60+rnd()*7050).toFixed(0);
    e.dataset.r=(-26+rnd()*52).toFixed(1);e.dataset.p=(rnd()*6.28).toFixed(2);
    scraps.appendChild(e);
  }
  const scrapEls=[...scraps.children];
  // scattered tape (always visible furniture, not gated on a line)
  for(let i=0;i<30;i++){
    const t=document.createElement('div');t.className='tape';
    t.style.left=(30+rnd()*880)+'px';t.style.top=(80+rnd()*7000)+'px';
    t.style.width=(120+rnd()*110)+'px';
    t.style.transform=`rotate(${(-35+rnd()*70).toFixed(1)}deg)`;furniture.appendChild(t);
  }

  /* ---------- word cutouts, one pasted scrap per spoken word ---------- */
  const EMPH=new Set(['سفیدک','گیاهی','ریزش','کمند','طبیعی','کاملاً','آسان','جذاب','لیفت']);
  const wordEls=[], clusterEls=[];
  for(let i=0;i<lines.length;i++){
    const c=document.createElement('div');c.className='cluster';c.style.top=ys[i]+'px';
    const lab=document.createElement('div');lab.className='label';
    lab.textContent=(i+1<10?'0':'')+(i+1)+' / 10';
    lab.style.top='-62px';lab.style.left='80px';c.appendChild(lab);

    const dark=(i===3||i===4||i===8);
    const strip=document.createElement('div');strip.className='strip'+(dark?' dark':'');
    strip.style.clipPath=tornPath(24,4);
    strip.style.transform=`rotate(${(i%2?1.1:-1.2)}deg)`;
    const long=lines[i].length>8;
    const wc=document.createElement('div');wc.className='words';
    for(const w of lines[i]){
      const e=document.createElement('span');e.className='wd'+(long?' small':'');
      e.dataset.rot=(-3.2+rnd()*6.4).toFixed(2);
      const paper=document.createElement('span');paper.className='paper';
      paper.style.clipPath=tornPath(9,5);
      if(EMPH.has(w.w)){const em=document.createElement('em');em.textContent=w.w;paper.appendChild(em)}
      else paper.textContent=w.w;
      if(w.punct){const s=document.createElement('span');s.className='punct';s.textContent=w.punct;paper.appendChild(s)}
      e.appendChild(paper);
      const u=svg(200,24,'mk');
      const up=path('M4,16 C50,4 88,22 132,11 S180,19 196,9',RED,7,260);
      u.appendChild(up);e.appendChild(u);
      let cp=null;
      if(EMPH.has(w.w)){
        const circ=svg(200,80,'circ');
        cp=path('M100,8 C160,4 196,22 194,40 C192,62 150,74 100,72 C50,70 6,60 6,40 C6,20 42,10 100,8',
          RED,5,620);
        circ.appendChild(cp);e.appendChild(circ);
      }
      wc.appendChild(e);
      wordEls.push({el:e,u:up,c:cp,w,on:false});
    }
    strip.appendChild(wc);
    const pin=document.createElement('div');pin.className='pin';pin.style.top='16px';pin.style.left='24px';
    strip.appendChild(pin);
    c.appendChild(strip);clusters.appendChild(c);clusterEls.push(c);

    // two pieces of tape pinning this strip
    for(let k=0;k<2;k++){
      const t=document.createElement('div');t.className='tape';
      t.style.top=(ys[i]+(k===0?-26:230))+'px';
      t.style.left=(k===0?'54px':'800px');
      t.style.transform=`rotate(${(k===0?-24:19)+(i%3)*3}deg)`;
      furniture.appendChild(t);
    }
  }

  /* ---------- polaroids: the ONLY photograph in the film ---------- */
  const POL=[{t:2.6,y:0,x:640,w:330,h:330,r:9,cap:'ژل لیفت ابرو کمند'},
             {t:11.4,y:2,x:70,w:300,h:300,r:-11,cap:'کاملاً گیاهی'},
             {t:16.2,y:5,x:660,w:290,h:290,r:7,cap:'بدون سفیدک'},
             {t:26.4,y:7,x:80,w:310,h:310,r:-8,cap:'مرتب، بدون دردسر'},
             {t:33.4,y:9,x:640,w:340,h:340,r:6,cap:'زیبایی طبیعی، هر روز'}];
  const pols=POL.map(p=>{
    const e=document.createElement('div');e.className='polaroid';
    e.style.width=p.w+'px';e.style.height=(p.h+54)+'px';
    e.style.left=p.x+'px';e.style.top=(ys[p.y]+150)+'px';
    const img=document.createElement('img');img.src='./assets/product-open.png';img.alt='KAMAND';
    img.style.width='100%';img.style.height=p.h+'px';
    const fr=document.createElement('div');fr.className='frame';fr.style.bottom='74px';
    const cap=document.createElement('div');cap.className='cap';cap.textContent=p.cap;
    e.append(img,fr,cap);furniture.appendChild(e);
    const t=document.createElement('div');t.className='tape';
    t.style.width='150px';t.style.left=(p.x+p.w/2-75)+'px';t.style.top=(ys[p.y]+132)+'px';
    t.style.transform=`rotate(${p.r>0?-16:14}deg)`;furniture.appendChild(t);
    return {el:e,t:p.t,r:p.r};
  });

  /* ---------- red marker handwritten notes ---------- */
  const NOTES=[{t:4.9,y:0,x:100,txt:'اولین چیزی که دیده میشه ←',r:-6},
               {t:14.4,y:4,x:600,txt:'× بدون سفیدک',r:5},
               {t:18.1,y:5,x:100,txt:'رو به بالا ↑',r:-5},
               {t:29.6,y:8,x:590,txt:'نتیجه؟ جذاب ✓',r:6},
               {t:35.2,y:9,x:100,txt:'کمند؛ هر روز',r:-4}];
  const notes=NOTES.map(n=>{
    const e=document.createElement('div');e.className='note';e.textContent=n.txt;
    e.style.left=n.x+'px';e.style.top=(ys[n.y]+330)+'px';
    furniture.appendChild(e);return {el:e,t:n.t,r:n.r};
  });

  /* ---------- continuous camera + word-by-word seek ---------- */
  let activeNum=-1;
  function update(f){
    const t=f/FPS, u=f/(FRAMES-1);
    const camY=TRAVEL*u;
    const sway=Math.sin(u*7.2)*16;
    const scale=1+0.055*u+0.010*Math.sin(u*5.4);
    $('camera').style.transform=`translate(${(-sway).toFixed(2)}px,${(-camY).toFixed(2)}px) scale(${scale.toFixed(4)})`;
    $('grain').style.transform=`translateY(${(camY*0.42).toFixed(2)}px)`;
    $('halftone').style.transform=`translateY(${(camY*0.30).toFixed(2)}px)`;
    bg.style.transform=`translateY(${(camY*0.40).toFixed(2)}px)`;
    scraps.style.transform=`translateY(${(-camY*0.16).toFixed(2)}px)`;
    for(const e of scrapEls){
      const x=+e.dataset.x,y=+e.dataset.y,r=+e.dataset.r,p=+e.dataset.p;
      e.style.transform=`translate(${(x+Math.sin(t*.35+p)*22).toFixed(1)}px,${(y+Math.cos(t*.28+p)*16).toFixed(1)}px) rotate(${(r+Math.sin(t*.22+p)*5).toFixed(1)}deg)`;
    }
    for(const s of scribbles){
      const p=clamp((t-s.t)/1.1,0,1);
      s.el.setAttribute('stroke-dashoffset',(1400*(1-p)).toFixed(1));
    }
    // each torn strip is pasted onto the scroll exactly as its line begins
    for(let i=0;i<clusterEls.length;i++){
      const c=clusterEls[i],age=t-(lineStart[i]-0.24);
      if(age<0){c.style.opacity='0';c.style.transform='translateY(34px) scale(.92)';continue}
      const e=elastic(age/.42);
      c.style.opacity=Math.min(1,age*16).toFixed(3);
      c.style.transform=`translateY(${lerp(34,0,e).toFixed(1)}px) scale(${lerp(.92,1,e).toFixed(4)})`;
    }
    // word-by-word: every cutout appears at its own narrator timestamp
    for(const o of wordEls){
      const ws=o.w.start, we=o.w.end, age=t-ws;
      if(age<0){
        o.el.style.opacity='0';o.el.style.transform=`translateY(26px) scale(.82) rotate(${o.el.dataset.rot}deg)`;
        o.u.setAttribute('stroke-dashoffset','260');if(o.c)o.c.setAttribute('stroke-dashoffset','620');
        if(o.on){o.el.classList.remove('on');o.on=false}continue;
      }
      const pop=elastic(age/0.28);
      const active=clamp((t-ws)/Math.max(0.12,we-ws),0,1);
      const isOn=age<0.55;
      if(isOn!==o.on){o.el.classList.toggle('on',isOn);o.on=isOn}
      o.el.style.opacity=Math.min(1,age*16).toFixed(3);
      o.el.style.transform=`translateY(${lerp(24,0,pop).toFixed(1)}px) scale(${(lerp(.82,1,pop)*(1+0.075*Math.sin(Math.PI*active))).toFixed(4)}) rotate(${(+o.el.dataset.rot*lerp(1.6,1,pop)).toFixed(2)}deg)`;
      o.u.setAttribute('stroke-dashoffset',(260*(1-clamp(age/Math.max(.18,we-ws),0,1))).toFixed(1));
      if(o.c) o.c.setAttribute('stroke-dashoffset',(620*(1-clamp(age/.55,0,1))).toFixed(1));
    }
    for(const p of pols){
      const age=t-p.t;
      if(age<0){p.el.style.opacity='0';p.el.style.transform=`rotate(${p.r}deg) scale(.7)`;continue}
      const e=elastic(age/.5);
      p.el.style.opacity=Math.min(1,age*6).toFixed(3);
      p.el.style.transform=`rotate(${p.r}deg) scale(${lerp(.7,1,e).toFixed(4)})`;
    }
    for(const n of notes){
      const age=t-n.t;
      if(age<0){n.el.style.opacity='0';continue}
      n.el.style.opacity=Math.min(1,age*5).toFixed(3);
      n.el.style.transform=`rotate(${n.r}deg) translateY(${lerp(28,0,easeOut(age/.4)).toFixed(1)}px)`;
    }
    let cur=-1;
    for(let i=0;i<lines.length;i++) if(t>=lineStart[i]-0.3&&t<=lineEnd[i]+0.6) cur=i;
    if(cur!==activeNum){
      if(activeNum>=0)numEls[activeNum].classList.remove('active');
      if(cur>=0)numEls[cur].classList.add('active');
      activeNum=cur;
    }
    $('bar').firstElementChild.style.width=(u*100).toFixed(2)+'%';
    document.documentElement.dataset.frame=String(f);
  }

  const motion={fps:FPS,frames:FRAMES,width:W,height:H,duration:DUR,
    seek(frame){const f=clamp(Math.round(frame),0,FRAMES-1);update(f);return f},ready:false};
  window.__MOTION__=motion;

  Promise.all([new Promise(res=>{const im=new Image();im.onload=im.onerror=res;im.src='./assets/product-open.png'})])
    .then(()=>document.fonts?document.fonts.ready:Promise.resolve())
    .then(()=>{
      motion.ready=true;
      if(still){motion.seek(Number(params.get('frame')||0))}
      else{const t0=performance.now();
        const tick=n=>{motion.seek(Math.floor(((n-t0)/1000)*FPS)%FRAMES);requestAnimationFrame(tick)};
        requestAnimationFrame(tick)}
    });
})();
</script>
</body>
</html>
