<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Terminal — 2D figures, photographic airport</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
  #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
  .shot { position: absolute; inset: 0; overflow: hidden; opacity: 0; }
  .shot canvas { position: absolute; inset: 0; display: block; }
  #grade {
    position: absolute; inset: 0; pointer-events: none;
    background:
      radial-gradient(ellipse 86% 70% at 50% 42%, rgba(0,0,0,0) 50%, rgba(0,0,0,.28) 84%, rgba(0,0,0,.54) 100%),
      linear-gradient(to bottom, rgba(0,0,0,.12) 0%, rgba(0,0,0,0) 18%, rgba(0,0,0,0) 80%, rgba(0,0,0,.14) 100%);
  }
</style>
</head>
<body>
<div id="root"><div id="shots"></div><div id="grade"></div></div>
<script>
// =====================================================================
// Terminal — photographic plates, flat 2D figures glued into them.
//
//   scene 1   0.0 - 18.0   the concourse: the crowd, then just him
//   scene 2  18.0 - 37.0   passport control: a problem with the papers
//
// No text anywhere. Every pixel is a function of t.
//
// Character sheet lock:
//   round white head · huge eyes · white body · heavy ink outline · thin
//   limbs. The man: dark-brown jacket (collar + zip), dark trousers, a
//   hair tuft, black shoes, an old suitcase. The officer: navy shirt,
//   white collar band, ink bob.
// =====================================================================
const W = 1080, H = 1920, FPS = 30;

const INK = "#111114";
const PAPER = "#ffffff";
const COL = {
  hoodie: "#2f66b5", hoodieDark: "#24508f", hoodieInk: "#16325c",
  pack: "#565b63", packDark: "#3b3f46",
  jacket: "#2f66b5", jacketInk: "#16325c",
  trousers: "#101014", shoe: "#101014",
  shirt: "#2c4a70", shirtInk: "#152436",
  coat2: "#39404b", coat3: "#4c3a30", coat4: "#33403c",
};

const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, u) => a + (b - a) * u;
const smooth = (u) => { u = clamp(u); return u * u * (3 - 2 * u); };
const ease = (u) => { u = clamp(u); return u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2; };
const ramp = (t, a, b) => smooth((t - a) / (b - a));
const win = (t, a, b, c, d) => ramp(t, a, b) - ramp(t, c, d);
const blinkAt = (t, p, at) => (Math.abs((((t - at) % p) + p) % p) < 0.10 ? 1 : 0);
const lp = (a, b, u) => ({ x: lerp(a.x, b.x, clamp(u)), y: lerp(a.y, b.y, clamp(u)) });

// ------------------------------------------------------------------ voice
// analysis/lipsync.json is produced by scripts/vo-analysis.mjs from the
// narration itself: one row per video frame — [energy, mouthOpen, vowel].
// Nothing about the mouth is hand-keyed; it follows the voice.
// read lazily: the table arrives in a script tag after this one
function voiceAt(t) {
  const V = window.__VOICE;
  if (!V || !V.frames) return { open: 0, vowel: 0, energy: 0, t };
  const f = V.frames[Math.max(0, Math.min(V.frames.length - 1, Math.round(t * V.fps)))];
  if (!f) return { open: 0, vowel: 0, energy: 0, t };
  return { energy: f[0], open: f[1], vowel: f[2], t };
}

// ------------------------------------------------------------------ plates
const PLATES = {};
function plate(name) {
  if (!PLATES[name]) { const im = new Image(); im.src = `../assets/plates/sh/${name}.jpg`; PLATES[name] = im; }
  return PLATES[name];
}

// ------------------------------------------------------------------ rig
// A real skeleton, in units where the feet are at 0 and "up" is negative.
// Total height ≈ 1035: legs 390, torso 310, head 310.
// Proportions measured off the supplied sheet: head ≈ 28 % of the height,
// hoodie ≈ 40 %, leg ≈ 32 %. Feet stand at y = 0.
const RIG = {
  hipY: -330,
  shoulderY: -668,
  headCy: -788, headRx: 150, headRy: 156,
  bodyRx: 120, bodyRy: 166,
  armU: 152, armL: 148,
  legU: 168, legL: 168,
  armW: 22, legW: 20,
  hipX: 44,
  outline: 13,
};

function jointAt(root, end, a, b, sign = 1, maxBow = 1e9) {
  const dx = end.x - root.x, dy = end.y - root.y;
  let d = Math.hypot(dx, dy) || 1e-6;
  const reach = (a + b) * 0.999;
  let ex = end.x, ey = end.y;
  if (d > reach) { const k = reach / d; ex = root.x + dx * k; ey = root.y + dy * k; d = reach; }
  const ux = (ex - root.x) / d, uy = (ey - root.y) / d;
  const x = clamp((a * a - b * b + d * d) / (2 * d), -a, a);
  const h = Math.min(Math.sqrt(Math.max(0, a * a - x * x)), maxBow);
  // perpendicular of the limb, flipped by sign
  const px = -uy * sign, py = ux * sign;
  return { j: { x: root.x + ux * x + px * h, y: root.y + uy * x + py * h }, end: { x: ex, y: ey } };
}

function ik(root, end, a, b, side = 1) {
  let dx = end.x - root.x, dy = end.y - root.y;
  let d = Math.hypot(dx, dy) || 1e-6;
  const reach = (a + b) * 0.985;
  if (d > reach) { const k = reach / d; dx *= k; dy *= k; d = reach; }
  const c = clamp((a * a + d * d - b * b) / (2 * a * d), -1, 1);
  const th = Math.acos(c) * side;
  const ux = dx / d, uy = dy / d;
  return {
    j: { x: root.x + a * (ux * Math.cos(th) - uy * Math.sin(th)),
         y: root.y + a * (ux * Math.sin(th) + uy * Math.cos(th)) },
    end: { x: root.x + dx, y: root.y + dy },
  };
}

// ------------------------------------------------------------------ face
const FACE = {
  neutral:  { eyeW: 58, eyeH: 66, pupil: 18, gaze: 0.00, look: 0,  lift: 8,  tilt: 0.00, mLift: 0,  mouthW: 42, mouthH: 8,  curve: 0.22, solid: 0 },
  worry:    { eyeW: 62, eyeH: 70, pupil: 16, gaze: 0.20, look: 0,  lift: 22, tilt: -0.72, mLift: 4,  mouthW: 34, mouthH: 12, curve: -0.34, solid: 0 },
  shock:    { eyeW: 72, eyeH: 84, pupil: 12, gaze: 0.00, look: 0,  lift: 28, tilt: -0.50, mLift: 6, mouthW: 32, mouthH: 44, curve: 0, solid: 1 },
  sad:      { eyeW: 56, eyeH: 54, pupil: 16, gaze: -0.26, look: 5, lift: 18, tilt: -0.95, mLift: -2, mouthW: 36, mouthH: 9,  curve: -0.80, solid: 0 },
  flat:     { eyeW: 58, eyeH: 28, pupil: 15, gaze: 0.06, look: 0,  lift: 5,  tilt: 0.10, mLift: 0,  mouthW: 44, mouthH: 7,  curve: 0.00, solid: 0 },
  happy:    { eyeW: 58, eyeH: 32, pupil: 15, gaze: 0.00, look: 0,  lift: 9,  tilt: -0.30, mLift: 2, mouthW: 56, mouthH: 12, curve: 0.95, solid: 0 },
  tired:    { eyeW: 56, eyeH: 32, pupil: 15, gaze: -0.12, look: 6, lift: 12, tilt: -0.62, mLift: 1,  mouthW: 38, mouthH: 10, curve: -0.42, solid: 0 },
  doubt:    { eyeW: 60, eyeH: 44, pupil: 16, gaze: -0.30, look: 5, lift: 13, tilt: 0.55, mLift: 0, mouthW: 36, mouthH: 8,  curve: 0.18, solid: 0 },
  stern:    { eyeW: 58, eyeH: 38, pupil: 15, gaze: 0.00, look: 0,  lift: 4,  tilt: 0.85, mLift: 0, mouthW: 42, mouthH: 7,  curve: -0.10, solid: 0 },
  announce: { eyeW: 60, eyeH: 64, pupil: 16, gaze: 0.00, look: 0,  lift: 15, tilt: 0.30, mLift: 8,  mouthW: 36, mouthH: 26, curve: 0, solid: 1 },
};
function mixFace(a, b, u) {
  const A = FACE[a] || FACE.neutral, B = FACE[b] || FACE.neutral;
  const o = {}; for (const k in A) o[k] = lerp(A[k], B[k], clamp(u));
  o.noMouth = !!(A.noMouth || B.noMouth);
  return o;
}

// ------------------------------------------------------------------ draw
// feet at (x, y); every anchor is measured up from there, so a character
// never floats and its head never sinks into its hips.
function drawFigure(ctx, s) {
  const f = s.face || FACE.neutral;
  const blink = clamp(s.blink || 0, 0, 1);
  const squash = s.squash ?? 1;
  const sc = s.scale || 1;
  const R = RIG;
  const bodyRx = R.bodyRx * squash;
  const bodyRy = R.bodyRy * (1 - (1 - squash) * 0.45);
  const bodyCy = (R.shoulderY + R.hipY) / 2 + 6;

  ctx.save();
  ctx.translate(s.x, s.y);
  ctx.rotate(s.rot || 0);
  ctx.scale(sc * (s.flip ? -1 : 1), sc);
  const line = (w, col) => { ctx.lineWidth = w; ctx.strokeStyle = col; ctx.stroke(); };

  // --- contact shadow
  if (s.shadow !== false) {
    const g = ctx.createRadialGradient(0, 0, 6, 0, 0, R.bodyRx * 1.5);
    g.addColorStop(0, "rgba(0,0,0,.50)");
    g.addColorStop(0.5, "rgba(0,0,0,.18)");
    g.addColorStop(1, "rgba(0,0,0,0)");
    ctx.save(); ctx.scale(1, 0.17);
    ctx.beginPath(); ctx.arc(0, 0, R.bodyRx * 1.45, 0, Math.PI * 2);
    ctx.fillStyle = g; ctx.fill(); ctx.restore();
  }

  // --- backpack: behind everything, a dark slab that peeks out both sides
  if (s.bag) {
    const bw = bodyRx * 1.92, bh = bodyRy * 1.26;
    ctx.beginPath();
    rrect(ctx, -bw / 2, bodyCy - bh * 0.56, bw, bh, 30);
    ctx.fillStyle = COL.pack; ctx.fill();
    ctx.lineJoin = "round"; line(R.outline, INK);
    // a pocket seam across the bag
    ctx.beginPath();
    ctx.moveTo(-bw * 0.34, bodyCy + bh * 0.10);
    ctx.quadraticCurveTo(0, bodyCy + bh * 0.20, bw * 0.34, bodyCy + bh * 0.10);
    ctx.lineCap = "round"; line(7, COL.packDark);
  }

  // --- legs: trouser legs with their own ink outline, big flat shoes
  if (!s.noLegs) for (const [foot, side] of [[s.footL, -1], [s.footR, 1]]) {
    const hip = { x: side * R.hipX, y: R.hipY + 26 };
    // knee bows outward (never across the body), and never more than 18 units
    const r = jointAt(hip, { x: foot.x, y: foot.y }, R.legU, R.legL, -side, 18);
    const leg = () => {
      ctx.beginPath();
      ctx.moveTo(hip.x, hip.y);
      ctx.quadraticCurveTo(r.j.x, r.j.y, r.end.x, r.end.y);
      ctx.lineCap = "round"; ctx.lineJoin = "round";
    };
    leg(); line(R.legW + R.outline * 1.15, INK);
    leg(); line(R.legW, s.trousers || INK);
    if (s.shoes !== false) {
      // shoe: a flat black oval, toe pointing the way the foot is going
      const dir = Math.atan2(foot.y - r.j.y, foot.x - r.j.x);
      const tilt = Math.max(-0.30, Math.min(0.30, dir + Math.PI / 2));
      ctx.save();
      ctx.translate(foot.x, foot.y - 4);
      ctx.rotate(tilt);
      ctx.beginPath();
      ctx.ellipse(side * 10, 4, 38, 18, 0, 0, Math.PI * 2);
      ctx.fillStyle = COL.shoe; ctx.fill();
      line(8, INK);
      ctx.restore();
    }
  }

  // --- hoodie shell
  const shell = (grow = 0) => {
    const rx = bodyRx + grow, ry = bodyRy + grow;
    ctx.beginPath();
    ctx.moveTo(-rx, bodyCy + ry * 0.78);
    ctx.bezierCurveTo(-rx * 1.02, bodyCy - ry * 1.30, rx * 1.02, bodyCy - ry * 1.30, rx * 0.84, bodyCy + ry * 0.72);
    ctx.quadraticCurveTo(rx * 0.40, bodyCy + ry * 0.86, 0, bodyCy + ry * 0.84);
    ctx.quadraticCurveTo(-rx * 0.40, bodyCy + ry * 0.86, -rx * 0.84, bodyCy + ry * 0.72);
    ctx.closePath();
  };
  shell(); ctx.fillStyle = PAPER; ctx.fill();
  ctx.lineJoin = "round"; line(R.outline, INK);
  if (s.torso) { shell(); ctx.fillStyle = s.torso; ctx.fill(); line(R.outline, INK); }

  // --- (hood removed: on the sheet the hood is only a hint behind the neck)
  if (false) {
    const hw = bodyRx * 1.10, top = R.shoulderY - 26;
    ctx.beginPath();
    ctx.moveTo(-hw * 0.94, bodyCy - bodyRy * 0.72);
    ctx.bezierCurveTo(-hw, top + 6, hw, top + 6, hw * 0.94, bodyCy - bodyRy * 0.72);
    ctx.bezierCurveTo(hw * 0.55, top + 74, -hw * 0.55, top + 74, -hw * 0.94, bodyCy - bodyRy * 0.72);
    ctx.closePath();
    ctx.fillStyle = s.hoodColor || COL.hoodieDark; ctx.fill();
    ctx.lineJoin = "round"; line(R.outline, INK);
  }

  // --- backpack straps over the shoulders
  if (s.bag) {
    for (const side of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(side * bodyRx * 0.30, bodyCy - bodyRy * 1.06);
      ctx.quadraticCurveTo(side * bodyRx * 0.86, bodyCy - bodyRy * 0.30, side * bodyRx * 0.58, bodyCy + bodyRy * 0.56);
      ctx.lineCap = "round"; line(20, INK);
      ctx.beginPath();
      ctx.moveTo(side * bodyRx * 0.30, bodyCy - bodyRy * 1.06);
      ctx.quadraticCurveTo(side * bodyRx * 0.86, bodyCy - bodyRy * 0.30, side * bodyRx * 0.58, bodyCy + bodyRy * 0.56);
      line(11, COL.pack);
    }
  }

  // --- kangaroo pocket
  if (s.pocket) {
    const pw = bodyRx * 1.18, pt = bodyCy + bodyRy * 0.02, pb = bodyCy + bodyRy * 0.62;
    ctx.beginPath();
    ctx.moveTo(-pw / 2, pt);
    ctx.quadraticCurveTo(0, pt - bodyRy * 0.20, pw / 2, pt);
    ctx.quadraticCurveTo(pw / 2 + 10, pb, pw / 2 - 26, pb);
    ctx.lineTo(-pw / 2 + 26, pb);
    ctx.quadraticCurveTo(-pw / 2 - 10, pb, -pw / 2, pt);
    ctx.closePath();
    ctx.fillStyle = s.pocketColor || COL.hoodieDark; ctx.fill();
    ctx.lineJoin = "round"; line(11, INK);
  }

  // --- drawstrings
  if (s.cords) {
    for (const side of [-1, 1]) {
      const x0 = side * bodyRx * 0.26;
      ctx.beginPath();
      ctx.moveTo(x0, bodyCy - bodyRy * 1.02);
      ctx.quadraticCurveTo(x0 + side * 9, bodyCy - bodyRy * 0.72, x0 + side * 5, bodyCy - bodyRy * 0.44);
      ctx.lineCap = "round"; line(10, INK);
      ctx.beginPath();
      ctx.moveTo(x0, bodyCy - bodyRy * 1.02);
      ctx.quadraticCurveTo(x0 + side * 9, bodyCy - bodyRy * 0.72, x0 + side * 5, bodyCy - bodyRy * 0.44);
      line(5, "#eef1f6");
      ctx.beginPath();
      ctx.moveTo(x0 + side * 5, bodyCy - bodyRy * 0.44); ctx.lineTo(x0 + side * 5, bodyCy - bodyRy * 0.34);
      line(9, INK);
    }
  }

  if (s.collarBand) {
    const cy = bodyCy - bodyRy * 1.02;
    for (const side of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(side * bodyRx * 0.34, cy - 4);
      ctx.lineTo(side * bodyRx * 0.10, cy + bodyRy * 0.24);
      ctx.lineCap = "round"; line(13, PAPER);
      ctx.beginPath();
      ctx.moveTo(side * bodyRx * 0.34, cy - 4);
      ctx.lineTo(side * bodyRx * 0.10, cy + bodyRy * 0.24);
      line(4, INK);
    }
  }

  // --- arms: a blue sleeve from shoulder to wrist over a thin ink limb,
  //     then a black mitt. Both arms use the same code, so neither flips.
  const handPts = [];
  for (const [hand, side] of [[s.handL, -1], [s.handR, 1]]) {
    const root = { x: side * bodyRx * 0.82, y: R.shoulderY + 30 };
    const r = jointAt(root, { x: hand.x, y: hand.y }, R.armU, R.armL, -side, 46);
    const wrist = { x: lerp(r.j.x, hand.x, 0.86), y: lerp(r.j.y, hand.y, 0.86) };
    // upper arm + forearm as one polyline, with a slight elbow bend
    const arm = () => {
      ctx.beginPath();
      ctx.moveTo(root.x, root.y);
      ctx.quadraticCurveTo(r.j.x, r.j.y, wrist.x, wrist.y);
      ctx.lineCap = "round"; ctx.lineJoin = "round";
    };
    if (s.sleeve) {
      arm(); line(R.armW + R.outline * 1.15, INK);
      arm(); line(R.armW, s.sleeve);
      // cuff
      const ang = Math.atan2(wrist.y - r.j.y, wrist.x - r.j.x);
      ctx.save();
      ctx.translate(wrist.x, wrist.y); ctx.rotate(ang);
      ctx.beginPath(); ctx.moveTo(0, -(R.armW / 2 + 2)); ctx.lineTo(0, R.armW / 2 + 2);
      line(8, INK);
      ctx.restore();
    } else {
      arm(); line(R.armW, INK);
    }
    handPts.push(hand);
  }

  // --- head
  const headX = (s.lean || 0) * 34;
  ctx.save();
  ctx.translate(headX, R.headCy);
  ctx.rotate(s.headRot || 0);

  if (s.hair === "bob") {
    ctx.beginPath();
    ctx.ellipse(0, -6, R.headRx * 1.14, R.headRy * 1.10, 0, Math.PI * 0.93, Math.PI * 2.07);
    ctx.fillStyle = INK; ctx.fill();
  }
  ctx.beginPath();
  ctx.ellipse(0, 0, R.headRx, R.headRy, 0, 0, Math.PI * 2);
  ctx.fillStyle = PAPER; ctx.fill();
  line(R.outline, INK);

  if (!s.faceless) drawFace(ctx, {...f, noMouth: f.noMouth || !!s.noMouth}, blink, s.voice);

  if (s.hair === "tuft") {
    ctx.beginPath();
    ctx.moveTo(-26, -R.headRy * 0.92);
    ctx.quadraticCurveTo(-34, -R.headRy * 1.26, -10, -R.headRy * 1.05);
    ctx.quadraticCurveTo(0, -R.headRy * 1.40, 10, -R.headRy * 1.05);
    ctx.quadraticCurveTo(30, -R.headRy * 1.28, 26, -R.headRy * 0.92);
    ctx.closePath(); ctx.fillStyle = INK; ctx.fill();
  }
  ctx.restore();
  if (s.hair === "bob") {
    ctx.beginPath();
    ctx.moveTo(-R.headRx * 0.99, -R.headRy * 0.24);
    ctx.quadraticCurveTo(-R.headRx * 0.72, -R.headRy * 1.12, 0, -R.headRy * 1.04);
    ctx.quadraticCurveTo(R.headRx * 0.72, -R.headRy * 1.12, R.headRx * 0.99, -R.headRy * 0.24);
    ctx.quadraticCurveTo(R.headRx * 0.58, -R.headRy * 0.78, 0, -R.headRy * 0.80);
    ctx.quadraticCurveTo(-R.headRx * 0.58, -R.headRy * 0.78, -R.headRx * 0.99, -R.headRy * 0.24);
    ctx.closePath(); ctx.fillStyle = INK; ctx.fill();
  }
  ctx.restore();

  // --- mitts on top of the sleeves
  for (const hand of handPts) {
    ctx.beginPath();
    ctx.arc(hand.x, hand.y, R.armW * 1.02, 0, Math.PI * 2);
    ctx.fillStyle = INK; ctx.fill();
  }
  ctx.restore();
}

// rounded rect that does not depend on ctx.roundRect
function rrect(ctx, x, y, w, h, r) {
  const rr = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + rr, y);
  ctx.lineTo(x + w - rr, y); ctx.quadraticCurveTo(x + w, y, x + w, y + rr);
  ctx.lineTo(x + w, y + h - rr); ctx.quadraticCurveTo(x + w, y + h, x + w - rr, y + h);
  ctx.lineTo(x + rr, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - rr);
  ctx.lineTo(x, y + rr); ctx.quadraticCurveTo(x, y, x + rr, y);
  ctx.closePath();
}

function drawFace(ctx, f, blink, voice) {
  const ex = 54, ey = -10 + (f.look || 0);
  const eyeH = f.eyeH * (1 - blink * 0.93);

  for (const side of [-1, 1]) {
    const cx = side * ex + f.gaze * 13;
    ctx.beginPath();
    ctx.ellipse(cx, ey, f.eyeW / 2, Math.max(3, eyeH / 2), 0, 0, Math.PI * 2);
    ctx.fillStyle = "#fff"; ctx.fill();
    ctx.lineWidth = 8; ctx.strokeStyle = INK; ctx.stroke();
    if (eyeH > 10) {
      const pr = Math.min(f.pupil, Math.max(5, eyeH / 2 - 5));
      const px = cx + f.gaze * 12, py = ey + 3;
      ctx.beginPath(); ctx.ellipse(px, py, pr, pr * 1.05, 0, 0, Math.PI * 2);
      ctx.fillStyle = INK; ctx.fill();
      if (pr > 6) {
        ctx.beginPath(); ctx.arc(px - pr * 0.36, py - pr * 0.38, Math.max(2, pr * 0.28), 0, Math.PI * 2);
        ctx.fillStyle = "rgba(255,255,255,.92)"; ctx.fill();
      }
    }
  }
  for (const side of [-1, 1]) {
    const bx = side * ex + f.gaze * 13;
    const by = ey - f.eyeH * 0.64 - f.lift;
    const lift = f.tilt * 17;
    const inner = { x: bx - side * 30, y: by + lift };
    const outer = { x: bx + side * 30, y: by - lift * 0.45 };
    ctx.beginPath();
    ctx.moveTo(outer.x, outer.y);
    ctx.quadraticCurveTo((inner.x + outer.x) / 2, by - 8 + lift * 0.2, inner.x, inner.y);
    ctx.lineWidth = 10; ctx.strokeStyle = INK; ctx.lineCap = "round"; ctx.stroke();
  }
  const my = 72 + f.mLift;
  const mw = f.mouthW, cv = f.curve;
  const vo = voice || { open: 0, vowel: 0 };
  const openAmt = vo.open * (voice && voice.gain != null ? voice.gain : 1);

  if (openAmt > 0.04) {
    // An open mouth drawn from the voice: the jaw height comes from the
    // analysed amplitude, the w/h ratio and the inner tongue from the vowel.
    const shapes = [
      { w: 1.00, h: 1.00, tongue: 0.30 },   // a
      { w: 1.18, h: 0.62, tongue: 0.10 },   // e
      { w: 0.74, h: 0.92, tongue: 0.16 },   // o
      { w: 1.20, h: 0.44, tongue: 0.05 },   // i
      { w: 0.62, h: 0.70, tongue: 0.12 },   // u
    ];
    const shp = shapes[vo.vowel] || shapes[0];
    const h = (14 + 40 * openAmt) * shp.h;
    const w = (42 + 30 * openAmt) * shp.w;
    ctx.beginPath();
    ctx.ellipse(0, my + h * 0.22, w / 2, h / 2, 0, 0, Math.PI * 2);
    ctx.fillStyle = "#33161b"; ctx.fill();
    ctx.lineWidth = 8; ctx.strokeStyle = INK; ctx.stroke();
    // tongue, low in the mouth
    if (h > 12) {
      ctx.beginPath();
      ctx.ellipse(0, my + h * 0.22 + h * (0.34 + shp.tongue * 0.16), w * 0.30, h * 0.16, 0, 0, Math.PI * 2);
      ctx.fillStyle = "#a04a4a"; ctx.fill();
    }
    return;
  }

  const mh = f.mouthH;
  if (!f.solid) {
    ctx.beginPath();
    ctx.moveTo(-mw / 2, my - cv * 9);
    ctx.quadraticCurveTo(0, my + cv * 26, mw / 2, my - cv * 9);
    ctx.lineWidth = 10; ctx.strokeStyle = INK; ctx.lineCap = "round"; ctx.stroke();
  } else {
    ctx.beginPath();
    ctx.ellipse(0, my + mh * 0.06, mw / 2, mh / 2, 0, 0, Math.PI * 2);
    ctx.fillStyle = INK; ctx.fill();
    if (mh > 20) {
      ctx.beginPath();
      ctx.ellipse(0, my + mh * 0.38, mw / 3.4, mh * 0.22, 0, 0, Math.PI * 2);
      ctx.fillStyle = "#8f3b3b"; ctx.fill();
    }
  }
}

// the world position of a hand, for props that follow it
function handWorld(s, key) {
  const h = s[key], sc = s.scale || 1;
  return { x: s.x + (s.flip ? -h.x : h.x) * sc, y: s.y + h.y * sc };
}

// costumes, written once so nobody drifts
const HIM = { torso: COL.hoodie, trousers: COL.trousers, sleeve: COL.hoodie, shoes: true, hair: "tuft", pocket: true, cords: true, bag: true, hood: true };
const OFFICER = { torso: COL.shirt, trousers: null, sleeve: COL.shirt, shoes: false, hair: "bob", collarBand: true };

// ------------------------------------------------------------------ props
function drawSuitcase(ctx, x, y, w = 150, h = 104, rot = 0) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  ctx.beginPath(); ctx.roundRect(-w / 2, -h, w, h, 12);
  ctx.fillStyle = "#3a2312"; ctx.fill();
  ctx.lineWidth = 10; ctx.strokeStyle = INK; ctx.stroke();
  ctx.beginPath(); ctx.roundRect(-26, -h - 26, 52, 28, 10);
  ctx.lineWidth = 10; ctx.strokeStyle = INK; ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(-w * 0.26, -h + 8); ctx.lineTo(-w * 0.26, -8);
  ctx.moveTo(w * 0.26, -h + 8); ctx.lineTo(w * 0.26, -8);
  ctx.lineWidth = 9; ctx.strokeStyle = "rgba(0,0,0,.6)"; ctx.stroke();
  ctx.restore();
}

function drawPassport(ctx, at, angle = 0, sc = 1) {
  ctx.save(); ctx.translate(at.x, at.y); ctx.rotate(angle); ctx.scale(sc, sc);
  ctx.beginPath(); ctx.roundRect(-52, -34, 104, 68, 8);
  ctx.fillStyle = "#e9e5dc"; ctx.fill();
  ctx.lineWidth = 8; ctx.strokeStyle = INK; ctx.stroke();
  // a second sheet peeking out
  ctx.beginPath(); ctx.roundRect(-46, -40, 96, 14, 5);
  ctx.fillStyle = "#f4f1ea"; ctx.fill();
  ctx.lineWidth = 6; ctx.strokeStyle = INK; ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(-32, -14); ctx.lineTo(34, -14);
  ctx.moveTo(-32, 2); ctx.lineTo(18, 2);
  ctx.moveTo(-32, 18); ctx.lineTo(28, 18);
  ctx.lineWidth = 5; ctx.strokeStyle = "rgba(17,17,20,.45)"; ctx.stroke();
  ctx.restore();
}

// a thin inked lip that ties the figures to the counter's top edge
function drawCounterLip(ctx, y) {
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(-40, y);
  ctx.lineTo(1120, y);
  ctx.lineWidth = 12; ctx.strokeStyle = "rgba(17,17,20,.55)"; ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(-40, y - 22);
  ctx.lineTo(1120, y - 22);
  ctx.lineWidth = 22; ctx.strokeStyle = "rgba(255,252,245,.35)"; ctx.stroke();
  ctx.restore();
}

// ------------------------------------------------------------------ camera
// The plate is drawn as one homography; figures use the same homography,
// so they are welded to the floor and the walls at any zoom.
function plateTransform(cam) {
  return { dw: 1080 * cam.z, dh: 1920 * cam.z,
           ox: (W - 1080 * cam.z) * (cam.px / W),
           oy: (H - 1920 * cam.z) * (cam.py / H) };
}
function withPlate(ctx, cam, fn) {
  const m = plateTransform(cam);
  ctx.save();
  ctx.translate(m.ox, m.oy);
  ctx.scale(cam.z, cam.z);
  fn();
  ctx.restore();
}
function camAt(shot, t) {
  const u = clamp((t - shot.start) / (shot.end - shot.start));
  const c = shot.cam, e = ease(u);
  return { z: lerp(c.from, c.to, e), px: lerp(c.px0, c.px1, e), py: lerp(c.py0, c.py1, e) };
}

// ------------------------------------------------------------------ crowd
// Passers-by in the same language: filled coats, ink outlines, blank faces.
const CROWD = [
  { y: 1500, sc: 0.56, dur: 6.2,  off: 0.0, dir: 1,  coat: COL.coat2, case: true },
  { y: 1440, sc: 0.47, dur: 8.0,  off: 3.1, dir: -1, coat: COL.coat3, case: false },
  { y: 1390, sc: 0.39, dur: 10.4, off: 1.4, dir: 1,  coat: COL.coat4, case: true },
];

function drawCrowd(ctx, t) {
  for (const c of CROWD) {
    const u = ((((t + c.off) % c.dur) + c.dur) % c.dur) / c.dur;
    if (u > 0.94) continue;
    const x = c.dir > 0 ? lerp(-360, 1460, u) : lerp(1460, -360, u);
    const step = Math.sin((t + c.off) * 6.4);
    drawFigure(ctx, {
      x, y: c.y, scale: c.sc, flip: c.dir < 0,
      torso: c.coat, trousers: "#242730", sleeve: c.coat, shoes: true, hair: "tuft",
      squash: 1 - Math.abs(step) * 0.016,
      lean: 0.04 * c.dir,
      headRot: 0.03 * Math.sin(t * 2 + c.off),
      face: FACE.flat, blink: 0,
      handL: { x: -118 - step * 20, y: -258 },
      handR: { x: 118 + step * 20, y: -258 },
      footL: { x: -54 + step * 34, y: -Math.max(0, step) * 30 },
      footR: { x: 54 - step * 34, y: -Math.max(0, -step) * 30 },
    });
    if (c.case) {
      const bx = x - c.dir * 170 * c.sc;
      drawSuitcase(ctx, bx, c.y, 120 * c.sc, 84 * c.sc, -0.04);
    }
  }
}

// ------------------------------------------------------------------ shots
const SHOTS = [];
const addShot = (o) => SHOTS.push(o);

function drawPlateImage(ctx, img, cam) {
  const iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height;
  const dw = W * cam.z, dh = H * cam.z;
  const ox = (W - dw) * (cam.px / W), oy = (H - dh) * (cam.py / H);
  ctx.drawImage(img, ox, oy, dw, dh);
}

// =====================================================================
// The cut. 51.6 s of narration, ten beats. The shot boundaries sit in the
// gaps between speech segments, so a new picture lands when he draws breath.
// =====================================================================
const P_COUNTER = 1492;          // the counter's top edge in scene-09

// ---- a helper: the same man, always. Only the pose changes.
function man(over, t) {
  return { ...HIM, voice: t == null ? { open: 0, vowel: 0 } : voiceAt(t),
           x: 620, y: 1740, scale: 0.92, squash: 1, lean: 0,
           headRot: 0, face: FACE.tired, blink: 0,
           handL: { x: -152, y: -246 }, handR: { x: 152, y: -246 },
           footL: { x: -54, y: 0 }, footR: { x: 54, y: 0 },
           ...over };
}

// ---- 1  the hall; he walks away from us into it. Back view, no face.
//         A crowd walks past in the other direction, all of them faster.
addShot({
  id: "v1", start: 0.0, end: 7.7, plate: "scene-10", vo: false,
  cam: { from: 1.00, to: 1.14, px0: 560, px1: 580, py0: 980, py1: 940 },
  draw(ctx, t, cam) {
    withPlate(ctx, cam, () => {
      drawCrowd(ctx, t);
      const step = Math.sin(t * 5.4);
      const w = clamp(t / 7.0);
      const man1 = man({
        x: lerp(600, 660, ease(w)), y: lerp(1700, 1580, ease(w)), scale: 0.90,
        faceless: true,
        squash: 1 + Math.abs(step) * 0.012,
        lean: 0.03, headRot: 0.02,
        handL: { x: -146 - step * 16, y: -250 },
        handR: { x: 150 + step * 10, y: -196 },
        footL: { x: -50 + step * 30, y: -Math.max(0, step) * 26 },
        footR: { x: 50 - step * 30, y: -Math.max(0, -step) * 26 },
      }, t);
      drawFigure(ctx, man1);
      // the old suitcase, in his hand, swinging with the walk
      const hp = handWorld(man1, "handR");
      drawSuitcase(ctx, hp.x + 12, hp.y + 78, 118, 86, -0.03 + step * 0.03);
    });
  },
});

// ---- 2  he turns to the empty hall and looks up at the departures
addShot({
  id: "v2", start: 7.7, end: 13.4, plate: "scene-10", vo: false,
  cam: { from: 1.12, to: 1.26, px0: 620, px1: 640, py0: 1090, py1: 1000 },
  draw(ctx, t, cam) {
    const tt = t - 7.7;
    withPlate(ctx, cam, () => {
      const up = ramp(tt, 0.6, 1.8);
      const toUs = ramp(tt, 3.6, 4.6);
      drawFigure(ctx, man({
        squash: 1 + Math.sin(t * 1.6) * 0.008,
        headRot: 0.04 - up * 0.22 + toUs * 0.14,
        face: mixFace(mixFace("tired", "sad", up), "worry", toUs * 0.5),
        blink: blinkAt(t, 3.1, 9.2),
      }, t));
    });
  },
});

// ---- 3  push in: the years land on his face
addShot({
  id: "v3", start: 13.4, end: 18.0, plate: "scene-10", vo: false,
  cam: { from: 1.34, to: 1.72, px0: 640, px1: 650, py0: 940, py1: 880 },
  draw(ctx, t, cam) {
    const tt = t - 13.4;
    withPlate(ctx, cam, () => {
      const drop = ramp(tt, 0.9, 2.4);
      drawFigure(ctx, man({
        squash: 1 + Math.sin(t * 1.5) * 0.008,
        headRot: 0.16 + drop * 0.12,
        face: mixFace("tired", "sad", drop),
        blink: blinkAt(t, 3.0, 14.8) + (drop > 0.4 ? 0.3 : 0),
      }, t));
    });
  },
});

// ---- 4  he walks, with the case, toward the counter — the frame travels with him
addShot({
  id: "v4", start: 18.0, end: 22.9, plate: "scene-03", vo: false,
  cam: { from: 1.06, to: 1.16, px0: 470, px1: 560, py0: 960, py1: 900 },
  draw(ctx, t, cam) {
    const tt = t - 18.0;
    const step = Math.sin(tt * 6.6);
    const w = clamp(tt / 4.4);
    withPlate(ctx, cam, () => {
      const x = lerp(360, 620, ease(w));
      const m4 = man({
        x, y: 1610, scale: 0.98,
        squash: 1 - Math.abs(step) * 0.02,
        lean: 0.02, headRot: 0.02,
        face: mixFace("tired", "worry", w),
        blink: blinkAt(t, 2.8, 19.6),
        handL: { x: -150 - step * 20, y: -248 },
        handR: { x: 150 + step * 10, y: -196 },
        footL: { x: -54 + step * 32, y: -Math.max(0, step) * 26 },
        footR: { x: 54 - step * 32, y: -Math.max(0, -step) * 26 },
      }, t);
      drawFigure(ctx, m4);
      const hp4 = handWorld(m4, "handR");
      drawSuitcase(ctx, hp4.x + 14, hp4.y + 84, 124, 90, -0.03 + step * 0.03);
    });

});

// ---- 5/6/7/8  passport control, one continuous performance, four cameras
//               the officer speaks (his mouth runs on the voice), the man does not
function passportAt(tt, absT) {
  const give = win(tt, 0.4, 1.2, 2.0, 2.8);
  const held = ramp(tt, 1.6, 2.4);
  const recheck = win(tt, 5.0, 5.3, 5.8, 6.4);
  const refuse = ramp(tt, 7.0, 7.6);
  const announce = ramp(tt, 8.8, 9.3);
  const takeBack = ramp(tt, 10.4, 11.4);
  const sag = ramp(tt, 11.0, 12.6);
  const droop = ramp(tt, 13.6, 15.4);

  const officer = {
    ...OFFICER,
    x: 742, y: 1770, scale: 1.06, flip: false,
    lean: -0.02,
    headRot: 0.03 - held * 0.10 + recheck * 0.12 + announce * 0.03,
    face: mixFace(mixFace(mixFace(mixFace("neutral", "doubt", held), "doubt", recheck),
                          "stern", refuse * 0.8), "announce", announce),
    blink: blinkAt(tt, 4.4, 3.0),
    voice: absT == null ? { open: 0, vowel: 0 } : { ...voiceAt(absT), gain: 0.55 },
    handL: lp({ x: -132, y: -300 }, { x: -170, y: -366 }, held),
    handR: lp(lp({ x: 132, y: -300 }, { x: 196, y: -330 }, refuse), { x: 214, y: -392 }, announce),
    footL: { x: -44, y: 0 }, footR: { x: 44, y: 0 },
    shadow: false,
  };

  const him = man({
    x: 246, y: 1852, scale: 1.12,
    squash: 1 + Math.sin(tt * 1.9) * 0.006 - droop * 0.02,
    lean: -0.03 + droop * 0.10,
    headRot: -0.03 + sag * 0.14 + droop * 0.30,
    face: mixFace(mixFace(mixFace("worry", "shock", win(tt, 3.0, 3.3, 4.0, 4.6)),
                          "sad", ramp(tt, 6.0, 7.4)), "sad", droop * 0.5),
    blink: blinkAt(tt, 3.2, 1.6),
    handL: { x: -150, y: -244 },
    handR: lp({ x: 150, y: -290 }, { x: 214, y: -420 }, clamp(give - takeBack * 0.92)),
  }, absT);

  const himHand = handWorld(him, "handR");
  const offHand = handWorld(officer, "handL");
  const papers =
    tt < 1.2 ? himHand :
    tt < 2.8 ? lp(himHand, offHand, ramp(tt, 1.2, 2.8)) :
    tt < 10.4 ? offHand : lp(offHand, himHand, ramp(tt, 10.4, 11.6));

  return { officer, him, papers };
}

function drawPassportShot(ctx, t, cam, tt) {
  const st = passportAt(tt, t);
  const img = plate("scene-09");
  withPlate(ctx, cam, () => {
    ctx.save();
    ctx.beginPath(); ctx.rect(-500, -1000, 2100, P_COUNTER + 1000); ctx.clip();
    drawFigure(ctx, { ...st.officer, noLegs: true });
    ctx.restore();
    if (img.naturalWidth) {
      const ih = img.naturalHeight, iw = img.naturalWidth;
      const sy = (P_COUNTER / 1920) * ih;
      ctx.drawImage(img, 0, sy, iw, ih - sy, 0, P_COUNTER, 1080, 1920 - P_COUNTER);
    }
    drawFigure(ctx, st.him);
    drawPassport(ctx, st.papers, -0.12 + 0.10 * Math.sin(tt * 0.7), 0.72);
  });
}

addShot({ id: "v5", start: 22.9, end: 28.4, plate: "scene-09", vo: true,
  cam: { from: 1.16, to: 1.06, px0: 560, px1: 540, py0: 1040, py1: 1000 },
  draw(ctx, t, cam) { drawPassportShot(ctx, t, cam, t - 22.9); } });

addShot({ id: "v6", start: 28.4, end: 33.0, plate: "scene-09", vo: true,
  cam: { from: 1.06, to: 1.26, px0: 660, px1: 690, py0: 1000, py1: 940 },
  draw(ctx, t, cam) { drawPassportShot(ctx, t, cam, t - 22.9); } });

addShot({ id: "v7", start: 33.0, end: 38.5, plate: "scene-09", vo: true,
  cam: { from: 1.10, to: 1.34, px0: 390, px1: 340, py0: 1010, py1: 940 },
  draw(ctx, t, cam) { drawPassportShot(ctx, t, cam, t - 22.9); } });

addShot({ id: "v8", start: 38.5, end: 44.1, plate: "scene-09", vo: true,
  cam: { from: 1.26, to: 1.06, px0: 460, px1: 520, py0: 980, py1: 1040 },
  draw(ctx, t, cam) { drawPassportShot(ctx, t, cam, t - 22.9); } });

// ---- 9  the dark gate at night — the years, in one wide shot
addShot({
  id: "v9", start: 44.1, end: 48.0, plate: "scene-02", vo: false,
  cam: { from: 1.04, to: 1.16, px0: 600, px1: 520, py0: 1000, py1: 950 },
  draw(ctx, t, cam) {
    const tt = t - 44.1;
    withPlate(ctx, cam, () => {
      const sit = ramp(tt, 0.2, 1.6);
      const m9 = man({
        x: 300, y: 1560, scale: 0.84,
        squash: 1 - sit * 0.05,
        lean: 0.10, headRot: 0.22,
        face: FACE.tired,
        blink: (t * 0.4) % 1 < 0.35 ? 1 : 0.3,
        handL: { x: -140, y: -262 }, handR: { x: 140, y: -262 },
        footL: { x: -44, y: 0 }, footR: { x: 44, y: 0 },
      }, t);
      drawFigure(ctx, m9);
      const hp9 = handWorld(m9, "handR");
      drawSuitcase(ctx, hp9.x + 10, hp9.y + 74, 108, 78, -0.03);

});

// ---- 10  he turns to us and shrugs: both hands open, palms up, no answer
addShot({
  id: "v10", start: 48.0, end: 51.6, plate: "scene-02", vo: false,
  cam: { from: 1.30, to: 1.16, px0: 470, px1: 430, py0: 940, py1: 1000 },
  draw(ctx, t, cam) {
    const tt = t - 48.0;
    const turn = ramp(tt, 0.1, 0.9);
    const shrug = ramp(tt, 1.1, 2.0);
    withPlate(ctx, cam, () => {
      drawFigure(ctx, man({
        x: 430, y: 1700, scale: 1.02,
        squash: 1 + shrug * 0.02,
        lean: -turn * 0.03,
        headRot: turn * 0.10 - shrug * 0.06,
        face: mixFace("tired", "worry", shrug * 0.55),
        blink: blinkAt(tt, 2.6, 1.2),
        // hands turned up, close to the body, elbows tucked — the sheet's shrug
        handL: { x: -196 - shrug * 12, y: -286 - shrug * 30 },
        handR: { x: 196 + shrug * 12, y: -286 - shrug * 30 },
      }, t));
    });
  },
});

// ------------------------------------------------------------------ stage
const DURATION = 51.6;
const host = document.getElementById("shots");
const layers = new Map();
function layerFor(shot) {
  let L = layers.get(shot.id);
  if (L) return L;
  const wrap = document.createElement("div");
  wrap.className = "shot";
  const cv = document.createElement("canvas");
  cv.width = W; cv.height = H;
  wrap.appendChild(cv);
  host.appendChild(wrap);
  L = { wrap, ctx: cv.getContext("2d"), img: plate(shot.plate) };
  layers.set(shot.id, L);
  return L;
}
function shotAt(t) { for (const s of SHOTS) if (t >= s.start && t < s.end) return s; return SHOTS[SHOTS.length - 1]; }

function renderer(t) {
  const shot = shotAt(t);
  const cam = camAt(shot, t);
  const L = layerFor(shot);
  for (const s of SHOTS) { const M = layers.get(s.id); if (M) M.wrap.style.opacity = s === shot ? "1" : "0"; }
  const ctx = L.ctx;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, W, H);
  if (L.img.complete && L.img.naturalWidth) drawPlateImage(ctx, L.img, cam);
  else { ctx.fillStyle = "#0b0d10"; ctx.fillRect(0, 0, W, H); }
  shot.draw(ctx, t, cam);
  ctx.save();
  ctx.globalCompositeOperation = "source-atop";
  ctx.fillStyle = "rgba(30,24,16,0.05)";
  ctx.fillRect(0, 0, W, H);
  ctx.restore();
}

window.__shots = SHOTS;
window.__duration = DURATION;
window.__render = (t) => { window.__t = t; renderer(t); };
renderer(0);
// boot: the lip-sync table arrives as a script (analysis/lipsync.js), so a
// file:// page can read it too; then the plates.
window.__ready = (async () => {
  await Promise.all([...new Set(SHOTS.map((s) => s.plate))].map((p) => plate(p)).map((img) => new Promise((res) => {
    if (img.complete) return res(); img.onload = res; img.onerror = res;
  })));
  renderer(window.__t || 0);
  return { frames: window.__VOICE ? window.__VOICE.frames.length : 0 };
})();
</script>
