<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ideal — motion graphic starter</title>
<style>
  :root {
    --bg: #0b0d14;
    --bg-2: #141828;
    --fg: #f7f8fc;
    --muted: #a6adbf;
    --accent: #ff5c8a;
    --accent-2: #7c5cff;
    --safe-x: 192px;
    --safe-y: 108px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { font-family: system-ui, "Segoe UI", Roboto, Arial, sans-serif; }

  /* Fixed-design stage. The renderer opens a WIDTH x HEIGHT viewport, so
     fit() resolves to scale(1) during export and scales down for preview. */
  #stage {
    position: absolute; left: 50%; top: 50%;
    width: 1920px; height: 1080px;
    transform-origin: center center;
    overflow: hidden;
    background:
      radial-gradient(1100px 700px at 78% 22%, rgba(124, 92, 255, .20), transparent 70%),
      radial-gradient(900px 620px at 12% 88%, rgba(255, 92, 138, .14), transparent 70%),
      linear-gradient(135deg, var(--bg), var(--bg-2));
    color: var(--fg);
  }
  #stage.transparent { background: transparent; }
  .safe { position: absolute; inset: var(--safe-y) var(--safe-x); }

  .orb {
    position: absolute; border-radius: 50%;
    filter: none; /* keep compositing cheap */
    background: radial-gradient(circle at 35% 35%, var(--accent-2), rgba(124, 92, 255, 0));
    opacity: .55;
  }
  .orb-a { width: 560px; height: 560px; right: -60px; top: -120px; }
  .orb-b {
    width: 320px; height: 320px; left: -80px; bottom: -100px;
    background: radial-gradient(circle at 35% 35%, var(--accent), rgba(255, 92, 138, 0));
    opacity: .35;
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
    background-size: 96px 96px;
    mask-image: linear-gradient(90deg, transparent, #000 45%, transparent);
  }

  .eyebrow {
    position: absolute; top: 40px; left: 0;
    font-size: 28px; font-weight: 700; letter-spacing: .34em;
    text-transform: uppercase; color: var(--accent);
  }
  .rule {
    position: absolute; top: 104px; left: 0;
    width: 420px; height: 4px; background: var(--accent);
    transform-origin: left center;
  }
  .title-wrap { position: absolute; top: 200px; left: 0; }
  .line { overflow: hidden; }
  .line span {
    display: block; font-size: 168px; line-height: 1.02;
    font-weight: 800; letter-spacing: -.045em;
    will-change: transform, opacity, clip-path;
  }
  .line em { font-style: normal; color: var(--accent); }
  .subtitle {
    position: absolute; top: 570px; left: 0;
    font-size: 46px; line-height: 1.35; color: var(--muted);
    max-width: 1100px;
  }
  .stat {
    position: absolute; left: 0; bottom: 40px;
    display: flex; align-items: baseline; gap: 18px;
    font-variant-numeric: tabular-nums;
  }
  .stat .num { font-size: 120px; font-weight: 800; letter-spacing: -.04em; min-width: 300px; }
  .stat .unit { font-size: 44px; color: var(--muted); }
  .footer {
    position: absolute; right: 0; bottom: 62px; text-align: right;
    font-size: 26px; letter-spacing: .16em; text-transform: uppercase;
    color: var(--muted);
  }
  .progress {
    position: absolute; left: 0; right: 0; bottom: 0; height: 6px;
    background: rgba(255,255,255,.10);
  }
  .progress > i {
    display: block; height: 100%; width: 100%; background: var(--accent);
    transform: scaleX(0); transform-origin: left center;
  }
</style>
</head>
<body>
<div id="stage">
  <div class="grid"></div>
  <div class="orb orb-a" id="orb-a"></div>
  <div class="orb orb-b" id="orb-b"></div>
  <div class="safe">
    <div class="eyebrow" id="eyebrow">IDEAL / MOTION</div>
    <div class="rule" id="rule"></div>
    <div class="title-wrap">
      <div class="line"><span id="line-1">MAKE IT</span></div>
      <div class="line"><span id="line-2"><em>MOVE.</em></span></div>
    </div>
    <div class="subtitle" id="subtitle">A frame-driven motion graphic starter.<br />Edit the copy, beats, and palette — keep the timeline deterministic.</div>
    <div class="stat" id="stat"><span class="num" id="num">0</span><span class="unit">% in motion</span></div>
    <div class="footer" id="footer">Ideal Studio · 2026</div>
    <div class="progress"><i id="bar"></i></div>
  </div>
</div>

<script>
(() => {
  'use strict';

  // ---- Scene constants -----------------------------------------------------
  const WIDTH = 1920;
  const HEIGHT = 1080;
  const FPS = 30;
  const DURATION = 6;                 // seconds
  const FRAMES = FPS * DURATION;     // 180
  const EASE = {
    out:   'cubic-bezier(0.22, 1, 0.36, 1)',
    inOut: 'cubic-bezier(0.65, 0, 0.35, 1)',
    in:    'cubic-bezier(0.55, 0, 1, 0.45)',
    soft:  'cubic-bezier(0.33, 1, 0.68, 1)',
  };

  const params = new URLSearchParams(location.search);
  const stage = document.getElementById('stage');
  const $ = (id) => document.getElementById(id);

  // Fit the fixed stage into whatever viewport is showing it.
  function fit() {
    const scale = Math.min(innerWidth / WIDTH, innerHeight / HEIGHT);
    stage.style.transform = `translate(-50%, -50%) scale(${scale})`;
  }
  addEventListener('resize', fit);
  fit();

  // ---- Timeline ------------------------------------------------------------
  // Every animation is created paused and moved with currentTime = frame/FPS.
  // No CSS keyframes, no rAF, no setTimeout, no randomness: same frame -> same pixels.
  const timeline = [];
  function add(el, keyframes, startFrame, frames, easing = EASE.out) {
    const a = el.animate(keyframes, {
      delay: (startFrame / FPS) * 1000,
      duration: (frames / FPS) * 1000,
      easing,
      fill: 'both',
    });
    a.pause();
    timeline.push(a);
    return a;
  }

  const fadeUp = (dy = 40) => [
    { transform: `translateY(${dy}px)`, opacity: 0 },
    { transform: 'translateY(0)',       opacity: 1 },
  ];
  const maskReveal = [
    { transform: 'translateY(60px)', opacity: 0, clipPath: 'inset(0 100% 0 0)' },
    { transform: 'translateY(0)',    opacity: 1, clipPath: 'inset(0 0% 0 0)' },
  ];

  add($('eyebrow'), fadeUp(24), 0, 14);
  add($('rule'), [{ transform: 'scaleX(0)' }, { transform: 'scaleX(1)' }], 6, 20, EASE.inOut);
  add($('line-1'), maskReveal, 18, 24);
  add($('line-2'), maskReveal, 30, 24);
  add($('subtitle'), fadeUp(24), 54, 22);
  add($('stat'), fadeUp(20), 66, 20);
  add($('footer'), fadeUp(16), 78, 18);

  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);

  // Per-frame state that is easier to express as math than as keyframes.
  function seek(frame) {
    const f = clamp(Math.round(frame), 0, FRAMES - 1);
    const ms = (f / FPS) * 1000;
    for (const a of timeline) a.currentTime = ms;

    // Count-up: 0 -> 100 between frames 70 and 115.
    const p = clamp((f - 70) / 45, 0, 1);
    $('num').textContent = String(Math.round(easeOutCubic(p) * 100));

    // Progress bar and a slow, deterministic accent drift.
    $('bar').style.transform = `scaleX(${f / (FRAMES - 1)})`;
    const t = f / FPS;
    $('orb-a').style.transform = `translate(${Math.sin(t * 0.55) * 26}px, ${Math.cos(t * 0.45) * 18}px)`;
    $('orb-b').style.transform = `translate(${Math.cos(t * 0.4) * 20}px, ${Math.sin(t * 0.6) * 16}px)`;

    document.documentElement.dataset.frame = String(f);
    return f;
  }

  // ---- Public contract used by scripts/render.mjs -------------------------
  const motion = {
    fps: FPS,
    frames: FRAMES,
    duration: DURATION,
    width: WIDTH,
    height: HEIGHT,
    seek,
    ready: false,
  };
  window.__MOTION__ = motion;

  const still = params.has('frame') || params.has('still');
  if (still) {
    seek(Number(params.get('frame') || FRAMES - 1));
  }

  const finish = () => {
    motion.ready = true;
    if (!still) for (const a of timeline) a.play();
  };
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(finish);
  else finish();
})();
</script>
</body>
</html>
