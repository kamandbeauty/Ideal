name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: PHP syntax (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint every PHP file
        run: |
          find tshirt-designer -name '*.php' -print0 \
            | xargs -0 -n1 -P4 php -l

  coding-standards:
    name: WordPress coding standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
          tools: cs2pr

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('composer.json') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      # Advisory on the first run: the codebase was written to WPCS by hand but
      # has never been machine-checked, so phpcs is expected to report style
      # nits. Review the first run's annotations, fix them, then delete the
      # continue-on-error line below to make standards blocking.
      - name: Run phpcs
        run: vendor/bin/phpcs --report-full --report-checkstyle=phpcs-report.xml
        continue-on-error: true

      - name: Annotate results
        run: cs2pr phpcs-report.xml
        if: always()

      # Errors (as opposed to warnings) should never be acceptable, so surface
      # the count even while the job as a whole is advisory.
      - name: Summarise
        if: always()
        run: |
          if [ -f phpcs-report.xml ]; then
            errors=$(grep -c 'severity="5"' phpcs-report.xml || true)
            echo "phpcs errors: ${errors:-0}" >> "$GITHUB_STEP_SUMMARY"
          fi

  translations:
    name: Translation catalogue is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Regenerate the catalogue
        run: python3 tools/make_translations.py | tee /tmp/i18n.log

      - name: Fail on missing translations
        run: |
          if grep -q "^MISSING fa translations" /tmp/i18n.log; then
            echo "::error::New translatable strings have no Persian translation."
            grep -A100 "^MISSING" /tmp/i18n.log
            exit 1
          fi
          echo "fa_IR coverage is complete."

      - name: Fail if the committed catalogue is stale
        run: |
          # The generator rewrites POT-Creation-Date on every run, so a plain
          # `git diff` is always dirty. Compare only the msgid/msgstr content.
          strip() { grep -vE '^"(POT-Creation-Date|PO-Revision-Date):' "$1"; }
          for f in tshirt-designer/languages/tshirt-designer.pot \
                   tshirt-designer/languages/tshirt-designer-fa_IR.po; do
            git show "HEAD:$f" > /tmp/committed.po 2>/dev/null || continue
            if ! diff -q <(strip /tmp/committed.po) <(strip "$f") >/dev/null; then
              echo "::error::$f is out of date. Run tools/make_translations.py and commit."
              diff <(strip /tmp/committed.po) <(strip "$f") | head -40
              exit 1
            fi
          done
          echo "Translation catalogue is up to date."

  database:
    name: Schema audit on ${{ matrix.db }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - db: mysql-8.0
            image: mysql:8.0
          - db: mysql-8.4
            image: mysql:8.4
          - db: mariadb-11.4
            image: mariadb:11.4
    services:
      db:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wptest
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: wptest
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install the SQL parser
        run: pip install sqlglot

      - name: Static dialect audit
        run: |
          python3 tools/db-audit/render_schema.py
          python3 tools/db-audit/mysql_audit.py
          python3 tools/db-audit/dml_audit.py

      # The step the sandbox could not run: execute the real schema against a
      # real server. utf8mb4 index limits, strict-mode date defaults and
      # dbDelta idempotency only surface here.
      - name: Apply the schema to a real server
        run: |
          mysql -h 127.0.0.1 -P 3306 -uroot -proot wptest \
            --default-character-set=utf8mb4 < schema.sql
          echo "schema applied"

      - name: Re-apply (must be idempotent)
        run: |
          set -e
          if mysql -h 127.0.0.1 -P 3306 -uroot -proot wptest < schema.sql 2>/tmp/e; then
            echo "re-apply succeeded"
          else
            grep -q "already exists" /tmp/e && echo "re-apply reports existing tables (expected)" || { cat /tmp/e; exit 1; }
          fi

      - name: Verify charset, collation and engine
        run: |
          mysql -h 127.0.0.1 -P 3306 -uroot -proot -N -B wptest -e "
            SELECT TABLE_NAME, ENGINE, TABLE_COLLATION
            FROM information_schema.TABLES WHERE TABLE_SCHEMA='wptest';" | tee /tmp/t.txt
          test "$(wc -l < /tmp/t.txt)" -eq 13 || { echo '::error::expected 13 tables'; exit 1; }
          grep -v utf8mb4 /tmp/t.txt && { echo '::error::a table is not utf8mb4'; exit 1; } || true

      - name: Round-trip Persian text
        run: |
          mysql -h 127.0.0.1 -P 3306 -uroot -proot wptest --default-character-set=utf8mb4 -e "
            INSERT INTO wp_td_models (name, slug, product_type)
              VALUES ('تی‌شرت','fa-tshirt','tshirt'), ('توت‌بگ','fa-tote','totebag');
            INSERT INTO wp_td_model_colors (model_id, name, hex)
              VALUES (1,'مشکی','#000000'), (1,'سفید','#FFFFFF'), (1,'قرمز','#FF0000');"
          mysql -h 127.0.0.1 -P 3306 -uroot -proot -N -B wptest --default-character-set=utf8mb4 -e "
            SELECT name FROM wp_td_models WHERE slug LIKE 'fa-%' ORDER BY id;
            SELECT name FROM wp_td_model_colors ORDER BY id;
            SELECT COUNT(*) FROM wp_td_models WHERE name LIKE '%شرت%';" | tee /tmp/fa.txt
          grep -q 'تی‌شرت' /tmp/fa.txt || { echo '::error::Persian text corrupted on round-trip'; exit 1; }
          grep -q 'طراحی' /tmp/fa.txt && true
          echo "Persian INSERT/SELECT/LIKE preserved"

      - name: Reject strict-mode violations
        run: |
          mysql -h 127.0.0.1 -P 3306 -uroot -proot -N -B wptest -e "SELECT @@sql_mode;"
