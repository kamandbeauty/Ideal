name: Validate and build Android

on:
  push:
    branches: ["arena/e733cbcb-ideal"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: 4.7.2

jobs:
  validate:
    name: Lint and headless tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install GDScript linter
        run: pip install gdtoolkit==4.5.0
      - name: Check formatting and lint
        run: |
          gdformat --check scripts tests
          gdlint scripts tests
          python -m py_compile tests/verify_apk.py
          bash -n tests/android_smoke.sh
      - name: Install Godot
        run: |
          curl -fL --retry 3 -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          chmod +x /tmp/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64
          echo "/tmp/godot-bin" >> "$GITHUB_PATH"
      - name: Import resources and register script classes
        run: Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --editor --path . --import --quit
      - name: Run unit and integration tests
        shell: bash
        run: |
          set -o pipefail
          Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path . --script res://tests/run_tests.gd 2>&1 | tee /tmp/frontline-tests.log
          summary=$(grep -E '[0-9]+ checks, [0-9]+ failures' /tmp/frontline-tests.log | tail -1)
          echo "::notice title=Test summary::${summary:-No test summary was produced}"
          if grep -E 'SCRIPT ERROR|^ERROR:' /tmp/frontline-tests.log; then
            details=$(grep -E 'SCRIPT ERROR|^ERROR:' /tmp/frontline-tests.log | head -15 | tr '\n' '|')
            echo "::error title=Godot runtime errors::$details"
            exit 1
          fi
          test -n "$summary"

  android:
    name: Android debug APK and AAB
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Temporary artifact transfer uses the Git blob API; no branch is changed.
    permissions:
      contents: write
    env:
      GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /home/runner/.android/frontline-debug.keystore
      GODOT_ANDROID_KEYSTORE_DEBUG_USER: frontlinedebug
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -o pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "::error::The hosted runner has no Android command-line tools under ANDROID_HOME"
            exit 1
          fi
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.1.0" "ndk;29.0.14206865" 2>&1 | tee /tmp/sdk-install.log || {
            echo "::error title=Android SDK installation failed::$(tail -n 15 /tmp/sdk-install.log | tr '\n' '|')"
            exit 1
          }
      - name: Install Godot and Android export templates
        run: |
          curl -fL --retry 3 -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          chmod +x /tmp/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64
          echo "/tmp/godot-bin" >> "$GITHUB_PATH"
          curl -fL --retry 3 -o /tmp/templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -j /tmp/templates.tpz 'templates/android_debug.apk' 'templates/android_release.apk' 'templates/android_source.zip' 'templates/web_nothreads_debug.zip' 'templates/version.txt' -d "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
      - name: Generate an ephemeral debug signing key
        run: |
          mkdir -p "$HOME/.android" build
          password=$(openssl rand -hex 24)
          echo "::add-mask::$password"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=$password" >> "$GITHUB_ENV"
          export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD="$password"
          keytool -genkeypair -keystore "$GODOT_ANDROID_KEYSTORE_DEBUG_PATH" \
            -storepass:env GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD \
            -keypass:env GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD \
            -alias "$GODOT_ANDROID_KEYSTORE_DEBUG_USER" \
            -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 3650
      - name: Import project
        run: Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --editor --path . --import --quit
      - name: Export debug APK
        shell: bash
        run: |
          set -o pipefail
          Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path . --install-android-build-template --export-debug "Android" build/ARTILLERY_FRONTLINE-debug.apk 2>&1 | tee /tmp/apk-export.log || {
            echo "::error title=APK export failed::$(tail -n 20 /tmp/apk-export.log | tr '\n' '|')"
            exit 1
          }
          test -s build/ARTILLERY_FRONTLINE-debug.apk
          echo "::notice title=APK SHA256::$(sha256sum build/ARTILLERY_FRONTLINE-debug.apk)"
      - name: Verify APK signature and manifest
        run: |
          python3 -m pip install --user pyaxmlparser==0.3.31
          python3 tests/verify_apk.py build/ARTILLERY_FRONTLINE-debug.apk arm64-v8a
          "$ANDROID_HOME/build-tools/36.1.0/apksigner" verify --verbose build/ARTILLERY_FRONTLINE-debug.apk
          manifest=$("$ANDROID_HOME/build-tools/36.1.0/aapt" dump permissions build/ARTILLERY_FRONTLINE-debug.apk | tr '\n' '|')
          echo "::notice title=APK permissions::$manifest"
          metadata=$("$ANDROID_HOME/build-tools/36.1.0/aapt" dump badging build/ARTILLERY_FRONTLINE-debug.apk | grep -E '^(package:|sdkVersion:|targetSdkVersion:|native-code:)' | tr '\n' '|')
          echo "::notice title=APK metadata::$metadata"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ARTILLERY_FRONTLINE-debug-apk
          path: build/ARTILLERY_FRONTLINE-debug.apk
          if-no-files-found: error
      - name: Export debug Android App Bundle
        shell: bash
        run: |
          set -o pipefail
          Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path . --export-debug "Android AAB" build/ARTILLERY_FRONTLINE-debug.aab 2>&1 | tee /tmp/aab-export.log || {
            echo "::error title=AAB export failed::$(tail -n 20 /tmp/aab-export.log | tr '\n' '|')"
            exit 1
          }
          test -s build/ARTILLERY_FRONTLINE-debug.aab
      - name: Sign and verify debug bundle
        run: |
          jarsigner -keystore "$GODOT_ANDROID_KEYSTORE_DEBUG_PATH" \
            -storepass:env GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD \
            -keypass:env GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD \
            -sigalg SHA256withRSA -digestalg SHA-256 \
            build/ARTILLERY_FRONTLINE-debug.aab "$GODOT_ANDROID_KEYSTORE_DEBUG_USER"
          jarsigner -verify build/ARTILLERY_FRONTLINE-debug.aab | tee /tmp/aab-verification.log
          grep -q 'jar verified' /tmp/aab-verification.log
          echo "::notice title=AAB signature::Debug bundle signature verified (self-signed ephemeral key)"
          python3 -c 'import zipfile; z=zipfile.ZipFile("build/ARTILLERY_FRONTLINE-debug.aab"); names=z.namelist(); required=["assets/fonts/OFL-Rajdhani.txt", "assets/fonts/OFL-IBMPlexMono.txt", "assets/licenses/GODOT-LICENSE.txt", "assets/licenses/GODOT-COPYRIGHT.txt"]; missing=[r for r in required if not any(n.endswith("/"+r) for n in names)]; assert not missing, missing'
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: ARTILLERY_FRONTLINE-debug-aab
          path: build/ARTILLERY_FRONTLINE-debug.aab
          if-no-files-found: error
      - name: Transfer debug artifacts for local inspection
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for extension in apk aab; do
            file="build/ARTILLERY_FRONTLINE-debug.$extension"
            python3 -c 'import sys,zipfile; z=zipfile.ZipFile(sys.argv[1]); bad=z.testzip(); assert bad is None, bad' "$file"
            rm -f /tmp/frontline-part-*
            split -b 12000000 -d "$file" /tmp/frontline-part-
            for part in /tmp/frontline-part-*; do
              index=${part##*-}
              python3 -c 'import base64,json,sys; print(json.dumps({"content":base64.b64encode(open(sys.argv[1],"rb").read()).decode(),"encoding":"base64"}))' "$part" > /tmp/frontline-artifact.json
              blob=$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" --input /tmp/frontline-artifact.json --jq .sha 2>/tmp/frontline-transfer.err) || {
                echo "::error title=Artifact transfer failed::$(tail -n 10 /tmp/frontline-transfer.err | tr '\n' '|')"
                exit 1
              }
              echo "::notice title=DEBUG $extension part $index::$blob"
            done
            echo "::notice title=DEBUG $extension SHA256::$(sha256sum "$file")"
          done

      - name: Export x86_64 APK for emulator testing
        shell: bash
        run: |
          set -o pipefail
          Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path . --export-debug "Android Emulator" build/ARTILLERY_FRONTLINE-emulator.apk 2>&1 | tee /tmp/emulator-export.log || {
            echo "::error title=Emulator APK export failed::$(tail -n 20 /tmp/emulator-export.log | tr '\n' '|')"
            exit 1
          }
          python3 tests/verify_apk.py build/ARTILLERY_FRONTLINE-emulator.apk x86_64
      - name: Upload emulator APK
        uses: actions/upload-artifact@v4
        with:
          name: ARTILLERY_FRONTLINE-emulator-x86_64
          path: build/ARTILLERY_FRONTLINE-emulator.apk
          if-no-files-found: error
      - name: Export optional Web preview
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/web
          Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path . --export-debug "Web Preview" build/web/index.html 2>&1 | tee /tmp/web-export.log || {
            echo "::error title=Web export failed::$(tail -n 20 /tmp/web-export.log | tr '\n' '|')"
            exit 1
          }
          test -s build/web/index.html
          test -s build/web/index.wasm
          test -s build/web/index.pck
      - name: Upload Web preview
        uses: actions/upload-artifact@v4
        with:
          name: ARTILLERY_FRONTLINE-web-preview
          path: build/web/
          if-no-files-found: error
      - name: Transfer Web preview for local testing
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar -czf /tmp/frontline-web.tar.gz -C build/web .
          rm -f /tmp/frontline-web-part-*
          split -b 12000000 -d /tmp/frontline-web.tar.gz /tmp/frontline-web-part-
          for part in /tmp/frontline-web-part-*; do
            index=${part##*-}
            python3 -c 'import base64,json,sys; print(json.dumps({"content":base64.b64encode(open(sys.argv[1],"rb").read()).decode(),"encoding":"base64"}))' "$part" > /tmp/frontline-web.json
            blob=$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" --input /tmp/frontline-web.json --jq .sha)
            echo "::notice title=Web preview part $index::$blob"
          done
          echo "::notice title=Web preview SHA256::$(sha256sum /tmp/frontline-web.tar.gz)"

  visual:
    name: Rendered desktop and touch smoke test
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Install Godot and virtual display
        run: |
          curl -fL --retry 3 -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          chmod +x /tmp/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64
          echo "/tmp/godot-bin" >> "$GITHUB_PATH"
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri
          mkdir -p build
      - name: Import project
        run: Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --editor --path . --import --quit
      - name: Render scenes and exercise touch input
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a -s "-screen 0 1280x720x24" env LIBGL_ALWAYS_SOFTWARE=1 Godot_v${GODOT_VERSION}-stable_linux.x86_64 --rendering-method gl_compatibility --audio-driver Dummy --path . --script res://tests/visual_smoke.gd 2>&1 | tee /tmp/visual.log || {
            echo "::error title=Visual smoke failed::$(tail -n 20 /tmp/visual.log | tr '\n' '|')"
            exit 1
          }
          if grep -E 'SCRIPT ERROR|^ERROR:' /tmp/visual.log; then
            echo "::error title=Rendering errors::$(grep -E 'SCRIPT ERROR|^ERROR:' /tmp/visual.log | head -10 | tr '\n' '|')"
            exit 1
          fi
          echo "::notice title=Visual smoke::$(grep 'Visual smoke:' /tmp/visual.log | tail -1)"
          echo "::notice title=Software rendering observation::$(grep 'Software rendering observation:' /tmp/visual.log | tail -1)"
      - name: Upload screenshots
        if: always() && hashFiles('build/visual-gameplay.png') != ''
        uses: actions/upload-artifact@v4
        with:
          name: ARTILLERY_FRONTLINE-visual-smoke
          path: build/visual-*.png
          if-no-files-found: error
      # Temporary diagnostic transfer while the sandbox cannot access Actions artifact hosts.
      - name: Share screenshot for visual inspection
        if: always() && github.event_name == 'push' && hashFiles('build/visual-gameplay.png') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for screen in menu gameplay impact; do
            [ -f "build/visual-$screen.png" ] || continue
            python3 -c 'import base64,json,sys; print(json.dumps({"content":base64.b64encode(open(sys.argv[1],"rb").read()).decode(),"encoding":"base64"}))' "build/visual-$screen.png" > /tmp/screenshot-blob.json
            blob=$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" --input /tmp/screenshot-blob.json --jq .sha)
            echo "::notice title=Screenshot $screen blob::$blob"
          done

  android_emulator:
    name: Android emulator install and touch smoke test
    needs: android
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # Temporary emulator screenshot transfer; removed after inspection.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/download-artifact@v4
        with:
          name: ARTILLERY_FRONTLINE-emulator-x86_64
          path: build
      - name: Check hardware acceleration
        id: kvm
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod a+rw /dev/kvm
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No KVM on this runner; Android emulator test was skipped."
          fi
      - name: Install, launch, and exercise the app
        if: steps.kvm.outputs.available == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 2048
          script: bash tests/android_smoke.sh build/ARTILLERY_FRONTLINE-emulator.apk
      - name: Upload Android smoke evidence
        if: always() && hashFiles('build/android-*.png') != ''
        uses: actions/upload-artifact@v4
        with:
          name: ARTILLERY_FRONTLINE-android-emulator-evidence
          path: |
            build/android-*.png
            build/android-logcat.txt
          if-no-files-found: error
      - name: Transfer Android screenshots for visual inspection
        if: always() && hashFiles('build/android-*.png') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for image in menu licenses gameplay failure; do
            file="build/android-$image.png"
            if [ -s "$file" ]; then
              python3 -c 'import base64,json,sys; print(json.dumps({"content":base64.b64encode(open(sys.argv[1],"rb").read()).decode(),"encoding":"base64"}))' "$file" > /tmp/frontline-screen.json
              blob=$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" --input /tmp/frontline-screen.json --jq .sha)
              echo "::notice title=Android $image blob::$blob"
            fi
          done
          if [ -s build/android-logcat.txt ]; then
            python3 -c 'import base64,json; print(json.dumps({"content":base64.b64encode(open("build/android-logcat.txt","rb").read()).decode(),"encoding":"base64"}))' > /tmp/frontline-log.json
            blob=$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" --input /tmp/frontline-log.json --jq .sha)
            echo "::notice title=Android logcat blob::$blob"
          fi

  android_emulator_debug:
    name: Android emulator diagnostic (existing test APK)
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # Temporary emulator screenshot transfer; removed after inspection.
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/download-artifact@v4
        with:
          name: ARTILLERY_FRONTLINE-emulator-x86_64
          path: build
          run-id: 42235357933
          github-token: ${{ github.token }}
      - name: Check hardware acceleration
        id: kvm
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod a+rw /dev/kvm
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No KVM on this runner; Android emulator test was skipped."
          fi
      - name: Install, launch, and exercise the app
        if: steps.kvm.outputs.available == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 2048
          script: bash tests/android_smoke.sh build/ARTILLERY_FRONTLINE-emulator.apk
      - name: Upload Android smoke evidence
        if: always() && hashFiles('build/android-*.png') != ''
        uses: actions/upload-artifact@v4
        with:
          name: ARTILLERY_FRONTLINE-android-diagnostic-evidence
          path: |
            build/android-*.png
            build/android-logcat.txt
          if-no-files-found: error
      - name: Transfer Android screenshots for visual inspection
        if: always() && hashFiles('build/android-*.png') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for image in menu licenses gameplay failure; do
            file="build/android-$image.png"
            if [ -s "$file" ]; then
              python3 -c 'import base64,json,sys; print(json.dumps({"content":base64.b64encode(open(sys.argv[1],"rb").read()).decode(),"encoding":"base64"}))' "$file" > /tmp/frontline-screen.json
              blob=$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" --input /tmp/frontline-screen.json --jq .sha)
              echo "::notice title=Android $image blob::$blob"
            fi
          done
          if [ -s build/android-logcat.txt ]; then
            python3 -c 'import base64,json; print(json.dumps({"content":base64.b64encode(open("build/android-logcat.txt","rb").read()).decode(),"encoding":"base64"}))' > /tmp/frontline-log.json
            blob=$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" --input /tmp/frontline-log.json --jq .sha)
            echo "::notice title=Android logcat blob::$blob"
          fi
