name: Validate and build Android

on:
  push:
    branches: ["arena/e733cbcb-ideal"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: 4.7.2

jobs:
  validate:
    name: Lint and headless tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install GDScript linter
        run: pip install gdtoolkit==4.5.0
      - name: Check formatting and lint
        run: |
          gdformat --check scripts tests
          gdlint scripts tests
      - name: Install Godot
        run: |
          curl -fL --retry 3 -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          chmod +x /tmp/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64
          echo "/tmp/godot-bin" >> "$GITHUB_PATH"
      - name: Import resources and register script classes
        run: Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --editor --path . --import --quit
      - name: Run unit and integration tests
        shell: bash
        run: |
          set -o pipefail
          Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path . --script res://tests/run_tests.gd 2>&1 | tee /tmp/frontline-tests.log
          summary=$(grep -E '[0-9]+ checks, [0-9]+ failures' /tmp/frontline-tests.log | tail -1)
          echo "::notice title=Test summary::${summary:-No test summary was produced}"
          if grep -E 'SCRIPT ERROR|^ERROR:' /tmp/frontline-tests.log; then
            details=$(grep -E 'SCRIPT ERROR|^ERROR:' /tmp/frontline-tests.log | head -15 | tr '\n' '|')
            echo "::error title=Godot runtime errors::$details"
            exit 1
          fi
          test -n "$summary"

  android:
    name: Android debug APK and AAB
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /home/runner/.android/frontline-debug.keystore
      GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
      GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -o pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "::error::The hosted runner has no Android command-line tools under ANDROID_HOME"
            exit 1
          fi
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.1.0" 2>&1 | tee /tmp/sdk-install.log || {
            echo "::error title=Android SDK installation failed::$(tail -n 15 /tmp/sdk-install.log | tr '\n' '|')"
            exit 1
          }
      - name: Install Godot and Android export templates
        run: |
          curl -fL --retry 3 -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          chmod +x /tmp/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64
          echo "/tmp/godot-bin" >> "$GITHUB_PATH"
          curl -fL --retry 3 -o /tmp/templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -j /tmp/templates.tpz 'templates/android_debug.apk' 'templates/android_release.apk' 'templates/android_source.zip' 'templates/version.txt' -d "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
      - name: Generate an ephemeral debug signing key
        run: |
          mkdir -p "$HOME/.android" build
          keytool -genkeypair -keystore "$GODOT_ANDROID_KEYSTORE_DEBUG_PATH" -storepass android -keypass android -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 3650
      - name: Import project
        run: Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --editor --path . --import --quit
      - name: Export debug APK
        shell: bash
        run: |
          set -o pipefail
          Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path . --export-debug "Android" build/ARTILLERY_FRONTLINE-debug.apk 2>&1 | tee /tmp/apk-export.log || {
            echo "::error title=APK export failed::$(tail -n 20 /tmp/apk-export.log | tr '\n' '|')"
            exit 1
          }
          test -s build/ARTILLERY_FRONTLINE-debug.apk
          echo "::notice title=APK SHA256::$(sha256sum build/ARTILLERY_FRONTLINE-debug.apk)"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ARTILLERY_FRONTLINE-debug-apk
          path: build/ARTILLERY_FRONTLINE-debug.apk
          if-no-files-found: error
      - name: Install NDK for Gradle bundle export
        shell: bash
        run: |
          set -o pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865" 2>&1 | tee /tmp/ndk-install.log || {
            echo "::error title=Android NDK installation failed::$(tail -n 15 /tmp/ndk-install.log | tr '\n' '|')"
            exit 1
          }
      - name: Export debug Android App Bundle
        shell: bash
        run: |
          set -o pipefail
          Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path . --install-android-build-template --export-debug "Android AAB" build/ARTILLERY_FRONTLINE-debug.aab 2>&1 | tee /tmp/aab-export.log || {
            echo "::error title=AAB export failed::$(tail -n 20 /tmp/aab-export.log | tr '\n' '|')"
            exit 1
          }
          test -s build/ARTILLERY_FRONTLINE-debug.aab
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: ARTILLERY_FRONTLINE-debug-aab
          path: build/ARTILLERY_FRONTLINE-debug.aab
          if-no-files-found: error
