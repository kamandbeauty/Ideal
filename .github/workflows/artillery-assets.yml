name: Author original Blender assets
on:
  push:
    branches: [arena/40ad7d87-ideal]
    paths: ['ARTILLERY_FRONTLINE/tools/create_models.py', 'ARTILLERY_FRONTLINE/tools/create_textures.py', 'ARTILLERY_FRONTLINE/tools/render_weapon_studio.py', 'ARTILLERY_FRONTLINE/tools/verify_art_pass.py', '.github/workflows/artillery-assets.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: artillery-assets-${{ github.ref }}
  cancel-in-progress: false
jobs:
  blender:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install free Blender toolchain
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends blender
      - name: Author and export original models
        run: |
          blender --background --python ARTILLERY_FRONTLINE/tools/create_models.py -- --only mounted_twin_hmg > /tmp/blender.log 2>&1 || { tail -80 /tmp/blender.log; exit 1; }
          if grep -q 'Traceback (most recent call last)' /tmp/blender.log; then tail -80 /tmp/blender.log; exit 1; fi
      - name: Author original seamless PBR textures
        run: |
          python3 -m pip install --quiet numpy pillow
          python3 ARTILLERY_FRONTLINE/tools/create_textures.py
          test -s ARTILLERY_FRONTLINE/assets/textures/pbr/sand_albedo.jpg
          test -s ARTILLERY_FRONTLINE/assets/textures/pbr/sand_normal.png
          test -s ARTILLERY_FRONTLINE/assets/textures/pbr/sky_panorama.jpg
          test -s ARTILLERY_FRONTLINE/assets/textures/pbr/weapon_metal_albedo.jpg
          test -s ARTILLERY_FRONTLINE/assets/textures/pbr/muzzle_flash.png
      - name: Blender Cycles studio render of the revised weapon
        run: |
          blender --background --python ARTILLERY_FRONTLINE/tools/render_weapon_studio.py > /tmp/studio.log 2>&1 || { tail -100 /tmp/studio.log; exit 1; }
          tail -12 /tmp/studio.log
          test -s ARTILLERY_FRONTLINE/documentation/qa/art-pass-01/weapon-studio.png
      - name: Publish Blender diagnostics
        if: always()
        run: |
          tail -60 /tmp/studio.log 2>/dev/null || true
          tail -40 /tmp/verify-art.log 2>/dev/null || true
          ls -l ARTILLERY_FRONTLINE/assets/models/mounted_twin_hmg.glb ARTILLERY_FRONTLINE/documentation/qa/art-pass-01 || true
          if [ -f /tmp/blender.log ]; then
            tail -45 /tmp/blender.log | while IFS= read -r line; do echo "::error title=Blender log::${line}"; done
          else
            echo '::error::Blender log was not created'
          fi
          ls -l ARTILLERY_FRONTLINE/assets/models || true
      - name: Verify exports
        run: |
          grep 'CREATED' /tmp/blender.log || { echo '::error::No CREATED markers; inspect Blender diagnostics'; exit 1; }
          for name in kestrel warden nomad sentry hangar mounted_twin_hmg mounted_cannon mounted_rocket mounted_autocannon soldier landing_craft helicopter patrol_boat bazooka fighter; do test -s "ARTILLERY_FRONTLINE/assets/models/$name.glb" || { echo "::error::Missing export $name"; exit 1; }; done
          mkdir -p ARTILLERY_FRONTLINE/documentation/qa
          blender --version > /tmp/blender-version.txt
          head -1 /tmp/blender-version.txt > ARTILLERY_FRONTLINE/documentation/blender-version.txt
          python3 ARTILLERY_FRONTLINE/tools/verify_art_pass.py > /tmp/verify-art.log 2>&1 || { tail -40 /tmp/verify-art.log | while IFS= read -r line; do echo "::error title=Art gate::${line}"; done; exit 1; }
          cat /tmp/verify-art.log
      - name: Preserve generated assets on the active session branch
        if: github.ref == 'refs/heads/arena/40ad7d87-ideal'
        run: |
          touch ARTILLERY_FRONTLINE/assets/models/source/.gdignore
          bash ARTILLERY_FRONTLINE/tools/publish_ci.sh 'assets: Blender art pass 01 twin HMG geometry, UV PBR and studio render' ARTILLERY_FRONTLINE/assets/models/mounted_twin_hmg.glb ARTILLERY_FRONTLINE/assets/models/source/mounted_twin_hmg.blend ARTILLERY_FRONTLINE/assets/textures/pbr ARTILLERY_FRONTLINE/documentation/blender-version.txt ARTILLERY_FRONTLINE/documentation/qa/art-pass-01 ARTILLERY_FRONTLINE/documentation/art-pass-01.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-blender-models
          path: |
            ARTILLERY_FRONTLINE/assets/models/*.glb
            ARTILLERY_FRONTLINE/assets/models/source/*.blend
            ARTILLERY_FRONTLINE/assets/textures/pbr/
            ARTILLERY_FRONTLINE/documentation/qa/art-pass-01/
            ARTILLERY_FRONTLINE/documentation/art-pass-01.json
            /tmp/blender.log
            /tmp/studio.log
            /tmp/verify-art.log
