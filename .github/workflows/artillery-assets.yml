name: Author original Blender assets
on:
  push:
    branches: [arena/40ad7d87-ideal]
    paths: ['ARTILLERY_FRONTLINE/tools/create_models.py', '.github/workflows/artillery-assets.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: artillery-assets-${{ github.ref }}
  cancel-in-progress: false
jobs:
  blender:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install free Blender toolchain
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends blender
      - name: Author and export original models
        run: blender --background --python ARTILLERY_FRONTLINE/tools/create_models.py > /tmp/blender.log 2>&1 || { tail -80 /tmp/blender.log; exit 1; }
      - name: Publish Blender diagnostics
        if: always()
        run: |
          tail -60 /tmp/blender.log
          grep -E 'Error|Traceback|line [0-9]|CREATED|Exception' /tmp/blender.log | tail -18 | while IFS= read -r line; do echo "::error title=Blender::${line}"; done
      - name: Verify exports
        run: |
          grep 'CREATED' /tmp/blender.log || { echo '::error::No CREATED markers; inspect Blender diagnostics'; exit 1; }
          for name in kestrel warden nomad sentry hangar; do test -s "ARTILLERY_FRONTLINE/assets/models/$name.glb" || { echo "::error::Missing export $name"; exit 1; }; done
          blender --version | head -1 > ARTILLERY_FRONTLINE/documentation/blender-version.txt
      - name: Preserve generated assets on the active session branch
        if: github.ref == 'refs/heads/arena/40ad7d87-ideal'
        run: |
          touch ARTILLERY_FRONTLINE/assets/models/source/.gdignore
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ARTILLERY_FRONTLINE/assets/models ARTILLERY_FRONTLINE/documentation/blender-version.txt
          git diff --cached --quiet || { git commit -m 'assets: author original artillery and battlefield models in Blender'; git pull --rebase origin arena/40ad7d87-ideal; git push origin HEAD:arena/40ad7d87-ideal; }
      - uses: actions/upload-artifact@v4
        with:
          name: original-blender-models
          path: |
            ARTILLERY_FRONTLINE/assets/models/*.glb
            ARTILLERY_FRONTLINE/assets/models/source/*.blend
