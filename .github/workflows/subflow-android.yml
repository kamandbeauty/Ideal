name: subflow-android

# Builds the SubFlow release APK on a real Android toolchain.
# The sandbox this project was written in has no Flutter/JDK/Android SDK, so CI
# is the first place where Dart, Kotlin and the NDK C++ core are actually
# compiled. Everything that *can* be checked without a device runs first and
# gates the APK.

on:
  workflow_dispatch:
    inputs:
      upload_release:
        description: "Attach the APK to the rolling GitHub release"
        type: boolean
        default: false
  push:
    branches: ["main", "arena/**"]
    tags: ["subflow-v*"]
  pull_request:
    paths:
      - "subflow/**"
      - ".github/workflows/subflow-android.yml"

concurrency:
  group: subflow-android-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.24.5
  NDK_VERSION: 26.1.10909125
  CMAKE_VERSION: 3.22.1
  ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

jobs:
  # ---------------------------------------------------------------------------
  # Cheap gate: native core, schema and source-tree checks (no Android SDK).
  # ---------------------------------------------------------------------------
  verify:
    name: native core + schema + structure
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: C++ core unit tests (g++)
        run: make -C subflow/tools/native-core test

      - name: C++ core under ASan + UBSan
        run: make -C subflow/tools/native-core test-asan

      - name: JNI bridge syntax check
        run: make -C subflow/tools/native-core check-jni

      - name: SQLite schema (migrations, constraints, cascades, v1->v2)
        run: python3 subflow/tools/check_schema.py

      - name: Source tree consistency (imports, assets, channel parity, JNI)
        run: python3 subflow/tools/check-project.py

  # ---------------------------------------------------------------------------
  # Real toolchain: analyze, test, build the release APK.
  # ---------------------------------------------------------------------------
  apk:
    name: release APK (arm64-v8a + x86_64)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android NDK and CMake
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "${SDKMANAGER}" --licenses > /dev/null 2>&1 || true
          "${SDKMANAGER}" --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;${NDK_VERSION}" \
            "cmake;${CMAKE_VERSION}"
          echo "NDK installed at ${ANDROID_HOME}/ndk/${NDK_VERSION}"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter / Dart versions
        run: flutter --version

      - name: Platform scaffolding (gradle wrapper, launcher icons, local.properties)
        run: bash subflow/tools/bootstrap-android.sh

      - name: Fetch packages
        working-directory: subflow
        run: flutter pub get

      # Analyzer diagnostics are published as check-run annotations but do not
      # gate the APK: a real compile error still fails the build step below, and
      # this way a style nit can never be the reason the artefact is missing.
      # Annotations are the only log channel reachable from automation here.
      - name: Analyze (diagnostic)
        continue-on-error: true
        working-directory: subflow
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings > /tmp/analyze.log 2>&1 || true
          tail -n 40 /tmp/analyze.log
          grep -E "error •" /tmp/analyze.log | head -10 | while IFS= read -r line; do
            echo "::error title=analyze::${line}"
          done || true
          grep -E "warning •" /tmp/analyze.log | head -5 | while IFS= read -r line; do
            echo "::warning title=analyze::${line}"
          done || true

      # Test failures are republished as annotations: the raw log download is
      # unreachable from automation, so this is the only readable channel.
      - name: Dart unit tests
        working-directory: subflow
        run: |
          if flutter test --reporter expanded > /tmp/test.log 2>&1; then
            tail -3 /tmp/test.log
            exit 0
          fi
          tail -80 /tmp/test.log
          grep -nE "\[E\]|^\s*(Expected|Actual|Which):|Test failed|tests? failed|Error:" /tmp/test.log \
            | tail -20 | while IFS= read -r line; do
                echo "::error title=dart test::$(echo "$line" | cut -c1-300)"
              done || true
          exit 1

      - name: Write release keystore (when configured)
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        working-directory: subflow/android
        run: |
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 -d > subflow-release.jks
          cat > key.properties <<PROPS
          storeFile=subflow-release.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          PROPS
          echo "release keystore configured"

      # The build log is also surfaced as a check-run annotation, because the
      # default log download is not always reachable from automation tooling.
      - name: Build release APK
        id: build
        working-directory: subflow
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee /tmp/subflow-build.log

      - name: Publish build diagnostics
        if: failure()
        run: |
          LOG=/tmp/subflow-build.log
          echo "### Gradle / Flutter build failure" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -nE "error:|Error|FAILURE|What went wrong|Execution failed|Caused by|> Task .* FAILED|Unresolved|expected" "$LOG" \
            | tail -60 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "--- last 40 lines ---" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -40 "$LOG" >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          # Annotations are the only channel reachable by automation. GitHub
          # keeps ~10 annotations per level per step, so compiler errors get the
          # error budget and the Gradle context goes out as warnings.
          grep -E "^(e|w): |^e: file|error: |Unresolved reference" "$LOG" \
            | head -10 | while IFS= read -r line; do
                echo "::error title=kotlin::$(echo "$line" | cut -c1-350)"
              done || true
          awk '/What went wrong/{flag=1} flag{print; n++} n>12{exit}' "$LOG" \
            | grep -vE "^$" | head -6 | while IFS= read -r line; do
                echo "::warning title=gradle::$(echo "$line" | cut -c1-300)"
              done || true
          grep -nE "^> Task .* FAILED|Execution failed for task|Compilation error" "$LOG" \
            | head -4 | while IFS= read -r line; do
                echo "::warning title=build::$(echo "$line" | cut -c1-300)"
              done || true
        continue-on-error: true

      - name: Collect artefact
        id: collect
        run: |
          VERSION="$(grep '^version:' subflow/pubspec.yaml | cut -d' ' -f2 | cut -d'+' -f1)"
          mkdir -p dist
          APK=""
          for candidate in \
            subflow/build/app/outputs/flutter-apk/app-release.apk \
            subflow/build/app/outputs/apk/release/app-release.apk; do
            if [ -f "$candidate" ]; then APK="$candidate"; break; fi
          done
          if [ -z "$APK" ]; then
            echo "APK missing in the known output directories"
            find subflow/build -name '*.apk' -o -name '*.so' | head -20
            echo "::error title=subflow apk::expected APK not produced by flutter build apk --release"
            exit 1
          fi
          OUT="dist/subflow-${VERSION}-release.apk"
          cp "$APK" "$OUT"
          ( cd dist && sha256sum "$(basename "$OUT")" > "$(basename "$OUT").sha256" )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          ls -lh dist
          # Fail loudly if the APK does not contain the native core for arm64.
          unzip -l "$OUT" | grep -q "lib/arm64-v8a/libsubflow_core.so" || {
            echo "libsubflow_core.so missing for arm64-v8a"
            unzip -l "$OUT" | grep -E 'lib/' | head -20
            echo "::error title=subflow apk::libsubflow_core.so missing for arm64-v8a"
            exit 1; }
          unzip -l "$OUT" | grep -q "lib/arm64-v8a/libapp.so" || {
            echo "Flutter arm64 libapp.so missing"
            unzip -l "$OUT" | grep -E 'lib/' | head -20
            echo "::error title=subflow apk::libapp.so missing for arm64-v8a"
            exit 1; }
          echo "APK content verified (arm64 native core + flutter engine)"

      - name: Upload APK artefact
        uses: actions/upload-artifact@v4
        with:
          name: subflow-release-apk
          path: dist/*
          retention-days: 30
          if-no-files-found: error

      - name: Attach to rolling release
        if: (github.event_name == 'workflow_dispatch' && inputs.upload_release == true) || startsWith(github.ref, 'refs/tags/subflow-v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: subflow-apk-latest
          name: SubFlow APK (latest)
          prerelease: true
          allow_updates: true
          body: |
            SubFlow ${{ steps.collect.outputs.version }} — Phase 1.5 (fonts, caption looks, branding).

            Install: enable "install unknown apps" for your browser/file manager, then open the APK.
            Requires Android 8.0 (API 26) or newer on a 64-bit ARM device.

            What this build really does: video import through the Photo Picker, exact
            technical probing, Media3 playback of the original file, project management,
            10 embedded OFL font families (7 Persian-capable), a caption effect engine
            (17 entrances / 9 exits / 8 word effects / 6 easings) with 40 ready looks in
            Persian and English, a live style gallery, and the native subtitle codecs /
            VAD / export-quality planner behind them.

            Speech recognition, subtitle editing, watermarking and rendering are later
            phases and are marked "not yet" inside the app — no fake features.
          files: dist/*
