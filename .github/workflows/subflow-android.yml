name: subflow-android

# Builds the SubFlow release APK on a real Android toolchain.
# The sandbox this project was written in has no Flutter/JDK/Android SDK, so CI
# is the first place where Dart, Kotlin and the NDK C++ core are actually
# compiled. Everything that *can* be checked without a device runs first and
# gates the APK.

on:
  workflow_dispatch:
    inputs:
      upload_release:
        description: "Attach the APK to the rolling GitHub release"
        type: boolean
        default: false
  push:
    paths:
      - "subflow/**"
      - ".github/workflows/subflow-android.yml"
    branches: ["main", "arena/**"]
  pull_request:
    paths:
      - "subflow/**"
      - ".github/workflows/subflow-android.yml"
  tags:
    - "subflow-v*"

concurrency:
  group: subflow-android-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.24.5
  NDK_VERSION: 26.1.10909125
  CMAKE_VERSION: 3.22.1
  ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

jobs:
  # ---------------------------------------------------------------------------
  # Cheap gate: native core, schema and source-tree checks (no Android SDK).
  # ---------------------------------------------------------------------------
  verify:
    name: native core + schema + structure
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: C++ core unit tests (g++)
        run: make -C subflow/tools/native-core test

      - name: C++ core under ASan + UBSan
        run: make -C subflow/tools/native-core test-asan

      - name: JNI bridge syntax check
        run: make -C subflow/tools/native-core check-jni

      - name: SQLite schema (migrations, constraints, cascades, v1->v2)
        run: python3 subflow/tools/check_schema.py

      - name: Source tree consistency (imports, assets, channel parity, JNI)
        run: python3 subflow/tools/check-project.py

  # ---------------------------------------------------------------------------
  # Real toolchain: analyze, test, build the release APK.
  # ---------------------------------------------------------------------------
  apk:
    name: release APK (arm64-v8a + x86_64)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android NDK and CMake
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "${SDKMANAGER}" --licenses > /dev/null 2>&1 || true
          "${SDKMANAGER}" --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;${NDK_VERSION}" \
            "cmake;${CMAKE_VERSION}"
          echo "NDK installed at ${ANDROID_HOME}/ndk/${NDK_VERSION}"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter / Dart versions
        run: flutter --version

      - name: Platform scaffolding (gradle wrapper, launcher icons, local.properties)
        run: bash subflow/tools/bootstrap-android.sh

      - name: Fetch packages
        working-directory: subflow
        run: flutter pub get

      # Analyzer diagnostics are reported but do not gate the APK: a real
      # compile error still fails the build step below, and this way a style
      # nit can never be the reason the artefact is missing.
      - name: Analyze (diagnostic)
        continue-on-error: true
        working-directory: subflow
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Dart unit tests
        working-directory: subflow
        run: flutter test --reporter expanded

      - name: Write release keystore (when configured)
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        working-directory: subflow/android
        run: |
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 -d > subflow-release.jks
          cat > key.properties <<PROPS
          storeFile=subflow-release.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          PROPS
          echo "release keystore configured"

      - name: Build release APK
        working-directory: subflow
        run: flutter build apk --release --verbose

      - name: Collect artefact
        id: collect
        run: |
          VERSION="$(grep '^version:' subflow/pubspec.yaml | cut -d' ' -f2 | cut -d'+' -f1)"
          mkdir -p dist
          APK="subflow/build/app/outputs/flutter-apk/app-release.apk"
          test -f "$APK" || { echo "APK missing"; find subflow/build -name '*.apk'; exit 1; }
          OUT="dist/subflow-${VERSION}-release.apk"
          cp "$APK" "$OUT"
          ( cd dist && sha256sum "$(basename "$OUT")" > "$(basename "$OUT").sha256" )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          ls -lh dist
          # Fail loudly if the APK does not contain the native core for arm64.
          unzip -l "$OUT" | grep -q "lib/arm64-v8a/libsubflow_core.so" || {
            echo "libsubflow_core.so missing for arm64-v8a"; exit 1; }
          unzip -l "$OUT" | grep -q "lib/arm64-v8a/libapp.so" || {
            echo "Flutter arm64 libapp.so missing"; exit 1; }
          echo "APK content verified (arm64 native core + flutter engine)"

      - name: Upload APK artefact
        uses: actions/upload-artifact@v4
        with:
          name: subflow-release-apk
          path: dist/*
          retention-days: 30
          if-no-files-found: error

      - name: Attach to rolling release
        if: github.event_name == 'workflow_dispatch' && inputs.upload_release || startsWith(github.ref, 'refs/tags/subflow-v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: subflow-apk-latest
          name: SubFlow APK (latest)
          prerelease: true
          allow_updates: true
          body: |
            SubFlow ${{ steps.collect.outputs.version }} — Phase 1 (technical foundation).

            Install: enable "install unknown apps" for your browser/file manager, then open the APK.
            Requires Android 8.0 (API 26) or newer on a 64-bit ARM device.

            What this build really does: video import through the Photo Picker, exact
            technical probing, Media3 playback of the original file, project management,
            the native subtitle codecs / VAD / export-quality planner behind them.
            Speech recognition, subtitle editing and rendering are later phases and are
            marked "not yet" inside the app — no fake features.
          files: dist/*
