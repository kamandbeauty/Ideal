name: Android APK

on:
  workflow_dispatch:
  push:
    branches: ['arena/**']
permissions:
  contents: write
env:
  GODOT_VERSION: 4.7.2-stable
  GODOT_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4

jobs:
  apk:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[apk]')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Cache verified Godot editor
        uses: actions/cache@v4
        with:
          path: ~/.local/godot-bin
          key: godot-${{ env.GODOT_VERSION }}-linux-v1

      - name: Cache export templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates
          key: templates-${{ env.GODOT_VERSION }}-v1

      - name: Install checksum-verified Godot
        run: |
          set -euo pipefail
          mkdir -p ~/.local/godot-bin
          if [ ! -x ~/.local/godot-bin/godot ]; then
            curl -fL --retry 5 --retry-all-errors --retry-delay 5 \
              "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip" \
              -o "$RUNNER_TEMP/godot.zip"
            echo "${GODOT_SHA256}  $RUNNER_TEMP/godot.zip" | sha256sum -c -
            unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
            cp "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}_linux.x86_64" ~/.local/godot-bin/godot
            chmod +x ~/.local/godot-bin/godot
          fi
          echo "$HOME/.local/godot-bin" >> "$GITHUB_PATH"
          ~/.local/godot-bin/godot --headless --version

      - name: Install export templates
        run: |
          set -euo pipefail
          short="${GODOT_VERSION%-stable}"
          target="$HOME/.local/share/godot/export_templates/${short}.stable"
          mkdir -p "$target"
          if [ ! -f "$target/android_debug.apk" ]; then
            curl -fL --retry 5 --retry-all-errors --retry-delay 5 \
              "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz" \
              -o "$RUNNER_TEMP/templates.tpz"
            rm -rf "$RUNNER_TEMP/templates"
            mkdir -p "$RUNNER_TEMP/templates"
            unzip -q "$RUNNER_TEMP/templates.tpz" -d "$RUNNER_TEMP/templates"
            cp -r "$RUNNER_TEMP/templates/templates/." "$target/"
          fi
          ls "$target" | head -20
          test -f "$target/android_debug.apk"

      # Debug signing only: keep sideload updates consistent between builds.
      - name: Restore debug signing identity
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: roadside-debug-signing-v1

      - name: Install Android SDK tools
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends openjdk-17-jdk-headless unzip zip
          java -version

          export ANDROID_HOME="$HOME/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          mkdir -p "$ANDROID_HOME/cmdline-tools" "$HOME/.android"

          if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            curl -fL --retry 5 --retry-all-errors --retry-delay 5 \
              "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
              -o "$RUNNER_TEMP/cmdline-tools.zip"
            rm -rf "$RUNNER_TEMP/cmdline-tools"
            mkdir -p "$RUNNER_TEMP/cmdline-tools"
            unzip -q "$RUNNER_TEMP/cmdline-tools.zip" -d "$RUNNER_TEMP/cmdline-tools"
            mv "$RUNNER_TEMP/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          fi

          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          set +o pipefail
          yes | "$SDKM" --sdk_root="$ANDROID_HOME" --licenses > /dev/null 2>&1 || true
          set -o pipefail
          "$SDKM" --sdk_root="$ANDROID_HOME" --install \
            "platform-tools" "build-tools;34.0.0" "platforms;android-34"

          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/34.0.0" >> "$GITHUB_PATH"

          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" \
              -storetype JKS -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -noprompt \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Import the project
        run: |
          set -euo pipefail
          godot --headless --path . --editor --import > /tmp/import.log 2>&1 || {
            tail -160 /tmp/import.log; exit 1; }
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script' /tmp/import.log; then exit 1; fi

      - name: Validate gameplay before packaging
        run: |
          set -euo pipefail
          status=0
          godot --headless --path . --script res://tests/run_tests.gd > /tmp/tests.log 2>&1 || status=$?
          cat /tmp/tests.log
          if [ "$status" -ne 0 ] || grep -qE 'SCRIPT ERROR|Parse Error|TESTS FAILED' /tmp/tests.log; then
            tail -20 /tmp/tests.log | while IFS= read -r line; do
              echo "::error title=APK tests::${line:0:1200}"
            done
            exit 1
          fi
          status=0
          timeout 180 godot --headless --path . res://tools/traffic_check.tscn > /tmp/traffic.log 2>&1 || status=$?
          cat /tmp/traffic.log
          if [ "$status" -ne 0 ] || grep -qE 'SCRIPT ERROR|Parse Error|TRAFFIC FAILED' /tmp/traffic.log; then
            tail -12 /tmp/traffic.log | while IFS= read -r line; do
              echo "::error title=APK traffic::${line:0:3500}"
            done
            exit 1
          fi
          grep -q 'TRAFFIC OK' /tmp/traffic.log

      - name: Export the APK
        run: |
          status=0
          mkdir -p delivery
          godot --headless --path . --export-debug "Android APK" delivery/RoadsideEmpire.apk \
            > /tmp/export.log 2>&1 || status=$?
          echo "::notice title=export-status::godot exited with $status"
          ls -la delivery || true
          if [ "$status" -ne 0 ] || [ ! -s delivery/RoadsideEmpire.apk ]; then
            msg=$(tail -25 /tmp/export.log | tr '\n' '|' | cut -c1-3500)
            echo "::error title=export-log::$msg"
            exit 1
          fi
          ls -lh delivery/

      - name: Inspect the APK
        run: |
          set -euo pipefail
          APK=delivery/RoadsideEmpire.apk
          BADGING=$("$ANDROID_HOME/build-tools/34.0.0/aapt2" dump badging "$APK")
          echo "$BADGING" | grep -E "^(package|sdkVersion|targetSdkVersion|application-label|native-code|launchable-activity)"
          echo "$BADGING" | grep -q "package: name='com.roadsideempire.tycoon'"
          expected_name=$(sed -n 's/^version\/name="\(.*\)"$/\1/p' export_presets.cfg)
          expected_code=$(sed -n 's/^version\/code=//p' export_presets.cfg)
          test -n "$expected_name" && test -n "$expected_code"
          echo "$BADGING" | grep -Fq "versionName='$expected_name'"
          echo "$BADGING" | grep -Fq "versionCode='$expected_code'"
          echo "$BADGING" | grep -q "native-code: 'arm64-v8a'"
          echo "::notice title=APK package::$(echo "$BADGING" | head -1)"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/signature.txt
          signer=$(grep 'Signer #1 certificate SHA-256 digest:' /tmp/signature.txt)
          echo "::notice title=APK signing::$signer"
          (cd delivery && sha256sum RoadsideEmpire.apk > RoadsideEmpire.apk.sha256)
          echo "::notice title=APK checksum::$(cat delivery/RoadsideEmpire.apk.sha256)"

      - uses: actions/upload-artifact@v4
        with:
          name: roadside-empire-apk
          path: delivery/RoadsideEmpire.apk
          if-no-files-found: error

      - name: Publish the APK to the rolling release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version\/name="\(.*\)"$/\1/p' export_presets.cfg)
          notes=$(printf '%s\n\n%s\n\n%s\n\n%s\n' \
            "Roadside Empire: Idle Tycoon — v${version}, debug-signed Android ARM64 APK." \
            "Bright cartoon town: lime lawns, white kerbs, cool-grey roads, orange gabled roofs, orthographic camera and a light orange/blue illustrated UI. Existing collision bodies, reservations and progression are retained." \
            "Install RoadsideEmpire.apk without uninstalling the existing game. Builds from v1.41 onward reuse the cached debug-signing identity. Compatibility with v1.40 is unverified: if Android reports a conflict, keep the old installation because uninstalling can delete saved progress." \
            "ابتدا بدون حذف نسخهٔ قبلی نصب کنید. اگر خطای تداخل بسته یا امضا دریافت کردید، بازی قبلی را حذف نکنید؛ حذف بازی می‌تواند پیشرفت ذخیره‌شده را پاک کند.")
          notes="$notes"$'\n'"Built from $SHA."
          if ! gh release view roadside-empire-apk > /dev/null 2>&1; then
            gh release create roadside-empire-apk --title "Roadside Empire: Idle Tycoon — Android APK" \
              --target "$SHA" --latest=false --notes "$notes"
          else
            gh release edit roadside-empire-apk --notes "$notes"
          fi
          gh release upload roadside-empire-apk delivery/RoadsideEmpire.apk delivery/RoadsideEmpire.apk.sha256 --clobber
          gh release view roadside-empire-apk --json url -q .url
