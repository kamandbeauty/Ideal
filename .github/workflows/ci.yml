name: javidai-ci
on:
  push:
    branches: ['**']
  workflow_dispatch:
permissions:
  contents: read
  checks: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deliberate failure with annotation
        run: |
          python3 - <<'PY'
          import urllib.parse
          msg = "line1: upstream failure\nline2: 'quoted' & special chars <tag>\nline3: Persian متن فارسی"
          enc = urllib.parse.quote(msg, safe='')
          print(f"::error title=PROBE::{enc}")
          PY
          exit 1
