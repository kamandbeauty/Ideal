name: Project check

# The engine is not available on every machine we work from, so this workflow
# is the authoritative "does the project still import and run" gate: it imports
# the project with the official editor, fails on any script or shader error, and
# then boots the main scene headlessly.

on:
  push:
    branches: ['arena/**']
    paths:
      - 'project.godot'
      - 'scenes/**'
      - 'data/**'
      - 'scripts/**'
      - 'assets/**'
      - 'tests/**'
      - 'tools/**'
      - 'documentation/**'
      - '.github/workflows/ci.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: project-check-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2-stable
  GODOT_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Cache verified Godot editor
        uses: actions/cache@v4
        with:
          path: ~/.local/godot-bin
          key: godot-${{ env.GODOT_VERSION }}-linux-v1

      - name: Install checksum-verified Godot
        run: |
          set -euo pipefail
          mkdir -p ~/.local/godot-bin
          if [ ! -x ~/.local/godot-bin/godot ]; then
            curl -fL --retry 5 --retry-all-errors --retry-delay 5 \
              "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip" \
              -o "$RUNNER_TEMP/godot.zip"
            echo "${GODOT_SHA256}  $RUNNER_TEMP/godot.zip" | sha256sum -c -
            unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
            cp "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}_linux.x86_64" ~/.local/godot-bin/godot
            chmod +x ~/.local/godot-bin/godot
          fi
          echo "$HOME/.local/godot-bin" >> "$GITHUB_PATH"
          ~/.local/godot-bin/godot --headless --version

      - name: Import the project
        run: |
          set -euo pipefail
          godot --headless --path . --editor --import > "$RUNNER_TEMP/import.log" 2>&1 || {
            tail -200 "$RUNNER_TEMP/import.log"
            exit 1
          }
          cat "$RUNNER_TEMP/import.log"
          if grep -nE 'SCRIPT ERROR|Parse Error|Failed to load script|SHADER ERROR|Shader Error' "$RUNNER_TEMP/import.log" > "$RUNNER_TEMP/import-errors.txt"; then
            head -20 "$RUNNER_TEMP/import-errors.txt" | while IFS= read -r line; do
              echo "::error title=Import::${line:0:900}"
            done
            exit 1
          fi

      # Booting the real scene first: if the guild itself stalls, this says so in
      # 90 seconds instead of leaving the suite run to guess. stdbuf keeps the log
      # line-buffered so a killed process still leaves its last words behind.
      - name: Boot the guild headlessly
        if: always()
        run: |
          set +e
          stdbuf -oL -eL timeout 90 godot --headless --path . --quit-after 90 > "$RUNNER_TEMP/boot.log" 2>&1
          status=$?
          echo "::error title=Boot::status=${status} :: $(grep -c '' "$RUNNER_TEMP/boot.log") lines :: $(tail -6 "$RUNNER_TEMP/boot.log" | tr '\n' '|' | tr -s ' ')"
          if [ "$status" -ne 0 ]; then
            tail -40 "$RUNNER_TEMP/boot.log"
            exit 1
          fi

      - name: Run the headless test suites
        run: |
          set +e
          # A hung suite must fail in minutes, not eat the whole job: the timeout
          # names the suite that stalled and the run stops there.
          rm -f documentation/qa/run-trace.txt
          timeout 180 godot --headless --path . --script res://tests/run_tests.gd 2>&1 | tee "$RUNNER_TEMP/tests.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -eq 124 ]; then
            echo "::error title=Tests::timed out after 180s"
            if [ -f documentation/qa/run-trace.txt ]; then
              echo "::error title=Trace::$(grep -c '' documentation/qa/run-trace.txt) lines :: $(tail -8 documentation/qa/run-trace.txt | tr '\n' '|' | tr -s ' ')"
            fi
            exit 1
          fi
          if [ "$status" -ne 0 ] || grep -qE 'SCRIPT ERROR|Parse Error' "$RUNNER_TEMP/tests.log"; then
            grep -nE '^  - |TESTS FAILED|SCRIPT ERROR|Parse Error' "$RUNNER_TEMP/tests.log" \
              > "$RUNNER_TEMP/test-failures.txt" || true
            head -40 "$RUNNER_TEMP/test-failures.txt" | while IFS= read -r line; do
              echo "::error title=Tests::${line:0:900}"
            done
            exit 1
          fi

      - name: Software-rendered play-through with screenshots
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri
          # Run the play-through in the background so its progress can be
          # mirrored into annotations while it works, and bound it with a
          # timeout: a stuck scene should fail in minutes, not eat the job.
          timeout 480 xvfb-run -a -s '-screen 0 1440x810x24' \
            godot --path . --rendering-method gl_compatibility --resolution 1440x810 \
            res://tools/smoke.tscn > "$RUNNER_TEMP/smoke.log" 2>&1 &
          smoke_pid=$!
          for i in $(seq 1 480); do
            kill -0 "$smoke_pid" 2>/dev/null || break
            sleep 1
            if [ $((i % 15)) -eq 0 ]; then
              last=$( (grep -a 'SMOKE' "$RUNNER_TEMP/smoke.log" | tail -1 | tr '\n' ' ' | cut -c1-800) || true )
              echo "::notice title=play-through-${i}s::${last}"
            fi
          done
          wait "$smoke_pid" || true
          cat "$RUNNER_TEMP/smoke.log"
          # Mirror the rig diagnostics and any engine complaint into annotations:
          # they are readable from where we review, unlike the raw job log.
          (grep -aE 'SMOKE: (probe|hero|part|stack)' "$RUNNER_TEMP/smoke.log" || true) | head -30 \
            | while IFS= read -r line; do echo "::notice title=rig::${line:0:900}"; done
          (grep -aE 'ERROR|WARNING|Shader' "$RUNNER_TEMP/smoke.log" || true) | head -12 \
            | while IFS= read -r line; do echo "::warning title=engine::${line:0:900}"; done
          if grep -nE 'SCRIPT ERROR|Parse Error|Invalid call|Nonexistent function' "$RUNNER_TEMP/smoke.log" > "$RUNNER_TEMP/smoke-errors.txt"; then
            head -15 "$RUNNER_TEMP/smoke-errors.txt" | while IFS= read -r line; do
              echo "::error title=Play-through::${line:0:900}"
            done
            exit 1
          fi
          grep -q 'SMOKE OK' "$RUNNER_TEMP/smoke.log" || {
            echo "::error::The play-through did not finish"
            exit 1
          }
          test -s documentation/qa/02-town-fa.png

      - name: Report the guild rig
        # Annotations have their own budget per step, so the rig report gets a step
        # of its own instead of competing with the progress notices.
        if: always()
        run: |
          set -uo pipefail
          if [ -f documentation/qa/guild-probe.txt ]; then
            head -24 documentation/qa/guild-probe.txt \
              | while IFS= read -r line; do echo "::notice title=probe::${line:0:900}"; done
          fi
          if [ -f "$RUNNER_TEMP/smoke.log" ]; then
            (grep -aE 'SMOKE: (probe|hero)' "$RUNNER_TEMP/smoke.log" || true) | head -8 \
              | while IFS= read -r line; do echo "::notice title=rig::${line:0:900}"; done
          fi

      - name: Publish play-through previews
        # Publishing stills is a convenience, never the gate: a push that loses a
        # race must not turn a green play-through into a red check.
        if: github.event_name == 'push'
        continue-on-error: true
        run: |
          set -uo pipefail
          # Keep the play-through log in the repository: the CI log itself is not
          # always reachable from where we review, and a missing mesh or a shader
          # warning must be readable next to the screenshot it produced.
          if [ -f "$RUNNER_TEMP/smoke.log" ]; then
            cp "$RUNNER_TEMP/smoke.log" documentation/qa/smoke.log || true
          fi
          changed=$(git status --porcelain documentation/qa || true)
          if [ -n "$changed" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add documentation/qa || true
            if git commit -m "chore: refresh play-through previews [skip ci]"; then
              git push || echo "::warning title=publish::the previews could not be pushed"
            else
              echo "::notice title=publish::nothing new to publish"
            fi
          else
            echo "::notice title=publish::previews unchanged"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: documentation/qa/*.png
          if-no-files-found: ignore

      - name: Boot the main scene headlessly
        run: |
          set -euo pipefail
          godot --headless --path . --quit-after 120 > "$RUNNER_TEMP/boot.log" 2>&1 || {
            tail -200 "$RUNNER_TEMP/boot.log"
            exit 1
          }
          cat "$RUNNER_TEMP/boot.log"
          if grep -qE 'SCRIPT ERROR|Parse Error|Invalid call|Nonexistent function' "$RUNNER_TEMP/boot.log"; then
            echo "::error::The game reported errors while running"
            exit 1
          fi
