name: javidai-ci
on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write
  checks: write

concurrency:
  group: javidai-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.9'
  JAVA_VERSION: '21'

jobs:
  analyze-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Versions
        run: flutter --version 2>&1 | tee ci-log.txt

      - name: Install dependencies
        run: flutter pub get 2>&1 | tee -a ci-log.txt

      # `set -o pipefail` keeps the real exit status: otherwise `tee` reports
      # success no matter how badly analyze or the tests fail.
      - name: Analyze
        shell: bash
        run: |
          set -o pipefail
          flutter analyze 2>&1 | tee -a ci-log.txt

      # Unit tests only in the blocking step: widget tests need a full frame
      # pipeline and are run separately so they can never hide a unit failure.
      - name: Test (unit)
        shell: bash
        run: |
          set -o pipefail
          flutter test test/unit test/helpers --reporter expanded --timeout 60s 2>&1 | tee -a ci-log.txt

      # Informational for now: widget tests are timing sensitive under the
      # headless CI renderer, so a failure here is reported but does not mask
      # unit-test results.
      - name: Annotate unit-test failures
        if: failure()
        shell: bash
        continue-on-error: true
        run: |
          grep -E '\[E\]|Expected:|Actual:|Error:' ci-log.txt | tail -20 |
            while IFS= read -r line; do
              line="${line//'%'/'%25'}"
              line="${line//$'\r'/}"
              echo "::error title=test failure::$line"
            done || true

      - name: Test (widget)
        if: always()
        shell: bash
        run: |
          set -o pipefail
          flutter test test/widget --reporter expanded --timeout 90s 2>&1 | tee -a ci-log.txt

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --debug 2>&1 | tee -a ci-log.txt

      # The wrapper script is generated by `flutter build`, so the Kotlin tests
      # have to run after it.

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: javidai-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Kotlin unit tests
        shell: bash
        run: |
          set -o pipefail
          cd android && ./gradlew testDebugUnitTest --console=plain 2>&1 | tee -a ../ci-log.txt

      - name: Publish log to branch
        if: always()
        run: |
          {
            echo "# CI log (run $GITHUB_RUN_ID)"
            echo ''
            echo '```'
            tail -c 55000 ci-log.txt
            echo '```'
          } > /tmp/ci-log.md
          git config user.name "javidai-ci"
          git config user.email "ci@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch -q origin "$GITHUB_REF_NAME"
            git checkout -q -B "ci-log-$GITHUB_RUN_ID" "origin/$GITHUB_REF_NAME"
            cp /tmp/ci-log.md ci-log.md
            git add -f ci-log.md
            git commit -q -m "ci: log for run $GITHUB_RUN_ID" || true
            if git push -q origin "HEAD:$GITHUB_REF_NAME"; then
              echo "published log on attempt $attempt"
              exit 0
            fi
            sleep $((attempt * 3))
          done
          echo "could not publish the log; see the job console"
          exit 0
