name: ci

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The database is the part of this project that can be fully verified without Unity,
  # so it is verified on every push: the schema applies clean, and the eight rules that
  # protect the wallet actually hold.
  schema:
    name: postgres schema + constraint smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shazdeh
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGPASSWORD: postgres
      PGHOST: localhost
      PGUSER: postgres
      PGDATABASE: shazdeh
    steps:
      - uses: actions/checkout@v4

      - name: psql version
        run: psql --version

      - name: apply replica/schema.sql
        run: psql -v ON_ERROR_STOP=1 -q -f replica/schema.sql

      - name: constraints smoke test
        run: psql -v ON_ERROR_STOP=1 -f replica/db/smoke.sql

      - name: the schema must apply to an empty database only once
        run: |
          if psql -v ON_ERROR_STOP=1 -q -f replica/schema.sql >/dev/null 2>&1; then
            echo "schema.sql re-applied cleanly onto an existing schema — use idempotent migrations instead"
            exit 1
          fi
          echo "ok: schema.sql is a create-once baseline"

  # Tokens are code: the palette must pass WCAG AA and the generated C# must match the JSON.
  design:
    name: design tokens
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: contrast gate (WCAG AA, exits 1 on any failure)
        run: python3 .claude/skills/replica-design/contrast.py replica/design/tokens.json

      - name: tokens.json -> Tokens.gen.cs is in sync
        run: |
          python3 replica/design/gen_tokens.py
          git diff --exit-code -- client/Assets/Game/Generated/Tokens.gen.cs

      - name: feature matrix parses and scores
        run: python3 .claude/skills/replica-diff/parity.py replica/features.csv --json > /dev/null

  # Levels are content, and content is validated like code: the committed JSON must be exactly what the
  # generator produces, and it must pass the same rules the C# LevelValidator enforces.
  content:
    name: level content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: validate committed levels
        run: python3 tools/levels/gen_levels.py --check

      - name: generator and committed JSON must not drift
        run: |
          python3 tools/levels/gen_levels.py
          git diff --exit-code -- client/Assets/Content/Resources/levels

      # The meta layer (districts, tasks, chests) is content too, and it is validated with the same
      # rules Shazdeh.Content.DistrictParser.Validate enforces on device.
      - name: validate chapter meta
        run: python3 tools/content/check_meta.py

  # C# cannot be compiled here without a Unity licence, but it can be read. The grammar check catches
  # the syntax error a reviewer's eye misses; the static member check catches the member a rename left
  # behind. Neither replaces Unity's compiler — the EditMode suite in unity.yml does that.
  csharp:
    name: c# lint (no unity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: install grammar
        run: pip install -r tools/csharp/requirements.txt

      - name: parse + static member check
        run: python3 tools/csharp/lint.py

  # Persian is the product, so the shaper gets its own gate: the generated letter tables must match the
  # Unicode data, our shaping must agree with a second implementation, and the golden vectors the C#
  # tests compare against must be current.
  text:
    name: persian text
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: install shaper reference
        run: pip install -r tools/text/requirements.txt

      - name: letter tables must match the Unicode database
        run: python3 tools/text/gen_persian_table.py --check

      - name: our shaping vs arabic-reshaper
        run: python3 tools/text/persian_ref.py --check

      - name: golden vectors must not drift
        run: |
          python3 tools/text/persian_ref.py --emit
          git diff --exit-code -- client/Assets/Core.Tests/Generated/PersianGoldenVectors.gen.cs

      # The shaper emits presentation forms, so the typeface must contain them. Most Arabic-script
      # fonts do not; this is the check that keeps the game from shipping a wall of boxes.
      - name: shipped font covers everything the shaper emits
        run: python3 tools/text/check_font.py

  # The art contract has to be valid even when no art exists, and any file that does exist must obey it.
  # --strict (every required asset present) is the release gate, not a per-push gate.
  art:
    name: art contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: contract, catalog and every committed sprite
        run: python3 tools/art/art.py --check

      - name: the sprites the repo has are the sprites the generator draws
        run: |
          python3 -m pip install --quiet --disable-pip-version-check pillow numpy
          python3 tools/art/gen_art.py --check

      - name: the five stones stay distinct at 48 px in greyscale
        run: python3 tools/art/preview.py --check

  # Placeholder that wakes up when the API exists. Keeps the pipeline honest from day one.
  server:
    name: api tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: detect
        run: |
          if [ -f server/package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-node@v4
        if: steps.detect.outputs.present == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: install
        if: steps.detect.outputs.present == 'true'
        run: npm ci --prefix server

      - name: typecheck + test
        if: steps.detect.outputs.present == 'true'
        run: |
          npm run --prefix server typecheck --if-present
          npm test --prefix server --if-present

      - name: nothing to test yet
        if: steps.detect.outputs.present == 'false'
        run: echo "server/ not built yet — job is a no-op"
