name: javidai-ci
on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: javidai-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.47.9'
  JAVA_VERSION: '21'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Diagnostics init
        run: python3 tools/ci/diag.py init

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Versions
        run: python3 tools/ci/diag.py run diag.log -- flutter --version

      - name: Install dependencies
        run: |
          python3 tools/ci/diag.py run diag.log -- flutter pub get
          python3 tools/ci/diag.py publish failure || true

      - name: Analyze
        run: |
          python3 tools/ci/diag.py run diag.log -- flutter analyze
          python3 tools/ci/diag.py publish failure || true

      - name: Test
        run: |
          python3 tools/ci/diag.py run diag.log -- flutter test --reporter expanded
          python3 tools/ci/diag.py publish failure || true

      - name: Build debug APK
        run: |
          python3 tools/ci/diag.py run diag.log -- flutter build apk --debug
          python3 tools/ci/diag.py publish failure || true

      - name: Publish success
        if: success()
        run: python3 tools/ci/diag.py publish success
