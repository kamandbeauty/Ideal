name: javidai-ci
on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write
  checks: write

concurrency:
  group: javidai-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.47.9'
  JAVA_VERSION: '21'

jobs:
  analyze-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Versions
        run: flutter --version 2>&1 | tee ci-log.txt

      - name: Install dependencies
        run: flutter pub get 2>&1 | tee -a ci-log.txt

      - name: Analyze
        run: flutter analyze 2>&1 | tee -a ci-log.txt

      - name: Test
        run: flutter test --reporter expanded 2>&1 | tee -a ci-log.txt

      - name: Build debug APK
        run: flutter build apk --debug 2>&1 | tee -a ci-log.txt

      - name: Publish log to branch
        if: always()
        run: |
          {
            echo "# CI log (run $GITHUB_RUN_ID)"
            echo ''
            echo '```'
            tail -c 55000 ci-log.txt
            echo '```'
          } > ci-log.md
          git config user.name "javidai-ci"
          git config user.email "ci@users.noreply.github.com"
          git add -f ci-log.md
          git commit -m "ci: log for run $GITHUB_RUN_ID" || true
          git pull --rebase --autostash || true
          git push || true
