name: Validate and build Android

on:
  push:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

env:
  GODOT_VERSION: 4.7.1

jobs:
  validate-and-debug-export:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true

      - name: Configure Godot Android SDK
        run: |
          mkdir -p "$HOME/.config/godot"

          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<SETTINGS
          [gd_resource format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          SETTINGS

      - name: Static validation
        run: python tools/validate_project.py

      - name: Import project and validate syntax
        run: |
          godot \
            --headless \
            --editor \
            --path . \
            --import \
            --quit

      - name: Run automated tests
        run: |
          godot \
            --headless \
            --path . \
            --script res://tests/test_runner.gd

      - name: Export debug APK
        run: |
          mkdir -p export

          godot \
            --headless \
            --path . \
            --export-debug "Android Debug" \
            export/RubyRun-debug.apk

          test -s export/RubyRun-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RubyRun-debug-${{ github.sha }}
          path: export/RubyRun-debug.apk
          if-no-files-found: error
          retention-days: 14

  signed-release:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'release'

    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true

      - name: Require and verify signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in \
            KEYSTORE_B64 \
            STORE_PASSWORD \
            KEY_ALIAS \
            KEY_PASSWORD
          do
            if [ -z "${!name}" ]; then
              echo "::error::Required signing secret $name is missing"
              exit 1
            fi
          done

          printf '%s' "$KEYSTORE_B64" \
            | base64 --decode \
            > "$RUNNER_TEMP/release.jks"

          keytool \
            -list \
            -keystore "$RUNNER_TEMP/release.jks" \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            >/dev/null

          # Godot uses the store password for release signing.
          # Normalize only the temporary runner copy when passwords differ.
          if [ "$KEY_PASSWORD" != "$STORE_PASSWORD" ]; then
            keytool \
              -keypasswd \
              -keystore "$RUNNER_TEMP/release.jks" \
              -storepass "$STORE_PASSWORD" \
              -alias "$KEY_ALIAS" \
              -keypass "$KEY_PASSWORD" \
              -new "$STORE_PASSWORD"
          fi

      - name: Inject temporary signing configuration
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          preset = Path("export_presets.cfg")
          content = preset.read_text()

          content = content.replace(
              "@RELEASE_KEYSTORE@",
              os.environ["RUNNER_TEMP"] + "/release.jks",
          )
          content = content.replace(
              "@RELEASE_ALIAS@",
              os.environ["KEY_ALIAS"],
          )
          content = content.replace(
              "@RELEASE_PASSWORD@",
              os.environ["STORE_PASSWORD"],
          )

          preset.write_text(content)
          PY

          mkdir -p "$HOME/.config/godot"
          mkdir -p export

          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<SETTINGS
          [gd_resource format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          SETTINGS

      - name: Import project
        run: |
          godot \
            --headless \
            --editor \
            --path . \
            --import \
            --quit

      - name: Export signed release APK
        run: |
          godot \
            --headless \
            --path . \
            --export-release "Android Release APK" \
            export/RubyRun-release.apk

          test -s export/RubyRun-release.apk

      - name: Export signed release AAB
        run: |
          godot \
            --headless \
            --path . \
            --export-release "Android Release AAB" \
            export/RubyRun-release.aab

          test -s export/RubyRun-release.aab

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" \
            verify \
            --verbose \
            export/RubyRun-release.apk

      - name: Upload signed APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: RubyRun-1.0.0-signed
          path: |
            export/RubyRun-release.apk
            export/RubyRun-release.aab
          if-no-files-found: error
          retention-days: 30
