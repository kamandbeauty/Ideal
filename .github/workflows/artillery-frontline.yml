name: ARTILLERY FRONTLINE
# Final package refresh for Blender art pass 01 (twin HMG UV PBR).
on:
  push:
    branches: [arena/40ad7d87-ideal]
    paths: ['ARTILLERY_FRONTLINE/**', '!ARTILLERY_FRONTLINE/documentation/**', '!ARTILLERY_FRONTLINE/**/*.md', '.github/workflows/artillery-frontline.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: artillery-${{ github.ref }}
  cancel-in-progress: false
env:
  GODOT_VERSION: 4.7.2-stable
  GODOT_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
  PROJECT: ARTILLERY_FRONTLINE
  GRADLE_VERSION: 8.11.1
  GRADLE_SHA256: f397b287023acdba1e9f6fc5ea72d22dd63669d59ed4a289a29b1a76eee151c6
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Cache verified Godot editor
        id: engine-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/godot-bin
          key: godot-4.7.2-stable-linux-v1
      - name: Install checksum-verified Godot
        run: |
          set -euo pipefail
          mkdir -p ~/.local/godot-bin
          if [ ! -x ~/.local/godot-bin/godot ]; then
            curl -fL --retry 5 --retry-all-errors --retry-delay 5 "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip" -o "$RUNNER_TEMP/godot.zip"
            echo "${GODOT_SHA256}  $RUNNER_TEMP/godot.zip" | sha256sum -c -
            unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
            cp "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}_linux.x86_64" ~/.local/godot-bin/godot
            chmod +x ~/.local/godot-bin/godot
          fi
          echo "$HOME/.local/godot-bin" >> "$GITHUB_PATH"
          ~/.local/godot-bin/godot --headless --version
      - name: Import project and compile resources
        run: |
          mkdir -p "$PROJECT/documentation/qa"
          godot --headless --path "$PROJECT" --editor --import > /tmp/import.log 2>&1 || { tail -160 /tmp/import.log; cp /tmp/import.log "$PROJECT/documentation/qa/import.log"; exit 1; }
          cp /tmp/import.log "$PROJECT/documentation/qa/import.log"
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script|SHADER ERROR|Shader Error' /tmp/import.log; then exit 1; fi
      - name: Run dependency-free unit and integration suites
        run: |
          rc=0
          godot --headless --path "$PROJECT" --script res://tests/run_tests.gd > /tmp/tests.log 2>&1 || rc=$?
          cat /tmp/tests.log
          cp /tmp/tests.log "$PROJECT/documentation/qa/tests.log"
          exit "$rc"
      - name: Check test report
        run: python3 "$PROJECT/tools/check_report.py" artillery-test-results.json
      - name: Software-rendered gameplay smoke test
        run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri
          xvfb-run -a -s '-screen 0 1440x810x24' godot --path "$PROJECT" --rendering-method gl_compatibility --resolution 1440x810 -- --smoke-test > /tmp/smoke.log 2>&1 || { tail -100 /tmp/smoke.log; cp /tmp/smoke.log "$PROJECT/documentation/qa/smoke.log"; exit 1; }
          cat /tmp/smoke.log
          cp /tmp/smoke.log "$PROJECT/documentation/qa/smoke.log"
          test -s "$PROJECT/documentation/qa/battlefield.png"
          test -s "$PROJECT/documentation/qa/menu-home.png"
      - name: Software-rendered coastal milestone smoke test
        run: |
          rc=0
          xvfb-run -a -s '-screen 0 1440x810x24' godot --path "$PROJECT" --rendering-method gl_compatibility --resolution 1440x810 -- --coastal-smoke > /tmp/coastal-smoke.log 2>&1 || rc=$?
          cat /tmp/coastal-smoke.log
          cp /tmp/coastal-smoke.log "$PROJECT/documentation/qa/coastal-smoke.log"
          if grep -qiE "shader.*error|ERROR:.*shader" /tmp/coastal-smoke.log; then echo "::error::Shader compile errors detected"; grep -iE "shader.*error|ERROR:.*shader" /tmp/coastal-smoke.log | head -20; exit 1; fi
          if grep -qE "SCRIPT ERROR|Parse Error" /tmp/coastal-smoke.log; then echo "::error::GDScript errors during coastal smoke"; exit 1; fi
          python3 -c "import json,sys; r=json.load(open('$PROJECT/documentation/qa/coastal-smoke-report.json')); sys.exit(0 if r['passed'] and not r['failures'] else 1)" || { echo "::error::Coastal smoke report failed"; exit 1; }
          echo "Coastal smoke report passed; godot teardown exit code $rc (llvmpipe texture-leak teardown tolerated)"
          test -s "$PROJECT/documentation/qa/coastal-beach.png"
          test -s "$PROJECT/documentation/qa/coastal-pause.png"
          test -s "$PROJECT/documentation/qa/coastal-results.png"
          test -s "$PROJECT/documentation/qa/coastal-boss.png"
      - name: Preserve validation evidence
        if: always() && github.ref == 'refs/heads/arena/40ad7d87-ideal'
        run: |
          bash ARTILLERY_FRONTLINE/tools/publish_ci.sh 'test: preserve headless and software-rendered validation evidence' artillery-test-results.json "$PROJECT/documentation/qa"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-evidence
          path: |
            artillery-test-results.json
            ARTILLERY_FRONTLINE/documentation/qa/
  android:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.1.0' 'platform-tools'
      - name: Cache Android export templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates/4.7.2.stable
          key: godot-4.7.2-android-templates-v1
      - name: Install verified editor and Android templates
        run: |
          set -euo pipefail
          mkdir -p ~/.local/godot-bin ~/.local/share/godot/export_templates/4.7.2.stable
          curl -fL --retry 5 --retry-all-errors --retry-delay 5 "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip" -o "$RUNNER_TEMP/godot.zip"
          echo "${GODOT_SHA256}  $RUNNER_TEMP/godot.zip" | sha256sum -c -
          unzip -qo "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          cp "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}_linux.x86_64" ~/.local/godot-bin/godot
          chmod +x ~/.local/godot-bin/godot
          echo "$HOME/.local/godot-bin" >> "$GITHUB_PATH"
          T=~/.local/share/godot/export_templates/4.7.2.stable
          if [ ! -s "$T/android_release.apk" ]; then
            curl -fL --retry 5 --retry-all-errors --retry-delay 5 "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz" -o "$RUNNER_TEMP/templates.tpz"
            unzip -j "$RUNNER_TEMP/templates.tpz" 'templates/android_debug.apk' 'templates/android_release.apk' 'templates/android_source.zip' 'templates/version.txt' -d "$T"
          fi
      - name: Configure SDK paths without credentials
        run: |
          godot --headless --path "$PROJECT" --editor --import > /tmp/import.log 2>&1
          python3 "$PROJECT/tools/configure_editor.py"
      - name: Configure signing entirely in ephemeral runner storage
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.ARTILLERY_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ARTILLERY_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ARTILLERY_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -n "${RELEASE_KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            {
              echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$RUNNER_TEMP/release.keystore"
              echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$RELEASE_KEY_ALIAS"
              echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$RELEASE_KEYSTORE_PASSWORD"
              echo "ARTILLERY_EXPORT_MODE=--export-release"
              echo "ARTILLERY_SIGNING_SCOPE=release secrets"
            } >> "$GITHUB_ENV"
          else
            PASSWORD=$(openssl rand -hex 32)
            keytool -genkeypair -keystore "$RUNNER_TEMP/development.keystore" -storepass "$PASSWORD" -keypass "$PASSWORD" -alias artillery -keyalg RSA -keysize 2048 -validity 30 -dname 'CN=Artillery Frontline Development,O=Frontline,C=DE' >/dev/null 2>&1
            {
              echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$RUNNER_TEMP/development.keystore"
              echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=artillery"
              echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=$PASSWORD"
              echo "ARTILLERY_EXPORT_MODE=--export-debug"
              echo "ARTILLERY_SIGNING_SCOPE=ephemeral development key; not a store release"
            } >> "$GITHUB_ENV"
          fi
      - name: Install Android Gradle build template
        run: |
          T=~/.local/share/godot/export_templates/4.7.2.stable
          mkdir -p "$PROJECT/android/build"
          # Match Godot's own template installer: identifier belongs beside build/,
          # and .gdignore keeps the Java/Gradle sources out of resource imports.
          cp "$T/version.txt" "$PROJECT/android/.build_version"
          unzip -qo "$T/android_source.zip" -d "$PROJECT/android/build"
          touch "$PROJECT/android/build/.gdignore"
          chmod +x "$PROJECT/android/build/gradlew"
          test -s "$PROJECT/android/.build_version"
          grep -q '4.7.2.stable' "$PROJECT/android/.build_version"
      - name: Cache verified Gradle distribution
        uses: actions/cache@v4
        with:
          path: ~/.cache/artillery-gradle
          key: gradle-${{ env.GRADLE_VERSION }}-bin-${{ env.GRADLE_SHA256 }}
      - name: Prefetch verified Gradle distribution for AAB
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cache/artillery-gradle"
          ZIP="$HOME/.cache/artillery-gradle/gradle-${GRADLE_VERSION}-bin.zip"
          if [ -s "$ZIP" ] && ! echo "${GRADLE_SHA256}  $ZIP" | sha256sum -c -; then
            rm -f "$ZIP"
          fi
          if [ ! -s "$ZIP" ]; then
            curl -fL --retry 8 --retry-all-errors --retry-delay 10 --connect-timeout 30 "https://github.com/gradle/gradle-distributions/releases/download/v${GRADLE_VERSION}/gradle-${GRADLE_VERSION}-bin.zip" -o "$ZIP.part"
            echo "${GRADLE_SHA256}  $ZIP.part" | sha256sum -c -
            mv "$ZIP.part" "$ZIP"
          fi
          echo "${GRADLE_SHA256}  $ZIP" | sha256sum -c -
          WRAPPER=$(find "$PROJECT/android/build" -name gradle-wrapper.properties -print -quit)
          test -n "$WRAPPER"
          grep -q "gradle-${GRADLE_VERSION}-bin.zip" "$WRAPPER"
          sed -i "s|^distributionUrl=.*|distributionUrl=file://${ZIP}|" "$WRAPPER"
          cat "$WRAPPER"
      - name: Import resources
        run: godot --headless --path "$PROJECT" --editor --import > /tmp/import.log 2>&1
      - name: Export ARM64 APK and AAB
        run: |
          set -euo pipefail
          mkdir -p delivery
          godot --headless --path "$PROJECT" "$ARTILLERY_EXPORT_MODE" 'Android APK' res://../delivery/Artillery-Frontline-arm64.apk > /tmp/apk.log 2>&1 || { tail -100 /tmp/apk.log; exit 1; }
          godot --headless --path "$PROJECT" "$ARTILLERY_EXPORT_MODE" 'Android AAB' res://../delivery/Artillery-Frontline-arm64.aab > /tmp/aab.log 2>&1 || { tail -100 /tmp/aab.log; exit 1; }
          godot --headless --path "$PROJECT" "$ARTILLERY_EXPORT_MODE" 'Android Compatibility' res://../delivery/Artillery-Frontline-compatibility.apk > /tmp/compat.log 2>&1 || { tail -70 /tmp/compat.log; exit 1; }
      - name: Ensure the AAB carries a verified JAR signature
        run: |
          exec > /tmp/aab-signing.log 2>&1
          set -euo pipefail
          if [ "$ARTILLERY_EXPORT_MODE" = "--export-release" ]; then
            KS_PATH="$GODOT_ANDROID_KEYSTORE_RELEASE_PATH"
            KS_USER="$GODOT_ANDROID_KEYSTORE_RELEASE_USER"
            export KS_PASSWORD="$GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD"
          else
            KS_PATH="$GODOT_ANDROID_KEYSTORE_DEBUG_PATH"
            KS_USER="$GODOT_ANDROID_KEYSTORE_DEBUG_USER"
            export KS_PASSWORD="$GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD"
          fi
          jarsigner -verify delivery/Artillery-Frontline-arm64.aab > /tmp/aab-precheck.txt 2>&1 || true
          if grep -q 'jar verified' /tmp/aab-precheck.txt; then
            echo 'AAB already carries a verified exporter signature'
          else
            jarsigner -sigalg SHA256withRSA -digestalg SHA-256 -keystore "$KS_PATH" -storepass:env KS_PASSWORD -keypass:env KS_PASSWORD -signedjar "$RUNNER_TEMP/Artillery-Frontline-signed.aab" delivery/Artillery-Frontline-arm64.aab "$KS_USER"
            mv "$RUNNER_TEMP/Artillery-Frontline-signed.aab" delivery/Artillery-Frontline-arm64.aab
          fi
          jarsigner -verify -verbose:summary delivery/Artillery-Frontline-arm64.aab > delivery/aab-signature.txt
          grep -q 'jar verified' delivery/aab-signature.txt
      - name: Verify package signatures, architectures and offline manifest
        run: |
          exec > /tmp/package-verify.log 2>&1
          "$ANDROID_HOME/build-tools/36.1.0/apksigner" verify --verbose --print-certs delivery/Artillery-Frontline-arm64.apk > delivery/apk-signature.txt
          "$ANDROID_HOME/build-tools/36.1.0/apksigner" verify --verbose --print-certs delivery/Artillery-Frontline-compatibility.apk > delivery/compatibility-signature.txt
          "$ANDROID_HOME/build-tools/36.1.0/aapt2" dump badging delivery/Artillery-Frontline-arm64.apk > delivery/package-metadata.txt
          "$ANDROID_HOME/build-tools/36.1.0/aapt2" dump badging delivery/Artillery-Frontline-compatibility.apk > delivery/compatibility-package-metadata.txt
          "$ANDROID_HOME/build-tools/36.1.0/aapt2" dump xmltree delivery/Artillery-Frontline-arm64.apk --file AndroidManifest.xml > delivery/AndroidManifest.txt
          "$ANDROID_HOME/build-tools/36.1.0/aapt2" dump xmltree delivery/Artillery-Frontline-compatibility.apk --file AndroidManifest.xml > delivery/compatibility-AndroidManifest.txt
          jarsigner -verify -verbose:summary delivery/Artillery-Frontline-arm64.aab > delivery/aab-signature.txt
          grep -q 'jar verified' delivery/aab-signature.txt
          python3 "$PROJECT/tools/verify_packages.py" delivery
          mkdir -p "$RUNNER_TEMP/compatibility-package"
          mv delivery/Artillery-Frontline-compatibility.apk delivery/Artillery-Frontline-compatibility.apk.idsig "$RUNNER_TEMP/compatibility-package/" 2>/dev/null || true
          sha256sum delivery/*.apk delivery/*.aab > delivery/SHA256SUMS.txt
          {
            printf 'Source commit: %s\n' "$GITHUB_SHA"
            printf 'Engine: Godot %s\n' "$GODOT_VERSION"
            printf 'Signing: %s\n' "$ARTILLERY_SIGNING_SCOPE"
            printf 'Validation: CI signatures, ARM64, ZIP CRC, landscape manifest and offline permissions; no device/emulator execution\n'
          } > delivery/BUILD-STATUS.txt
      - name: Export x86_64 QA APK for Android runtime smoke
        run: |
          godot --headless --path "$PROJECT" --export-debug 'Android QA Emulator' "$RUNNER_TEMP/Artillery-Frontline-qa-x86_64.apk" > /tmp/qa-apk.log 2>&1 || { tail -80 /tmp/qa-apk.log; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: android-qa-apk
          path: ${{ runner.temp }}/Artillery-Frontline-qa-x86_64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-compatibility-apk
          path: ${{ runner.temp }}/compatibility-package/
      - name: Publish downloadable packages to the session branch
        if: github.ref == 'refs/heads/arena/40ad7d87-ideal'
        run: |
          bash ARTILLERY_FRONTLINE/tools/publish_ci.sh 'build: deliver verified ARM64 Android packages' delivery
      - name: Publish build diagnostics
        if: failure()
        run: |
          if [ -f /tmp/aab-signing.log ]; then
            tail -90 /tmp/aab-signing.log | while IFS= read -r line; do echo "::error title=AAB signing::${line}"; done
          fi
          if [ -f /tmp/package-verify.log ]; then
            tail -90 /tmp/package-verify.log | while IFS= read -r line; do echo "::error title=Package verification::${line}"; done
          fi
          for log in /tmp/import.log /tmp/apk.log /tmp/aab.log /tmp/compat.log; do
            if [ -f "$log" ]; then
              grep -E 'ERROR|Error|FAILURE|What went wrong|failed|Failed|configuration|SDK|keystore|Gradle' "$log" | tail -25 | while IFS= read -r line; do echo "::error title=Android build::${line}"; done
              sed -n '/due to configuration errors/,+12p' "$log" | while IFS= read -r line; do echo "::error title=Android configuration::${line}"; done
            fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Artillery-Frontline-Android
          path: delivery/
          if-no-files-found: ignore

