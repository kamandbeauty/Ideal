name: net-probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe hosts and the preinstalled GL bits
        run: |
          for h in azure.archive.ubuntu.com archive.ubuntu.com security.ubuntu.com dl.google.com conda.anaconda.org pypi.org; do
            code=$(curl -sS -m 12 -o /dev/null -w '%{http_code}' "http://$h/" 2>&1 || true)
            echo "$h -> $code"
          done
          echo "--- preinstalled"
          which Xvfb xvfb-run || true
          ls /usr/lib/x86_64-linux-gnu/ | grep -E '^libGL|^libEGL|^libgallium|swrast' || true
          ls /usr/lib/x86_64-linux-gnu/dri 2>/dev/null | head || echo "no dri dir"
          echo "--- apt sources"
          cat /etc/apt/sources.list.d/*.sources 2>/dev/null | head -20 || cat /etc/apt/sources.list | head -20
