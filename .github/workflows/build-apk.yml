name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "arena/01e7698d-ideal"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Stable that satisfies pubspec (flutter >= 3.27.0).
          flutter-version: "3.35.5"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Fast full-program type check: the Dart compiler lists every error at
      # once, so a single run reveals the whole remaining fix list. The log
      # download host is unreachable from some networks, so on failure the
      # error list is posted as a commit comment (readable via the API).
      - name: Analyze Dart
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # flutter analyze is fatal on warnings by default; only real errors
          # should block the build. Warnings are reported for reference.
          flutter analyze --no-pub > analyze-log.txt 2>&1 || true
          ERRS=$(grep -c 'error •' analyze-log.txt || true)
          WARNS=$(grep -c 'warning •' analyze-log.txt || true)
          echo "analyze: ${ERRS} errors, ${WARNS} warnings"
          if [ "${ERRS}" -gt 0 ]; then
            {
              echo "Dart analysis failed (run ${GITHUB_RUN_ID})."
              echo "Error count: ${ERRS}"
              echo '```'
              grep 'error •' analyze-log.txt | head -120
              echo '```'
            } > commit-comment.md
            gh api repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments \
              -F body=@commit-comment.md
            exit 1
          fi
          if [ "${WARNS}" -gt 0 ]; then
            echo "warnings (non-blocking):"
            grep 'warning •' analyze-log.txt | head -20
          fi

      - name: Build debug APK
        run: |
          set -o pipefail
          flutter build apk --debug 2>&1 | tee build-log.txt

      - name: Post build log tail on failure
        if: failure() && file_exists(build-log.txt)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Build failed (run ${GITHUB_RUN_ID}). Last 80 log lines:"
            echo '```'
            tail -n 80 build-log.txt
            echo '```'
          } > commit-comment.md
          gh api repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments \
            -F body=@commit-comment.md

      - name: Collect APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-debug.apk dist/motionshot-debug.apk
          ls -lh dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: motionshot-apk
          path: dist/motionshot-debug.apk
          retention-days: 30

  # Publishes a permanent download link as a release asset (tag apk-latest);
  # each successful build overwrites the previous APK.
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: motionshot-apk
          path: dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: MotionShot APK
          body: |
            MotionShot — debug APK (build ${{ github.sha }})

            Install: copy `motionshot-debug.apk` to the phone and open it
            (allow "install unknown apps").
          files: dist/*.apk
          fail_on_unmatched_files: true
          overwrite: true
