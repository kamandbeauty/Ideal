name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "arena/01e7698d-ideal"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Latest stable that satisfies pubspec (flutter >= 3.27.0).
          flutter-version: ">=3.27.0 <4.0.0"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Collect APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-debug.apk dist/motionshot-debug.apk
          ls -lh dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: motionshot-apk
          path: dist/motionshot-debug.apk
          retention-days: 30

  # Publishes a permanent download link (release asset) when the workflow is
  # triggered manually (Actions -> Build APK -> Run workflow).
  release:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: motionshot-apk
          path: dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: MotionShot APK
          body: |
            MotionShot — debug APK (build ${{ github.sha }})

            Install: copy `motionshot-debug.apk` to the phone and open it
            (allow "install unknown apps").
          files: dist/*.apk
          fail_on_unmatched_files: true
          overwrite: true
