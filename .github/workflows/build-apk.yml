name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "arena/01e7698d-ideal"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Stable that satisfies pubspec (flutter >= 3.27.0).
          flutter-version: "3.35.5"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Fast full-program type check: the Dart compiler lists every error at
      # once, so a single run reveals the whole remaining fix list. The log
      # download host is unreachable from some networks, so on failure the
      # error list is posted as a commit comment (readable via the API).
      - name: Analyze Dart
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # flutter analyze is fatal on warnings by default; only real errors
          # should block the build. Warnings are reported for reference.
          flutter analyze --no-pub > analyze-log.txt 2>&1 || true
          ERRS=$(grep -c 'error •' analyze-log.txt || true)
          WARNS=$(grep -c 'warning •' analyze-log.txt || true)
          echo "analyze: ${ERRS} errors, ${WARNS} warnings"
          if [ "${ERRS}" -gt 0 ]; then
            {
              echo "Dart analysis failed (run ${GITHUB_RUN_ID})."
              echo "Error count: ${ERRS}"
              echo '```'
              grep 'error •' analyze-log.txt | head -120
              echo '```'
            } > commit-comment.md
            gh api repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments \
              -F body=@commit-comment.md
            exit 1
          fi
          if [ "${WARNS}" -gt 0 ]; then
            echo "warnings (non-blocking):"
            grep 'warning •' analyze-log.txt | head -20
          fi

      # Release (AOT) APKs, one per ABI: a debug APK is ~145 MB (unstripped
      # symbols, debug engine, JIT); a release split per ABI is ~3x smaller
      # and runs 3-10x faster. Signing key: android/key.properties.
      - name: Build release APKs (per ABI)
        run: |
          set -o pipefail
          flutter build apk --release --split-per-abi 2>&1 | tee build-log.txt

      - name: Post build log tail on failure
        if: failure() && hashFiles('build-log.txt') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Build failed (run ${GITHUB_RUN_ID}). Last 80 log lines:"
            echo '```'
            tail -n 80 build-log.txt
            echo '```'
          } > commit-comment.md
          gh api repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments \
            -F body=@commit-comment.md

      # Filenames use the device class (not the raw ABI) so it is obvious which
      # file to install: "new phones" / "old phones" / "emulator".
      - name: Collect APKs
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/motionshot-new-phones.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/motionshot-old-phones.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk dist/motionshot-emulator.apk
          ls -lh dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: motionshot-apk
          path: dist/*.apk
          retention-days: 30

  # Publishes a permanent download link as a release asset (tag apk-latest);
  # each successful build overwrites the previous APK.
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: motionshot-apk
          path: dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: MotionShot APK
          body: |
            MotionShot — release APK (build ${{ github.sha }})

            **Pick the file for your phone:**
            - `motionshot-new-phones.apk` — Newer phones (64-bit / arm64). Every phone from ~2017 onward. **Choose this.**
            - `motionshot-old-phones.apk` — Older 32-bit phones (armv7).
            - `motionshot-emulator.apk` — Emulators / development (x86_64).

            Requires Android 7.0 (API 24) or newer.
            Install: copy the APK to the phone and open it
            (allow "install unknown apps").

            برای گوشی جدید: `motionshot-new-phones.apk` را انتخاب کنید.
          files: dist/*.apk
          fail_on_unmatched_files: true
          overwrite_files: true
