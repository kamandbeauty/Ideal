name: godot-port

on:
  push:
    branches: [feature/godot-migration]
    paths:
      - "godot-port/**"
      - ".github/workflows/godot-port.yml"

permissions:
  contents: read

concurrency:
  group: godot-port-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Godot 4 headless import and core tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot 4.4.1
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false

      - name: Import project and build global class cache
        run: godot --headless --editor --path godot-port --quit

      - name: Validate every GDScript file
        run: godot --headless --path godot-port --script res://tests/validate_scripts.gd

      - name: Run core and UI smoke tests
        run: godot --headless --path godot-port --script res://tests/test_core.gd

  android-debug-export:
    name: Android debug APK export
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenJDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Godot Android SDK components
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "build-tools;34.0.0" "platforms;android-34" "cmdline-tools;latest" "cmake;3.10.2.4988404" "ndk;23.2.8568313"

      - name: Install Godot 4.4.1 with Android export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true

      - name: Configure Godot Android paths
        run: |
          mkdir -p "$HOME/.config/godot" "$HOME/.android"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Import project
        run: godot --headless --editor --path godot-port --quit

      - name: Export debug APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ runner.temp }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p godot-port/build
          cp "$HOME/.android/debug.keystore" "${{ runner.temp }}/debug.keystore"
          godot --headless --path godot-port --install-android-build-template --export-debug "Android" build/princespalace-debug.apk
          test -f godot-port/android/build/build.gradle
          test -s godot-port/build/princespalace-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: princespalace-android-debug
          path: godot-port/build/princespalace-debug.apk
          if-no-files-found: error
