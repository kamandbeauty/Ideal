name: godot-port

on:
  push:
    branches: [arena/d42cf39b-ideal]
    paths:
      - "godot-port/**"
      - ".github/workflows/godot-port.yml"
  pull_request:
    paths:
      - "godot-port/**"
      - ".github/workflows/godot-port.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godot-port-${{ github.ref }}
  cancel-in-progress: true

jobs:
  headless:
    name: Godot 4 headless import, script validation and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot 4.4.1
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false

      - name: Import project and build the global class cache
        run: godot --headless --editor --path godot-port --quit

      - name: Validate every GDScript file
        run: godot --headless --path godot-port --script res://tests/validate_scripts.gd

      - name: Report the exact parse error of every failing script
        if: failure()
        run: |
          set +e
          for file in $(find godot-port -name '*.gd' -not -path '*/.godot/*' | sort); do
            res="res://${file#godot-port/}"
            output=$(godot --headless --path godot-port --check-only --script "$res" 2>&1)
            status=$?
            if [ $status -ne 0 ]; then
              echo "--- $file (exit $status)"
              echo "$output"
              message=$(echo "$output" | grep -E "Parse Error|SCRIPT ERROR|error|Error" | head -2 | tr '\n' ' ' | cut -c1-400)
              echo "::error file=$file::$message"
            fi
          done
          exit 0

      - name: Core tests (rules, determinism, save, content)
        run: godot --headless --path godot-port --script res://tests/test_core.gd

      - name: UI tests (Persian numerals, kit, session, board, every level)
        run: godot --headless --path godot-port --script res://tests/test_ui.gd

      - name: Boot the game headlessly and prove it reaches the title screen
        run: |
          godot --headless --path godot-port --quit-after 120 2>&1 | tee boot.log
          grep -q "\[boot\] save at" boot.log

  android-debug:
    name: Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: headless
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenJDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The prebuilt SDK actions keep changing their input surface (and setup-android@v3 fails on the
      # current runner image). Fetching the command line tools from Google and driving sdkmanager
      # ourselves is two steps of shell and cannot drift under us.
      - name: Install the Android command line tools
        run: |
          set -euo pipefail
          SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -sSfL -o /tmp/cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline-tools.zip -d "$SDK_ROOT/cmdline-tools"
          mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Accept licences and install the SDK packages Godot asks for
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platform-tools" "build-tools;34.0.0" "platforms;android-34" | tail -3
          sdkmanager --list_installed | head -20

      - name: Install Godot 4.4.1 with Android export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true

      - name: Create the debug keystore
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Point Godot's editor settings at the SDK and the debug key
        run: python3 godot-port/tools/write_editor_settings.py

      # setup-godot installs the desktop templates; the Android ones are the reason an export fails with
      # an empty "configuration errors" list, so make sure the official .tpz is unpacked where Godot
      # looks for it, and publish the directory listing either way.
      - name: Make sure the Android export templates are installed
        run: |
          set -euo pipefail
          TEMPLATES="$HOME/.local/share/godot/export_templates/4.4.1.stable"
          if [ ! -f "$TEMPLATES/android_debug.apk" ]; then
            echo "android_debug.apk missing — installing the official export templates"
            mkdir -p "$TEMPLATES"
            curl -sSfL -o /tmp/templates.tpz \
              https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz
            rm -rf /tmp/templates && mkdir -p /tmp/templates
            unzip -q -o /tmp/templates.tpz -d /tmp/templates
            cp /tmp/templates/templates/* "$TEMPLATES"/
          fi
          ls -l "$TEMPLATES" > /tmp/templates.txt
          cat /tmp/templates.txt
          test -f "$TEMPLATES/android_debug.apk"

      - name: Import project
        run: godot --headless --editor --path godot-port --quit

      - name: Show the settings Godot will read
        run: |
          ls -l "$HOME/.config/godot" || true
          cat "$HOME/.config/godot/editor_settings-4.tres" || true

      - name: Export with the prebuilt template (fast path)
        id: export_template
        continue-on-error: true
        run: |
          set +e
          mkdir -p godot-port/build
          timeout 240 godot --headless --path godot-port --export-debug "Android" \
            build/princes-palace-debug.apk > /tmp/template.log 2>&1
          echo "template export exit: $?"
          test -s godot-port/build/princes-palace-debug.apk

      # `--install-android-build-template` is a modifier for an export command, not a standalone
      # action: it installs the Gradle tree and then exports in the same run. Gradle is also the only
      # path that honours a custom package id and explicit SDK levels, which a store build needs.
      - name: Export through a Gradle build
        if: steps.export_template.outcome == 'failure'
        run: |
          set +e
          sed -i 's|gradle_build/use_gradle_build=false|gradle_build/use_gradle_build=true|' \
            godot-port/export_presets.cfg
          sed -i 's|gradle_build/min_sdk=""|gradle_build/min_sdk="23"|' godot-port/export_presets.cfg
          sed -i 's|gradle_build/target_sdk=""|gradle_build/target_sdk="34"|' godot-port/export_presets.cfg
          timeout 2400 godot --headless --path godot-port --install-android-build-template \
            --export-debug "Android" build/princes-palace-debug.apk > /tmp/gradle.log 2>&1
          status=$?
          echo "gradle export exit: $status"
          ls -l godot-port/build || true
          if [ $status -ne 0 ] || [ ! -s godot-port/build/princes-palace-debug.apk ]; then
            python3 godot-port/tools/annotate_log.py /tmp/gradle.log godot-port/export_presets.cfg || true
            exit 1
          fi

      - name: Verify the APK really is an APK
        run: |
          set -e
          apk=godot-port/build/princes-palace-debug.apk
          test -s "$apk"
          file "$apk" | grep -qi "zip\|apk\|android"
          unzip -l "$apk" | grep -q "AndroidManifest.xml"
          unzip -l "$apk" | grep -q "classes.dex"
          echo "APK verified: $(stat -c%s "$apk") bytes"

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: princes-palace-debug-apk
          path: godot-port/build/princes-palace-debug.apk
          if-no-files-found: error

  export-diagnostic:
    # Isolated probe: does *any* export work on this runner, and what does Godot's own CLI say about
    # Android? It never gates anything — it exists so a refused Android export can be explained.
    name: Export diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot 4.4.1 with templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true

      - name: Import project
        run: godot --headless --editor --path godot-port --quit

      - name: Record the CLI's Android options and the preset file as Godot sees it
        run: |
          set +e
          godot --headless --help > /tmp/help.txt 2>&1
          grep -iE "android|export" /tmp/help.txt > /tmp/help-android.txt
          python3 godot-port/tools/annotate_log.py /tmp/help-android.txt .github/workflows/godot-port.yml || true
          ls -l "$HOME/.local/share/godot/export_templates/4.4.1.stable/" > /tmp/templates.txt 2>&1
          python3 godot-port/tools/annotate_log.py /tmp/templates.txt godot-port/export_presets.cfg || true

      - name: Try a Linux export to prove the export machinery works
        run: |
          set +e
          mkdir -p godot-port/build
          timeout 300 godot --headless --path godot-port --export-debug "Linux" build/desktop.x86_64 \
            > /tmp/linux.log 2>&1
          echo "linux export exit: $?"
          ls -l godot-port/build
          python3 godot-port/tools/annotate_log.py /tmp/linux.log .github/workflows/godot-port.yml || true

      - name: Narrow the Android failure to one stage
        run: |
          set +e
          mkdir -p godot-port/build
          # 1. pack only: no signing, no SDK, no keystore — does the preset validate at all?
          timeout 300 godot --headless --path godot-port --export-pack "Android" build/game.pck \
            > /tmp/pack.log 2>&1
          echo "pack exit: $?" && ls -l godot-port/build/game.pck 2>/dev/null
          python3 godot-port/tools/annotate_log.py /tmp/pack.log .github/workflows/godot-port.yml || true

          # 2. unsigned APK: if this succeeds, signing is what refuses.
          cp godot-port/export_presets.cfg /tmp/preset.bak
          sed -i 's|package/signed=true|package/signed=false|' godot-port/export_presets.cfg
          timeout 300 godot --headless --path godot-port --export-debug "Android" build/unsigned.apk \
            > /tmp/unsigned.log 2>&1
          echo "unsigned exit: $?" && ls -l godot-port/build/unsigned.apk 2>/dev/null
          python3 godot-port/tools/annotate_log.py /tmp/unsigned.log .github/workflows/godot-port.yml || true

          # 3. a release-mode export, in case only the debug path is broken.
          cp /tmp/preset.bak godot-port/export_presets.cfg
          timeout 300 godot --headless --path godot-port --export-release "Android" build/release.apk \
            > /tmp/release.log 2>&1
          echo "release exit: $?" && ls -l godot-port/build/release.apk 2>/dev/null
          python3 godot-port/tools/annotate_log.py /tmp/release.log .github/workflows/godot-port.yml || true

      - name: Try the Android export verbosely
        run: |
          set +e
          timeout 300 godot --headless --verbose --path godot-port --export-debug "Android" \
            build/probe.apk > /tmp/android.log 2>&1
          echo "android export exit: $?"
          python3 godot-port/tools/annotate_log.py /tmp/android.log godot-port/export_presets.cfg || true
