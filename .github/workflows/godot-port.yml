name: godot-port

on:
  push:
    branches: [arena/d42cf39b-ideal]
    paths:
      - "godot-port/**"
      - ".github/workflows/godot-port.yml"
  pull_request:
    paths:
      - "godot-port/**"
      - ".github/workflows/godot-port.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godot-port-${{ github.ref }}
  cancel-in-progress: true

jobs:
  headless:
    name: Godot 4 headless import, script validation and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot 4.4.1
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false

      - name: Import project and build the global class cache
        run: godot --headless --editor --path godot-port --quit

      - name: Validate every GDScript file
        run: godot --headless --path godot-port --script res://tests/validate_scripts.gd

      - name: Report the exact parse error of every failing script
        if: failure()
        run: |
          set +e
          for file in $(find godot-port -name '*.gd' -not -path '*/.godot/*' | sort); do
            res="res://${file#godot-port/}"
            output=$(godot --headless --path godot-port --check-only --script "$res" 2>&1)
            status=$?
            if [ $status -ne 0 ]; then
              echo "--- $file (exit $status)"
              echo "$output"
              message=$(echo "$output" | grep -E "Parse Error|SCRIPT ERROR|error|Error" | head -2 | tr '\n' ' ' | cut -c1-400)
              echo "::error file=$file::$message"
            fi
          done
          exit 0

      - name: Core tests (rules, determinism, save, content)
        run: godot --headless --path godot-port --script res://tests/test_core.gd

      - name: UI tests (Persian numerals, kit, session, board, every level)
        run: godot --headless --path godot-port --script res://tests/test_ui.gd

      - name: Boot the game headlessly and prove it reaches the title screen
        run: |
          godot --headless --path godot-port --quit-after 120 2>&1 | tee boot.log
          grep -q "\[boot\] save at" boot.log

  android-debug:
    name: Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: headless
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenJDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install the SDK packages Godot asks for
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "build-tools;34.0.0" "platforms;android-34" "cmdline-tools;latest"

      - name: Install Godot 4.4.1 with Android export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true

      - name: Create the debug keystore
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Point Godot's editor settings at the SDK and the debug key
        run: python3 - <<'PY'
          import os
          from pathlib import Path
          home = Path(os.environ["HOME"])
          sdk = os.environ.get("ANDROID_HOME") or os.environ.get("ANDROID_SDK_ROOT", "")
          java = os.environ.get("JAVA_HOME", "")
          settings_dir = home / ".config" / "godot"
          settings_dir.mkdir(parents=True, exist_ok=True)
          (settings_dir / "editor_settings-4.4.tres").write_text(
              '[gd_resource type="EditorSettings" format=3]\n\n[resource]\n'
              f'export/android/android_sdk_path = "{sdk}"\n'
              f'export/android/java_sdk_path = "{java}"\n'
              f'export/android/debug_keystore = "{home}/.android/debug.keystore"\n'
              'export/android/debug_keystore_user = "androiddebugkey"\n'
              'export/android/debug_keystore_pass = "android"\n',
              encoding="utf-8")
          print(f"sdk={sdk} java={java}")
          PY

      - name: Import project
        run: godot --headless --editor --path godot-port --quit

      - name: Export the debug APK
        run: |
          mkdir -p godot-port/build
          godot --headless --path godot-port --export-debug "Android" build/princes-palace-debug.apk
          ls -l godot-port/build

      - name: Verify the APK really is an APK
        run: |
          set -e
          apk=godot-port/build/princes-palace-debug.apk
          test -s "$apk"
          file "$apk" | grep -qi "zip\|apk\|android"
          unzip -l "$apk" | grep -q "AndroidManifest.xml"
          unzip -l "$apk" | grep -q "classes.dex"
          echo "APK verified: $(stat -c%s "$apk") bytes"

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: princes-palace-debug-apk
          path: godot-port/build/princes-palace-debug.apk
          if-no-files-found: error
