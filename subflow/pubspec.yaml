name: subflow
description: SubFlow - Professional Offline AI Subtitle & Video Editor for Android.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # State + navigation
  flutter_riverpod: ^2.5.1
  go_router: ^14.6.2
  # Storage. SQLite is the source of truth; heavy media work stays native.
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.4
  # Formatting of numbers/dates only - all media work is native.
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

# Everything runs offline: no fonts are fetched at runtime, no network calls.
flutter:
  uses-material-design: true
  assets:
    # The SQL migrations are executed at runtime, so they ship as assets.
    - assets/db/
    # assets/templates/ is added in Phase 4 together with the caption presets.
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
          weight: 400
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
        - asset: assets/fonts/Vazirmatn-ExtraBold.ttf
          weight: 800
