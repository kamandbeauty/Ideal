name: subflow
description: SubFlow - Professional Offline AI Subtitle & Video Editor for Android.
publish_to: "none"
version: 0.10.0+13

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # State + navigation
  flutter_riverpod: ^2.5.1
  go_router: ^14.6.2
  # Storage. SQLite is the source of truth; heavy media work stays native.
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.4
  # Formatting of numbers/dates only - all media work is native.
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Runs the real SQLite engine in `flutter test`, so the database open path
  # (pragmas + migrations + DAO round-trips) is verified instead of assumed.
  sqflite_common_ffi: ^2.3.3

# Everything runs offline: no fonts are fetched at runtime, no network calls.
flutter:
  uses-material-design: true
  assets:
    # The SQL migrations are executed at runtime, so they ship as assets.
    - assets/db/
    - assets/images/
    # assets/templates/ is added in Phase 4 together with the caption presets.
  fonts:
    # ------------------------------------------------------------------ Persian
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
          weight: 400
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
        - asset: assets/fonts/Vazirmatn-ExtraBold.ttf
          weight: 800
    - family: Estedad
      fonts:
        - asset: assets/fonts/Estedad-Regular.ttf
          weight: 400
        - asset: assets/fonts/Estedad-Bold.ttf
          weight: 700
        - asset: assets/fonts/Estedad-ExtraBold.ttf
          weight: 800
    - family: Sahel
      fonts:
        - asset: assets/fonts/Sahel-Regular.ttf
          weight: 400
        - asset: assets/fonts/Sahel-Bold.ttf
          weight: 700
    - family: Samim
      fonts:
        - asset: assets/fonts/Samim-Regular.ttf
          weight: 400
        - asset: assets/fonts/Samim-Bold.ttf
          weight: 700
    - family: Shabnam
      fonts:
        - asset: assets/fonts/Shabnam-Regular.ttf
          weight: 400
        - asset: assets/fonts/Shabnam-Bold.ttf
          weight: 700
    - family: Tanha
      fonts:
        - asset: assets/fonts/Tanha-Regular.ttf
    - family: Lalezar
      fonts:
        - asset: assets/fonts/Lalezar-Regular.ttf
    # ------------------------------------------------- "viral" Latin display
    - family: Archivo Black
      fonts:
        - asset: assets/fonts/ArchivoBlack-Regular.ttf
    - family: Bebas Neue
      fonts:
        - asset: assets/fonts/BebasNeue-Regular.ttf
    - family: Anton
      fonts:
        - asset: assets/fonts/Anton-Regular.ttf
